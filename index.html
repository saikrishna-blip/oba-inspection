  html+=`<div class="samp-table">
  <div class="samp-head" style="padding:10px 16px;display:flex;align-items:center;gap:12px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)">
    <div style="width:30px;flex-shrink:0"></div>
    <div style="width:220px;flex-shrink:0">Serial number</div>
    <div style="flex-shrink:0">Aesthetic, general, functional, screen, black dot <span style="font-weight:400;color:var(--ink-3)">(tap to mark fail)</span></div>
    <div style="flex:1"></div>
    <div style="width:104px;text-align:center;flex-shrink:0">Result</div>
  </div>`;

  samples.forEach((s,i)=>{
    const r=sampleResult(s);
    const rCls=r==='PASS'?'res-pass':r==='FAIL-MINOR'?'res-minor':r==='FAIL-MAJOR'?'res-major':'res-pending';
    const rLbl=r==='PASS'?'Pass':r==='FAIL-MINOR'?'Minor fail':r==='FAIL-MAJOR'?'Major fail':'Pending';
    const rBg=r==='PASS'?'background:var(--lime);color:var(--ink)':r==='FAIL-MINOR'?'background:#F2B33D;color:var(--ink)':r==='FAIL-MAJOR'?'background:var(--fail);color:var(--ink)':'background:var(--sunk);color:var(--ink-3)';
    const bd=evalBD(s);
    const isExpanded=expandedSample===i;
    const hasBDIssue=!s.bdNoDot;
    const bdBtnCls=s.bdNoDot?'':(bd.ok?'bd-active-ok':'bd-active-fail');
    const bdBtnLabel=s.bdNoDot?'No dot':(s.bdVisible?(bd.incomplete?'Dot: finish':(bd.ok?'Dot OK':'Dot fail')):'Dot <2m view');

    html+=`<div class="samp-row ${r.startsWith('FAIL')?'is-fail':''}" id="samp-row-${i}">
      <div class="samp-num-badge">${i+1}</div>

      <div class="samp-serial-wrap">
        <input class="samp-serial-inp sSerial ${s.serialError?'err-field':''}" data-i="${i}" type="text" value="${s.serial}" placeholder="${activeSpec?activeSpec.code:'????'}${String(lot.prodMonthCode||'????').padStart(4,'0')}0000001">
        ${s.serialError?`<div class="err" style="margin-top:3px">${s.serialError}</div>`:''}
      </div>

      <div class="samp-toggles">
        <button class="mini-toggle ${s.aestheticPass?'mini-toggle-pass':'mini-toggle-fail'} sToggle" data-i="${i}" data-f="aestheticPass" title="Aesthetic (Minor)">Aes</button>
        <button class="mini-toggle ${s.generalPass?'mini-toggle-pass':'mini-toggle-fail'} sToggle" data-i="${i}" data-f="generalPass" title="General (Major)">Gen</button>
        <button class="mini-toggle ${s.funcPass?'mini-toggle-pass':'mini-toggle-fail'} sToggle" data-i="${i}" data-f="funcPass" title="Functional (Major)">Func</button>
        <button class="mini-toggle ${s.screenPass?'mini-toggle-pass':'mini-toggle-fail'} sToggle" data-i="${i}" data-f="screenPass" title="Screen (Major)">Scr</button>
        <button class="samp-bd-toggle ${bdBtnCls} bdExpandBtn" data-i="${i}" title="Black Dot">${bdBtnLabel}</button>
      </div>

      <div class="samp-spacer"></div>

      <span class="samp-result-tag" style="${rBg}">${rLbl}</span>

      ${isExpanded?`
      <div class="samp-expand">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px">
          <span class="lbl" style="margin-bottom:0">Black Dot Detail</span>
          <span class="text-muted" style="font-size:12px;font-family:var(--num)">${esc(specText(activeSpec))}</span>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px">
            <input type="checkbox" class="sBDNoDot" data-i="${i}" ${s.bdNoDot?'checked':''}> No Black Dot
          </label>
          ${!s.bdNoDot?`<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px">
            <input type="checkbox" class="sBDVis" data-i="${i}" ${s.bdVisible?'checked':''}> Visible at 2m
          </label>`:''}
        </div>
        ${!s.bdNoDot?`
        <div class="bd-grid">
          <div><label class="lbl">D (mm)</label><input class="field mono sBDF" data-i="${i}" data-f="bdD" type="number" step="0.01" value="${s.bdD}" placeholder="e.g. 1.2"></div>
          <div><label class="lbl">N (spots)</label><input class="field mono sBDF" data-i="${i}" data-f="bdN" type="number" value="${s.bdN}" placeholder="e.g. 2"></div>
          <div><label class="lbl">DS (mm)</label><input class="field mono sBDF" data-i="${i}" data-f="bdDS" type="number" step="0.1" value="${s.bdDS}" placeholder="e.g. 20"></div>
          <div><label class="lbl">Area</label>
            <select class="field mono sBDF" data-i="${i}" data-f="bdArea">
              <option value="A" ${s.bdArea==='A'?'selected':''}>Area A</option>
              <option value="B" ${s.bdArea==='B'?'selected':''}>Area B</option>
              <option value="A+B" ${s.bdArea==='A+B'?'selected':''}>Area A+B</option>
            </select></div>
          <div style="display:flex;align-items:flex-end">
            <div class="bd-result ${bd.ok?'bd-ok':'bd-fail'}" ${bd.incomplete?'style="background:var(--minor-bg);border-color:var(--minor-line);color:var(--minor)"':''}>${bd.incomplete?'… INCOMPLETE':(bd.ok?'✓ OK':'✗ FAIL')}<br>${bd.reason}</div>
          </div>
        </div>`:`<div class="text-pass" style="font-size:13px;font-family:var(--num)">✓ No Black Dot — Acceptable</div>`}
        <input class="samp-remark-inp sRemark" data-i="${i}" type="text" value="${s.remark||''}" placeholder="Optional remark or defect description">
      </div>`:''}
    </div>`;
  });

  html+=`</div>`;

  html+=`<div class="insp-footer">
    <div class="insp-tally">
      <div>Samples filled: <b class="${filled===samples.length?'t-ok':'t-warn'}">${filled}/${samples.length}</b></div>
      <div>Aesthetic (Minor): <b class="${minor<=1?'t-ok':'t-fail'}">${minor} / 1 allowed</b></div>
      <div>Major defects: <b class="${major===0?'t-ok':'t-fail'}">${major} / 0 allowed</b></div>
      <div>Lot verdict: <b class="${passed?'t-ok':'t-fail'}">${passed?'✓ PASS':'✗ FAIL'}</b></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <input id="lotRemarks" class="field" type="text" style="width:260px" value="${esc(lotRemarksVal)}" placeholder="General lot remarks (optional)">
      <button id="btnSubmitLot" class="btn ${allReady?(passed?'btn-primary':'btn-danger'):''}" ${allReady?'':'disabled'} style="min-width:200px">
        ${allReady?(passed?'✓ Submit Lot — PASS':'⚠ Submit Lot — FAIL'):`Complete all ${samples.length} samples to submit`}
      </button>
    </div>
  </div>

  </div>
  <footer class="pg-footer">LUMIO Quality Management - Projector</footer>
  </div>`;
  return html;
}

// ═══════════════════════════════════════════════════════════
// EVENT BINDING
// ═══════════════════════════════════════════════════════════
function bindEvents(){
  // Setup
  const bs=document.getElementById('btnSetup');
  if(bs) bs.onclick=()=>{ const v=document.getElementById('apiInput').value.trim(); if(!v){toast('Enter URL','err');return;} API=v; localStorage.setItem('oba_api',v); render(); };

  // Login
  const bl=document.getElementById('btnLogin');
  if(bl) bl.onclick=async()=>{
    const u=document.getElementById('lUser').value.trim();
    const p=document.getElementById('lPass').value.trim();
    const err=document.getElementById('lErr');
    err.classList.add('hidden');
    try{
      const r=await api('login',{username:u,password:p});
      if(r.ok){
        user={username:r.username,role:r.role,name:r.name};
        session={token:r.token,expiresAt:r.expiresAt,partdbUrl:r.partdbUrl||'',bomSheetUrl:r.bomSheetUrl||''};
        page='insp'; bomTool=null; saveSession();
        render(); // show dashboard immediately
        loadAll().then(()=>render()); // load batches + models in background
      }
      else{
        err.textContent=r.error||'Login failed';
        err.classList.remove('hidden');
        if((r.error||'').includes('Apps Script')||(r.error||'').includes('redeployed')){
          err.innerHTML=r.error+'<br><br><b>Fix:</b> In Apps Script → Deploy → Manage deployments → pencil icon → New version → Deploy. Then copy the new URL here.';
        }
      }
    }catch(e){ err.textContent='Network error: '+e.message; err.classList.remove('hidden'); }
  };
  const lp=document.getElementById('lPass');
  if(lp) lp.onkeydown=e=>{ if(e.key==='Enter') document.getElementById('btnLogin')?.click(); };

  const bcu=document.getElementById('btnChgUrl');
  if(bcu) bcu.onclick=()=>{ API=''; localStorage.removeItem('oba_api'); render(); };

  // Logout
  const blo=document.getElementById('btnLogout');
  if(blo) blo.onclick=()=>{ if(session&&session.token) api('logout'); resetApp(); render(); };
  // Admin navigation
  document.querySelectorAll('.navBtn').forEach(b=>{ b.onclick=()=>{ page=b.getAttribute('data-p'); bomTool=null; render(); window.scrollTo(0,0); }; });
  document.querySelectorAll('.toolCard').forEach(b=>{ b.onclick=()=>{ bomTool=b.getAttribute('data-k'); render(); window.scrollTo(0,0); }; });
  const btb=document.getElementById('btnToolBack');
  if(btb) btb.onclick=()=>{ bomTool=null; render(); };

  // Refresh
  const br=document.getElementById('btnRefresh');
  if(br) br.onclick=async()=>{ lotUnits={}; await loadAll(); render(); toast('Refreshed'); };

  // Create Batch
  const bcb=document.getElementById('btnCreateBatch');
  if(bcb) bcb.onclick=async()=>{
    const batchName=document.getElementById('bName').value.trim();
    const batchQty=parseInt(document.getElementById('bQty').value)||0;
    const model=document.getElementById('bModel').value;
    const month=document.getElementById('bMonth').value;
    const month2=document.getElementById('bMonth2')?document.getElementById('bMonth2').value:'';
    const msgEl=document.getElementById('createMsg');
    if(!batchName){ toast('Enter Batch Name','err'); return; }
    if(batchQty<1){ toast('Enter Batch Quantity > 0','err'); return; }
    if(!getModel(model)){ toast('Add a model first','err'); return; }
    const prodMonthCode=month?mmyy(month):'';
    const prodMonthCode2=month2?mmyy(month2):'';
    msgEl.textContent='Creating lots…'; msgEl.classList.remove('hidden');
    try{
      // Try new API first, fall back to old if script not yet updated
      let r=await api('createBatch',{batchName,batchQty,model,prodMonthCode,prodMonthCode2,createdBy:user.username});
      if(!r.ok && (r.error||'').toLowerCase().includes('unknown')){
        // Old script fallback: createKit
        r=await api('createKit',{kitName:batchName,kitSize:batchQty,lotSize:90,sampleSize:13,bdMax:getModel(model).maxD,model,prodMonthCode,prodMonthCode2,createdBy:user.username});
        if(r.ok) r.batchQty=batchQty;
      }
      if(r.ok){
        const lots=r.lotsCreated;
        const rem=batchQty%90;
        msgEl.innerHTML=`✓ <b>${batchName}</b>: <b>${lots} lots</b> created.<br>
          Batch Qty: <b>${batchQty}</b> | Each lot: 90 units | Sample: 13${rem>0?`<br>Last lot: ${rem} units (still 13 samples)`:''}`;
        msgEl.classList.remove('hidden');
        document.getElementById('bName').value='';
        document.getElementById('bQty').value='';
        await loadBatches(); render();
        toast(`✓ ${lots} lots created for ${batchName}`);
      } else {
        msgEl.textContent='Error: '+(r.error||'unknown');
        toast(r.error||'Error','err');
      }
    }catch(e){ msgEl.textContent='Network error: '+e.message; toast('Network error','err'); }
  };

  // Add User
  const bau=document.getElementById('btnAddUser');
  if(bau) bau.onclick=async()=>{
    const username=document.getElementById('uUser').value.trim();
    const password=document.getElementById('uPass').value.trim();
    const name=document.getElementById('uName').value.trim();
    const role=document.getElementById('uRole').value;
    if(!username||!password||!name){ toast('Fill all user fields','err'); return; }
    const r=await api('addUser',{username,password,name,role});
    if(r.ok){ toast(`User ${username} added`); document.getElementById('addUserMsg').textContent=`✓ ${username} added as ${role}`; document.getElementById('addUserMsg').classList.remove('hidden'); document.getElementById('uUser').value=''; document.getElementById('uPass').value=''; document.getElementById('uName').value=''; }
    else toast(r.error||'Error','err');
  };

  // Models: save / edit / cancel / delete
  const bsm=document.getElementById('btnSaveModel');
  if(bsm) bsm.onclick=async()=>{
    const g=id=>document.getElementById(id).value.trim();
    const m={lumioModel:g('m_lumioModel'),name:g('m_name'),code:g('m_code'),maxD:g('m_maxD'),smallD:g('m_smallD'),maxN:g('m_maxN'),minDS:g('m_minDS'),nA:g('m_nA'),nB:g('m_nB'),nAB:g('m_nAB')};
    if(!m.lumioModel) return toast('Enter the Lumio model number','err');
    if(!m.name) return toast('Enter model name','err');
    if(!/^\d{4}$/.test(m.code)) return toast('Serial code must be exactly 4 digits','err');
    for(const k of ['maxD','smallD','maxN','minDS','nA','nB','nAB']){
      if(m[k]===''||isNaN(Number(m[k]))||Number(m[k])<0) return toast('Fill all Black Dot fields with numbers ≥ 0','err');
      m[k]=Number(m[k]);
    }
    if(!(m.maxD>0)) return toast('Fail D limit must be > 0','err');
    if(m.smallD>m.maxD) return toast('"OK if D ≤" cannot be bigger than "Fail if D >"','err');
    for(const k of ['maxN','nA','nB','nAB']) if(!Number.isInteger(m[k])) return toast('N values must be whole numbers','err');
    if(m.nA>m.maxN||m.nB>m.maxN||m.nAB>m.maxN) return toast('Area N limits cannot exceed Max N','err');
    const dupName=models.find(x=>x.name.toLowerCase()===m.name.toLowerCase()&&x.name!==editingModel);
    if(dupName) return toast('A model with this name already exists','err');
    const dupCode=models.find(x=>x.code===m.code&&x.name!==editingModel);
    if(dupCode) return toast(`Serial code ${m.code} is already used by ${dupCode.name}`,'err');
    bsm.disabled=true;
    const r=await api('saveModel',{model:m,originalName:editingModel||'',updatedBy:user.username});
    bsm.disabled=false;
    if(r.ok){ toast(`Model ${m.lumioModel} saved`); editingModel=null; modelPrefill=null; await loadModels(); render(); }
    else toast(r.error||'Save failed','err');
  };
  const bcm=document.getElementById('btnCancelModel');
  if(bcm) bcm.onclick=()=>{ editingModel=null; modelPrefill=null; render(); };
  document.querySelectorAll('.useSuggestBtn').forEach(btn=>{
    btn.onclick=()=>{
      const sg=modelSuggestions.find(x=>x.name===btn.getAttribute('data-name'));
      if(!sg) return;
      editingModel=null;
      modelPrefill={name:sg.name,code:sg.code||'',maxD:sg.maxD||''};
      render();
      const f=document.getElementById('m_lumioModel');
      if(f){ f.scrollIntoView({behavior:'smooth',block:'center'}); f.focus({preventScroll:true}); }
    };
  });
  document.querySelectorAll('.editModelBtn').forEach(btn=>{
    btn.onclick=()=>{ editingModel=btn.getAttribute('data-name'); modelPrefill=null; render(); const f=document.getElementById('m_lumioModel'); if(f){ f.scrollIntoView({behavior:'smooth',block:'center'}); f.focus({preventScroll:true}); } };
  });
  document.querySelectorAll('.delModelBtn').forEach(btn=>{
    btn.onclick=async()=>{
      const name=btn.getAttribute('data-name');
      const inUse=batches.filter(b=>b.model===name&&b.status==='Open').length;
      if(!confirm(`Delete model "${name}"?${inUse?`\n\nWARNING: ${inUse} open lot(s) use this model and cannot be inspected until it is added back.`:''}`)) return;
      const r=await api('deleteModel',{name});
      if(r.ok){ toast(`Model ${name} deleted`); if(editingModel===name) editingModel=null; await loadModels(); render(); }
      else toast(r.error||'Delete failed','err');
    };
  });

  // Batch flow: BOM verification
  document.querySelectorAll('.bomStartBtn').forEach(b=>{
    b.onclick=async()=>{
      const batch=b.getAttribute('data-batch');
      const lot=batches.find(x=>x.batchName===batch); const bm=lot?bomFor(lot.model):null;
      if(!bm){ toast('No BOM linked to this model','err'); return; }
      b.disabled=true; b.textContent='Loading BOM…';
      const r=await api('getBom',{model:bm.model});
      if(!r.ok){ toast(r.error||'Could not load the BOM','err'); b.disabled=false; render(); return; }
      if(r.control&&r.control.status&&r.control.status.toLowerCase()!=='locked'){ toast(`BOM ${bm.model} is ${r.control.status}. It must be locked before verification.`,'err'); render(); return; }
      const d=loadBomDraft(batch);
      let items={}, remarks='';
      if(d&&d.model===bm.model&&d.items){
        const n=Object.keys(d.items).length;
        if(confirm(`A saved draft exists for this batch (${n} parts checked, saved ${new Date(d.savedAt).toLocaleString()}).\n\nResume it? (Cancel = start fresh)`)){ items=d.items; remarks=d.remarks||''; }
        else clearBomDraft(batch);
      }
      // keep only parts that are still in the BOM
      const valid={}; r.parts.forEach(p=>{ if(items[p.partNo]) valid[p.partNo]=items[p.partNo]; });
      activeBom={batch, model:bm.model, control:r.control||{}, parts:r.parts, items:valid, remarks, filter:'all', q:''};
      bomResult=null; render(); window.scrollTo(0,0);
    };
  });
  document.querySelectorAll('.bomViewBtn').forEach(b=>{
    b.onclick=async()=>{
      const batch=b.getAttribute('data-batch'), ver=b.getAttribute('data-ver');
      if(bomResult&&bomResult.batch===batch){ bomResult=null; render(); return; }
      bomResult={batch,loading:true}; render();
      const r=await api('getBomVerification',{verId:ver});
      bomResult=r.ok?{batch,data:r}:{batch,error:r.error||'Could not load the verification'};
      render();
    };
  });
  document.querySelectorAll('.bomViewClose').forEach(b=>{ b.onclick=()=>{ bomResult=null; render(); }; });
  document.querySelectorAll('.bomStageBtn').forEach(b=>{
    b.onclick=async()=>{
      const batch=b.getAttribute('data-batch'), st=b.getAttribute('data-st');
      const msg=st==='Waived'?`Waive BOM verification for ${batch}?\n\nSampling will be allowed without a BOM check.`:`Require BOM verification for ${batch}?\n\nSampling of its open lots will be locked until BOM verification passes.`;
      if(!confirm(msg)) return;
      const r=await api('setBatchStage',{batchName:batch,bomStatus:st,by:user.username});
      if(r.ok){ toast(st==='Waived'?'BOM verification waived':'BOM verification required'); await loadBatches(); render(); }
      else toast(r.error||'Could not change the batch','err');
    };
  });
  // BOM verification screen
  const bbk=document.getElementById('btnBomBack');
  if(bbk) bbk.onclick=()=>{ saveBomDraft(); toast('Draft saved, resume anytime from the batch'); activeBom=null; render(); };
  document.querySelectorAll('.bomFilter').forEach(b=>{ b.onclick=()=>{ activeBom.filter=b.getAttribute('data-k'); render(); }; });
  const bq=document.getElementById('bomQ');
  if(bq) bq.oninput=()=>{ const pos=bq.selectionStart; activeBom.q=bq.value; render(); const n=document.getElementById('bomQ'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } };
  document.querySelectorAll('.bomMark').forEach(b=>{
    b.onclick=()=>{
      const pn=b.getAttribute('data-pn'), st=b.getAttribute('data-st'), p=activeBom.parts.find(x=>x.partNo===pn);
      const cur=activeBom.items[pn]||{};
      if(cur.state===st){ delete activeBom.items[pn]; }
      else if(st==='match'){ activeBom.items[pn]={state:'match',lotPartNo:p.partNo,lotQps:p.qps,remark:''}; }
      else { activeBom.items[pn]={state:'diff',lotPartNo:cur.state==='diff'?cur.lotPartNo:'',lotQps:cur.state==='diff'?cur.lotQps:p.qps,remark:cur.remark||''}; }
      saveBomDraft(); render();
      if(st==='diff'&&activeBom.items[pn]) document.querySelector(`.bomF[data-pn="${CSS.escape(pn)}"][data-f="lotPartNo"]`)?.focus();
    };
  });
  document.querySelectorAll('.bomF').forEach(el=>{
    el.oninput=()=>{ const it=activeBom.items[el.getAttribute('data-pn')]; if(it){ it[el.getAttribute('data-f')]=el.value; saveBomDraft(); updateBomFooter(); } };
  });
  const bam=document.getElementById('bomAllMatch');
  if(bam) bam.onclick=()=>{
    const todo=activeBom.parts.filter(p=>!activeBom.items[p.partNo]);
    if(!confirm(`Mark ${todo.length} unchecked part${todo.length===1?'':'s'} as matching the BOM?\n\nOnly do this after you have physically checked them.`)) return;
    todo.forEach(p=>{ activeBom.items[p.partNo]={state:'match',lotPartNo:p.partNo,lotQps:p.qps,remark:''}; });
    saveBomDraft(); render();
  };
  updateBomFooter();
  const brm=document.getElementById('bomRemarks');
  if(brm) brm.oninput=()=>{ activeBom.remarks=brm.value; saveBomDraft(); };
  const bsb=document.getElementById('btnBomSubmit');
  if(bsb) bsb.onclick=async()=>{
    const c=bomCounts();
    if(!confirm(c.diff?`Submit BOM verification with ${c.diff} deviation${c.diff===1?'':'s'}?\n\nThe batch will be marked as failed and sampling stays on hold.`:`Submit BOM verification for ${activeBom.batch}?\n\nAll ${c.total} parts matched. Sampling will be unlocked.`)) return;
    activeBom.saving=true; render();
    const items=activeBom.parts.map(p=>{ const it=activeBom.items[p.partNo]; return {partNo:p.partNo,lotPartNo:it.lotPartNo,lotQps:it.lotQps,remark:it.remark||''}; });
    const r=await api('submitBomVerification',{batchName:activeBom.batch,model:activeBom.model,items,by:user.name,remarks:activeBom.remarks||''});
    if(r.ok){
      clearBomDraft(activeBom.batch);
      toast(`${r.verId}: ${r.result}. ${r.status==='Passed'?'Sampling unlocked.':'Sampling on hold.'}`, r.status==='Passed'?'ok':'err');
      activeBom=null; await loadBatches(); render();
    } else { activeBom.saving=false; saveBomDraft(); render(); toast(r.error||'Could not save, draft kept','err'); }
  };

  // Lot browser filters + selection
  const fb=document.getElementById('fBatch');
  if(fb) fb.onchange=()=>{ view.batch=fb.value; selLot=null; render(); };
  document.querySelectorAll('.fStatus').forEach(b=>{ b.onclick=()=>{ view.status=b.getAttribute('data-k'); render(); }; });
  const fs=document.getElementById('fSearch');
  if(fs) fs.oninput=()=>{ const pos=fs.selectionStart; view.q=fs.value; render(); const n=document.getElementById('fSearch'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } };
  document.querySelectorAll('.lotTile').forEach(btn=>{
    btn.onclick=()=>{
      const lot=batches[parseInt(btn.getAttribute('data-ri'))];
      const k=lot.batchName+'||'+lot.lotNumber;
      selLot=(selLot===k)?null:k;
      render();
      if(selLot){
        document.querySelector('.lot-detail')?.scrollIntoView({behavior:'smooth',block:'nearest'});
        if((lot.status==='Closed'||lot.result)&&!lotUnits[k]) loadLotUnits(lot);
      }
    };
  });
  document.querySelectorAll('.lotCloseBtn').forEach(b=>{ b.onclick=()=>{ selLot=null; render(); }; });

  // Data records: duplicate check, cleanup, lookup
  const bsd=document.getElementById('btnScanDups');
  if(bsd) bsd.onclick=async()=>{
    dataScan={loading:true}; render();
    const r=await api('scanDuplicates');
    dataScan=r.ok?r:{error:(r.error||'').toLowerCase().includes('unknown')?'This needs the latest backend version.':(r.error||'Check failed')};
    render(); document.getElementById('dataCard')?.scrollIntoView({block:'start'});
  };
  const brd=document.getElementById('btnRemoveDups');
  if(brd) brd.onclick=async()=>{
    const n=dataScan.extraRows;
    if(!confirm(`Move ${n} extra ${n===1?'copy':'copies'} out of the Master sheet?\n\nThe earliest record of each serial number stays. The extra copies go to a sheet named "Duplicates", where you can still see them.`)) return;
    brd.disabled=true; brd.textContent='Moving…';
    const r=await api('removeDuplicates',{expected:n,by:user.username});
    if(r.ok){ toast(`${r.removed} duplicate ${r.removed===1?'copy':'copies'} moved to Duplicates`); lotUnits={}; dataScan={loading:true}; render(); const s=await api('scanDuplicates'); dataScan=s.ok?s:{error:s.error}; render(); }
    else { toast(r.error||'Could not move duplicates','err'); brd.disabled=false; }
  };
  document.querySelectorAll('.approveSerialBtn').forEach(b=>{
    b.onclick=async()=>{
      const sn=b.getAttribute('data-serial');
      if(!confirm(`Keep ${sn} in both lots?\n\nOne record stays in each lot and this serial stops being flagged. New inspections still can't use it again.`)) return;
      b.disabled=true;
      const r=await api('approveSerial',{serial:sn,by:user.username,reason:'Kept in more than one lot (admin decision)'});
      if(!r.ok){ toast(r.error||'Could not approve','err'); b.disabled=false; return; }
      toast(`${sn} kept in both lots`);
      dataScan={loading:true}; render(); const s=await api('scanDuplicates'); dataScan=s.ok?s:{error:s.error}; render();
    };
  });
  const doRecSearch=async()=>{
    const q=(document.getElementById('recQ')?.value||'').trim();
    if(q.length<3){ toast('Type at least 3 characters','err'); return; }
    recSearch={q,loading:true,res:null}; render();
    const r=await api('searchRecords',{q});
    recSearch={q,loading:false,res:r.ok?r:{error:(r.error||'').toLowerCase().includes('unknown')?'This needs the latest backend version.':(r.error||'Search failed')}};
    render(); document.getElementById('recQ')?.scrollIntoView({block:'center'});
  };
  const brs=document.getElementById('btnRecSearch');
  if(brs) brs.onclick=doRecSearch;
  const rq=document.getElementById('recQ');
  if(rq) rq.onkeydown=e=>{ if(e.key==='Enter') doRecSearch(); };

  // Delete Batch
  document.querySelectorAll('.delBatchBtn').forEach(btn=>{
    btn.onclick=async()=>{
      const name=btn.getAttribute('data-name');
      if(!confirm(`Delete ALL lots in batch "${name}"? Cannot be undone.`)) return;
      const r=await api('deleteBatch',{batchName:name});
      if(r.ok){ selLot=null; if(view.batch===name) view.batch=''; await loadBatches(); render(); toast(`Batch "${name}" deleted`); }
      else toast(r.error||'Error','err');
    };
  });

  // Delete Lot
  document.querySelectorAll('.delLotBtn').forEach(btn=>{
    btn.onclick=async()=>{
      const ri=parseInt(btn.getAttribute('data-ri'));
      const lot=batches[ri];
      if(!confirm(`Delete lot "${lot.lotNumber}"?`)) return;
      const r=await api('deleteLot',{batchName:lot.batchName,lotNumber:lot.lotNumber});
      if(r.ok){ selLot=null; await loadBatches(); render(); toast('Lot deleted'); }
      else toast(r.error||'Error','err');
    };
  });

  // Edit Lot
  document.querySelectorAll('.editBtn').forEach(btn=>{
    btn.onclick=()=>{
      const ri=parseInt(btn.getAttribute('data-ri'));
      const lot=batches[ri];
      const area=document.getElementById('editArea'+ri);
      if(!area.classList.contains('hidden')){ area.classList.add('hidden'); area.innerHTML=''; return; }
      area.classList.remove('hidden');
      area.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px">
        <div><label class="lbl">Status</label><select id="eS${ri}" class="field"><option value="Open" ${lot.status==='Open'?'selected':''}>Open</option><option value="Closed" ${lot.status==='Closed'?'selected':''}>Closed</option></select></div>
        <div><label class="lbl">Model</label><select id="eMD${ri}" class="field">${modelOptions(lot.model)}${getModel(lot.model)?'':`<option value="${esc(lot.model)}" selected>${esc(lot.model)} (not in list)</option>`}</select></div>
        <div><label class="lbl">Prod Month 1</label><input id="ePM${ri}" class="field" type="month" value="${mmyyInp(lot.prodMonthCode)}"></div>
        <div><label class="lbl">Prod Month 2</label><input id="ePM2${ri}" class="field" type="month" value="${mmyyInp(lot.prodMonthCode2||'')}"></div>
      </div>
      <button class="btn btn-primary btn-sm saveLotEdit" data-ri="${ri}">Save Changes</button>`;
      area.querySelector('.saveLotEdit').onclick=async()=>{
        const status=document.getElementById('eS'+ri).value;
        const model=document.getElementById('eMD'+ri).value;
        const bdMax=getModel(model)?getModel(model).maxD:lot.bdMax;
        const pm=document.getElementById('ePM'+ri).value;
        const prodMonthCode=pm?mmyy(pm):lot.prodMonthCode;
        const pm2=document.getElementById('ePM2'+ri).value;
        const prodMonthCode2=pm2?mmyy(pm2):(lot.prodMonthCode2||'');
        const r=await api('updateLot',{batchName:lot.batchName,lotNumber:lot.lotNumber,status,bdMax,model,prodMonthCode,prodMonthCode2});
        if(r.ok){ await loadBatches(); render(); toast('Lot updated'); }
        else toast(r.error||'Error','err');
      };
    };
  });

  // Start Inspection
  document.querySelectorAll('.startBtn').forEach(btn=>{
    btn.onclick=()=>{
      const ri=parseInt(btn.getAttribute('data-ri'));
      const lot=batches[ri];
      if(samplingLocked(lot.batchName)){ toast('Sampling starts after BOM verification passes for this batch','err'); return; }
      const spec=getModel(lot.model);
      if(!spec){ toast(`Model "${lot.model}" has no spec — ask admin to add it`,'err'); return; }
      activeSpec=spec; lotRemarksVal='';
      const draft=loadDraft(lot);
      if(draft && draft.samples && draft.samples.length){
        const filled=draft.samples.filter(s=>s.serial).length;
        if(confirm(`A saved draft exists for ${lot.lotNumber} (${filled}/${draft.samples.length} samples filled, saved ${new Date(draft.savedAt).toLocaleString()}).\n\nResume this draft? (Cancel = start fresh)`)){
          activeLot=lot; expandedSample=null;
          samples=draft.samples;
          lotRemarksVal=draft.lotRemarks||'';
          render();
          return;
        } else {
          clearDraft(lot);
        }
      }
      activeLot=lot; expandedSample=null;
      samples=freshSamples(activeLot.sampleSize||SAMPLE_N);
      render();
    };
  });

  // CSV
  const bcsv=document.getElementById('btnCSV');
  if(bcsv) bcsv.onclick=downloadCSV;
  const bsum=document.getElementById('btnSummary');
  if(bsum) bsum.onclick=async()=>{ await loadBatches(); showSummary(); };
  const bclose=document.getElementById('btnCloseSummary');
  if(bclose) bclose.onclick=()=>{
    document.getElementById('summaryScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  };

  // Back from inspection - auto-saves draft, does not lose data
  const back=document.getElementById('btnBackInsp');
  if(back) back.onclick=()=>{
    saveDraft();
    toast('Draft saved — resume anytime from this lot');
    activeLot=null; activeSpec=null; samples=[]; expandedSample=null; render();
  };

  // Sample serial input
  document.querySelectorAll('.sSerial').forEach(el=>{
    el.onchange=async()=>{
      const i=parseInt(el.getAttribute('data-i'));
      samples[i].serial=el.value.trim().toUpperCase();
      const used=samples.filter((_,j)=>j!==i&&samples[j].serial).map(s=>s.serial.toUpperCase());
      let err=validateSerial(samples[i].serial,activeLot.model,activeLot.prodMonthCode,used,activeLot.prodMonthCode2||'');
      if(!err && samples[i].serial){
        try{
          const dup=await api('checkSerial',{serial:samples[i].serial});
          if(dup.ok && dup.exists) err='Duplicate — already exists in master data ('+(dup.batch||'')+' '+(dup.lot||'')+')';
        }catch(e){ /* ignore network errors on dup check */ }
      }
      samples[i].serialError=err;
      saveDraft();
      render();
    };
  });

  // Sample toggles (pass/fail buttons)
  document.querySelectorAll('.sToggle').forEach(btn=>{
    btn.onclick=()=>{
      const i=parseInt(btn.getAttribute('data-i'));
      const f=btn.getAttribute('data-f');
      samples[i][f]=!samples[i][f];
      saveDraft();
      render();
    };
  });

  // Sample tray: jump to a sample
  document.querySelectorAll('.slot').forEach(btn=>{
    btn.onclick=()=>{
      const row=document.getElementById('samp-row-'+btn.getAttribute('data-i'));
      if(!row) return;
      row.scrollIntoView({behavior:'smooth',block:'center'});
      row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'),1200);
      row.querySelector('.sSerial')?.focus({preventScroll:true});
    };
  });

  // Black Dot expand/collapse toggle
  document.querySelectorAll('.bdExpandBtn').forEach(btn=>{
    btn.onclick=()=>{
      const i=parseInt(btn.getAttribute('data-i'));
      expandedSample = (expandedSample===i) ? null : i;
      render();
    };
  });

  // BD no dot checkbox
  document.querySelectorAll('.sBDNoDot').forEach(el=>{
    el.onchange=()=>{ const i=parseInt(el.getAttribute('data-i')); samples[i].bdNoDot=el.checked; saveDraft(); render(); };
  });

  // BD visible checkbox
  document.querySelectorAll('.sBDVis').forEach(el=>{
    el.onchange=()=>{ const i=parseInt(el.getAttribute('data-i')); samples[i].bdVisible=el.checked; saveDraft(); render(); };
  });

  // BD fields
  document.querySelectorAll('.sBDF').forEach(el=>{
    el.onchange=()=>{ const i=parseInt(el.getAttribute('data-i')); const f=el.getAttribute('data-f'); samples[i][f]=el.value; saveDraft(); render(); };
  });

  // Remark
  document.querySelectorAll('.sRemark').forEach(el=>{
    el.onchange=()=>{ const i=parseInt(el.getAttribute('data-i')); samples[i].remark=el.value; saveDraft(); };
  });

  // Lot-level remarks field also triggers save
  const lotRemarksEl=document.getElementById('lotRemarks');
  if(lotRemarksEl) lotRemarksEl.oninput=()=>{ lotRemarksVal=lotRemarksEl.value; saveDraft(); };

  // Submit Lot
  const bsub=document.getElementById('btnSubmitLot');
  if(bsub) bsub.onclick=async()=>{
    const {minor,major,passed}=tallyLot();
    const lotResult=passed?'PASS':'FAIL';
    const fgPassQty=passed?Number(activeLot.lotSize):0;
    const lotRemarks=lotRemarksVal;

    const units=samples.map(s=>{
      const bd=evalBD(s);
      const r=sampleResult(s);
      const fails=[];
      if(!s.aestheticPass) fails.push('Aesthetic Fail (Minor)');
      if(!s.generalPass)   fails.push('General Fail (Major)');
      if(!s.funcPass)      fails.push('Functional Fail (Major)');
      if(!s.screenPass)    fails.push('Screen Fail (Major)');
      if(!bd.ok)           fails.push('Black Dot Fail (Major): '+bd.reason);
      return{
        serial:s.serial,
        aes:s.aestheticPass?'Pass':'Fail',
        general:s.generalPass?'Pass':'Fail',
        func:s.funcPass?'Pass':'Fail',
        screen:s.screenPass?'Pass':'Fail',
        bd:s.bdNoDot?'No BD':(s.bdVisible?bd.reason:'Not visible @2m'),
        remark:fails.length?fails.join(' | '):(s.remark||lotRemarks||'OK'),
        sampleResult:r==='PASS'?'Pass':'Fail',
        inspectedAt: s.inspectedAt || new Date().toISOString()
      };
    });

    const r=await api('submitLot',{
      inspector:user.name,
      batchName:activeLot.batchName,
      lotNumber:activeLot.lotNumber,
      lotResult,fgPassQty,
      bdSpec:specText(activeSpec),
      batchQty:activeLot.batchQty,
      totalLots:activeLot.totalLots,
      model:activeLot.model,
      prodMonthCode:activeLot.prodMonthCode,
      units
    });

    if(r.ok){
      clearDraft(activeLot);
      toast(`${activeLot.lotNumber}: ${lotResult} | FG Pass: ${fgPassQty}`);
      activeLot=null; activeSpec=null; samples=[]; expandedSample=null; lotUnits={};
      await loadBatches(); render();
    } else { saveDraft(); toast(r.error||'Save failed — draft kept locally','err'); }
  };
}

// ═══════════════════════════════════════════════════════════
// CSV
// ═══════════════════════════════════════════════════════════
function downloadCSV(){
  const groups=groupBatches();
  let csv='IS2500 OBA Batch Inspection Report\n';
  csv+=`Generated: ${new Date().toLocaleString()}\n\n`;
  csv+='BatchName,LotNumber,Model,ProdMonth,BatchQty,LotSize,SampleSize,Status,Result,FGPassQty\n';
  groups.forEach(g=>{
    g.lots.forEach(l=>{
      csv+=`"${l.batchName}","${l.lotNumber}","${l.model||'-'}","${mmyyDisp(l.prodMonthCode)}",${l.batchQty},${l.lotSize},${l.sampleSize},"${l.status}","${l.result||'Pending'}",${l.fgPassQty||0}\n`;
    });
  });
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`OBA_Report_${Date.now()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ═══════════════════════════════════════════════════════════
// SUMMARY VIEW
// ═══════════════════════════════════════════════════════════
function showSummary(){
  const groups=groupBatches();
  const totalLots=batches.length;
  const doneLots=batches.filter(b=>b.status==='Closed').length;
  const passLots=batches.filter(b=>b.result==='PASS').length;
  const failLots=batches.filter(b=>b.result==='FAIL').length;
  const pendLots=batches.filter(b=>b.status==='Open').length;
  const fgAll=batches.reduce((s,b)=>s+Number(b.fgPassQty||0),0);
  const totalBatchQty=groups.reduce((s,g)=>s+(g.batchQty||0),0);

  let html=`
  <!-- TOTAL SUMMARY -->
  <div style="margin-bottom:24px">
    <div style="font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:14px">Total Summary</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px">
      <div class="stat"><div class="stat-label">Total Batches</div><div class="stat-val">${groups.length}</div></div>
      <div class="stat"><div class="stat-label">Total Lots</div><div class="stat-val">${totalLots}</div></div>
      <div class="stat"><div class="stat-label">Lots Completed</div><div class="stat-val">${doneLots}<span style="font-size:12px;color:var(--ink-3)"> / ${totalLots}</span></div></div>
      <div class="stat"><div class="stat-label">Lots Passed</div><div class="stat-val text-pass">${passLots}</div></div>
      <div class="stat"><div class="stat-label">Lots Failed</div><div class="stat-val" style="color:${failLots>0?'var(--fail)':'var(--ink-3)'}">${failLots}</div></div>
      <div class="stat"><div class="stat-label">Pending Lots</div><div class="stat-val" style="color:var(--minor)">${pendLots}</div></div>
      <div class="stat"><div class="stat-label">FG Released</div><div class="stat-val text-pass">${fgAll}</div><div class="stat-sub">of ${totalBatchQty} units</div></div>
      <div class="stat"><div class="stat-label">Yield Rate</div><div class="stat-val" style="color:var(--open)">${doneLots>0?((passLots/doneLots)*100).toFixed(1):0}%</div></div>
    </div>
  </div>`;

  // PER BATCH SUMMARY
  groups.forEach(g=>{
    const pct=g.totalLots>0?Math.round(g.completed/g.totalLots*100):0;
    const fgPct=g.batchQty>0?Math.round(g.fgTotal/g.batchQty*100):0;
    html+=`
    <div class="batch-group" style="margin-bottom:20px">
      <div style="padding:14px 18px;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-size:14px;font-weight:700;color:var(--ink);font-family:var(--num)">${g.name}</div>
            <div style="font-size:12.5px;color:var(--ink-3);font-family:var(--num);margin-top:3px">
              Model: <b style="color:var(--ink-2)">${g.model||'-'}</b> &nbsp;|&nbsp;
              Prod Month: <b style="color:var(--ink-2)">${mmyyDisp(g.prodMonthCode)}${g.prodMonthCode2?' / '+mmyyDisp(g.prodMonthCode2):''}</b> &nbsp;|&nbsp;
              Batch Qty: <b style="color:var(--ink-2)">${g.batchQty}</b> &nbsp;|&nbsp;
              Total Lots: <b style="color:var(--ink-2)">${g.totalLots}</b>
            </div>
          </div>
          <div style="display:flex;gap:16px;flex-wrap:wrap">
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Completed</div><div style="font-size:18px;font-weight:700;color:var(--ink)">${g.completed}/${g.totalLots}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Pass</div><div style="font-size:18px;font-weight:700;color:var(--pass)">${g.passLots}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Fail</div><div style="font-size:18px;font-weight:700;color:${g.failLots>0?'var(--fail)':'var(--ink-3)'}">${g.failLots}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">FG Released</div><div style="font-size:18px;font-weight:700;color:var(--pass)">${g.fgTotal}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Pending</div><div style="font-size:18px;font-weight:700;color:var(--minor)">${g.pending}</div></div>
          </div>
        </div>
        <div style="margin-top:10px;display:flex;gap:16px;flex-wrap:wrap">
          <div style="flex:1;min-width:160px">
            <div style="font-size:12px;color:var(--ink-3);margin-bottom:3px">Lot Progress (${pct}%)</div>
            <div style="background:var(--line);border-radius:4px;height:6px;overflow:hidden"><div style="background:var(--lime);height:100%;width:${pct}%"></div></div>
          </div>
          <div style="flex:1;min-width:160px">
            <div style="font-size:12px;color:var(--ink-3);margin-bottom:3px">FG Release (${fgPct}%)</div>
            <div style="background:var(--line);border-radius:4px;height:6px;overflow:hidden"><div style="background:var(--pass);height:100%;width:${fgPct}%"></div></div>
          </div>
        </div>
      </div>

      <!-- LOT WISE TABLE -->
      <div style="overflow-x:auto">
        <table class="summ-table" style="width:100%;border-collapse:collapse;font-size:13px;font-family:var(--num)">
          <thead>
            <tr style="background:var(--sunk);color:var(--ink-3);font-size:12px">
              <th style="padding:8px 14px;text-align:left;border-bottom:1px solid var(--line)">#</th>
              <th style="padding:8px 14px;text-align:left;border-bottom:1px solid var(--line)">Lot Number</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Lot Size</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Sample</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Status</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Result</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">FG Qty</th>
            </tr>
          </thead>
          <tbody>
    `;
    g.lots.forEach((lot,idx)=>{
      const resBg=lot.result==='PASS'?'background:var(--pass-bg);color:var(--pass)':lot.result==='FAIL'?'background:var(--fail-bg);color:var(--fail)':'background:var(--line);color:var(--ink-3)';
      const stBg=lot.status==='Open'?'background:var(--open-bg);color:var(--open)':'background:var(--line);color:var(--ink-3)';
      html+=`<tr style="border-bottom:1px solid var(--paper);${idx%2===0?'':'background:var(--paper)'}">
        <td style="padding:8px 14px;color:var(--ink-3)">${idx+1}</td>
        <td style="padding:8px 14px;color:var(--ink);font-weight:700">${lot.lotNumber}</td>
        <td style="padding:8px 10px;text-align:center;color:var(--ink-2)">${lot.lotSize}</td>
        <td style="padding:8px 10px;text-align:center;color:var(--ink-2)">${lot.sampleSize}</td>
        <td style="padding:8px 10px;text-align:center"><span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;${stBg}">${lot.status}</span></td>
        <td style="padding:8px 10px;text-align:center">${lot.result?`<span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;${resBg}">${lot.result}</span>`:'<span style="color:var(--ink-3)">—</span>'}</td>
        <td style="padding:8px 10px;text-align:center;font-weight:700;color:${lot.fgPassQty>0?'var(--pass)':'var(--ink-3)'}">${lot.fgPassQty>0?lot.fgPassQty:'—'}</td>
      </tr>`;
    });
    html+=`<tr style="background:var(--sunk);font-weight:700">
      <td colspan="6" style="padding:8px 14px;color:var(--ink-2);text-align:right">Batch Total FG Released:</td>
      <td style="padding:8px 10px;text-align:center;color:var(--pass);font-weight:700">${g.fgTotal}</td>
    </tr>`;
    html+=`</tbody></table></div></div>`;
  });

  document.getElementById('summaryContent').innerHTML=html;
  // Copy logo src
  const mainLogo=document.querySelector('.logo img');
  const summLogo=document.getElementById('summLogoImg');
  if(mainLogo && summLogo) summLogo.src=mainLogo.src;

  document.getElementById('app').classList.add('hidden');
  document.getElementById('summaryScreen').classList.remove('hidden');
}

window.addEventListener('beforeunload', ()=>{
  if(activeLot && samples.length) saveDraft();
  if(activeBom) saveBomDraft();
});

if(API && restoreSession()){ render(); loadAll().then(()=>render()); } else render();
</script>

  <header class="hdr">
    <div class="hdr-left">
      <div class="logo"><img src="" alt="Lumio" id="summLogoImg"></div>
      <div><div class="hdr-title">Sampling summary</div>
        <div class="hdr-sub">IS 2500 level G2, lots of 90, 13 samples each</div>
      </div>
    </div>
    <div class="hdr-right">
      <button id="btnCloseSummary" class="btn btn-ghost btn-sm">← Back</button>
      <button id="btnPrint" class="btn btn-primary btn-sm" onclick="window.print()">🖨 Print</button>
    </div>
  </header>
  <div style="max-width:1200px;margin:0 auto;padding:24px" id="summaryContent"></div>
</div>
