/* ── Inspection bench polish ─────────────────────────── */
.samp-head{position:sticky;top:86px;z-index:5}
.samp-table{overflow:visible}
.samp-table>.samp-head{border-radius:14px 14px 0 0}
.samp-row{position:relative;transition:background .2s}
.samp-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .25s}
.samp-row.is-pass::before{background:var(--lime)}
.samp-row.is-fail::before{background:var(--color-danger-solid)}
.samp-row:focus-within{background:color-mix(in srgb,var(--lime) 7%,var(--panel))}
.samp-row.is-fail:focus-within{background:var(--fail-row)}
.serial-box{position:relative}
.serial-box .samp-serial-inp{padding-right:52px;font-variant-numeric:tabular-nums}
.serial-count,.serial-lock{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--ink-3);font-family:var(--code);pointer-events:none}
.serial-count.full{color:var(--pass);font-weight:700}
.mini-toggle{display:inline-flex;align-items:center;gap:6px;min-width:0;padding:0 11px;transition:background .15s,color .15s,border-color .15s,transform .12s var(--ease)}
.mini-toggle:active{transform:scale(.95)}
.mt-ic{font-size:12px;line-height:1;width:12px;text-align:center}
.mini-toggle-pass .mt-ic{color:var(--pass)}
.mini-toggle-fail{animation:failIn .22s var(--ease)}
.samp-note-btn{height:36px;padding:0 11px;border-radius:7px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-3);font-size:13px;font-weight:600;cursor:pointer}
.samp-note-btn:hover{border-color:var(--ink);color:var(--ink)}
.samp-note-btn.has-note{color:var(--ink);border-color:var(--ink);background:var(--sunk)}
.samp-note-btn.has-note::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime-deep);margin-left:6px;vertical-align:middle}
.samp-result-tag.tag-pop{animation:tagPop .38s var(--ease)}
.samp-expand{animation:expandIn .2s var(--ease)}
.insp-prog{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;width:100%;order:-1}
.insp-prog i{height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.insp-prog i.g-pass{background:var(--lime)}.insp-prog i.g-minor{background:var(--color-slot-minor)}.insp-prog i.g-major{background:var(--color-danger-solid)}
.slot{height:44px;font-size:15px}
.tray{grid-template-columns:repeat(var(--n,13),38px)}
@keyframes tagPop{0%{transform:scale(.85)}55%{transform:scale(1.08)}100%{transform:none}}
@keyframes failIn{0%{transform:scale(.92)}100%{transform:none}}
@keyframes expandIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* ── Motion: page changes and toasts ─────────────────── */
#app.pg-enter .main{animation:pgIn .26s var(--ease)}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{animation:toastIn .28s var(--ease);overflow:hidden}
.toast::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:currentColor;opacity:.25;transform-origin:left;animation:toastBar var(--t,3500ms) linear forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes toastBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (max-width:900px){ .samp-head{position:static} }
@media print{
  .hdr-right,.btn{display:none!important}
  body{background:#fff!important}
  .stat,.batch-group,.summ-table{break-inside:avoid}
  #summaryScreen{display:block!important}
  #app{display:none!important}
}

/* ═════════════════════════════════════════════════════════
   PRECISION LAYER: app shell, components, motion
   ═════════════════════════════════════════════════════════ */
body{font-feature-settings:"cv11","ss01";letter-spacing:-.003em}
.mono,.lt-no,.bom-pn,.samp-serial-inp,code{font-family:var(--font-code)}
:focus-visible{outline:2px solid var(--color-brand);outline-offset:2px}
::selection{background:var(--color-brand-soft)}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-color:var(--paper)}
/* display text: Inter, confident and tight */
.hdr-title,.card-title,.stat-val,.ld-title,.hero-title,.lotmap-t,.auth-title,.auth-card h2,.tool-group-h,.tool-title,.pg-title,.rw-count,.bench-title,.verdict b,.bom-qps b,.fai-table tr.fsec th{font-family:var(--font-ui);font-weight:600;letter-spacing:-.022em}
.pg-title{font-size:clamp(24px,2.4vw,30px);line-height:1.15}
.pg-sub{font-size:14px;color:var(--ink-2)}
.card-title{font-size:18px;letter-spacing:-.012em}
.stat-val{font-size:28px;font-variant-numeric:tabular-nums}
.ld-title{font-size:22px}
.hero-title{font-size:var(--fs-hero);line-height:1.08;max-width:20ch}
.auth-title{font-size:clamp(34px,4.2vw,52px);line-height:1.04}
.auth-card h2{font-size:24px}
.lotmap-t,.tool-group-h{font-size:18px}
.fai-table tr.fsec th{font-size:15px}
/* surfaces */
.card,.batch-group,.lot-toolbar,.lotmap,.rules,.tool-card,.bom-list,.auth-card,.stat-grid{border-radius:var(--radius-lg);background:var(--panel);border-color:var(--line);box-shadow:var(--shadow-1)}
.theme-dark .card,.theme-dark .batch-group,.theme-dark .lot-toolbar,.theme-dark .lotmap,.theme-dark .bom-list,.theme-dark .auth-card,.theme-dark .stat-grid,.theme-dark .rules,.theme-dark .tool-card{background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 120px),var(--panel)}
.rules,.tool-card{border-left-width:1px}
.tool-card{position:relative;overflow:hidden}
.tool-card::before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:linear-gradient(180deg,var(--color-brand),var(--color-accent));opacity:.8}
.tool-card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
/* fields */
.field{background:var(--color-bg-2);border-color:var(--line-strong);border-radius:8px;font-size:14px;min-height:40px}
.theme-dark .field{background:#0A1222}
.field:hover{border-color:color-mix(in srgb,var(--ink-3) 55%,transparent)}
.field:focus{border-color:var(--color-brand);box-shadow:var(--ring)}
.lbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
/* buttons */
.btn{border-radius:8px;font-size:13.5px;font-weight:600;min-height:38px;padding:8px 15px;letter-spacing:-.005em;position:relative}
.btn-primary{background:var(--color-brand);color:var(--color-on-brand);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 18px -10px var(--color-brand)}
.btn-primary:hover{background:var(--color-brand-strong);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 10px 26px -12px var(--color-brand)}
.theme-dark .btn-primary:hover{background:#9AA3FA}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{background:var(--sunk);border-color:var(--line-strong)}
.btn-sm{min-height:32px;padding:5px 11px;font-size:12.5px}
.btn:disabled{background:var(--sunk);color:var(--ink-3);border-color:var(--line);box-shadow:none}
.btn.is-busy{color:transparent!important;pointer-events:none}
.btn.is-busy::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-color:var(--ink-3) transparent var(--ink-3) var(--ink-3);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-icon{width:34px;min-width:34px;height:34px;min-height:34px;padding:0;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn-icon:hover{background:var(--sunk);color:var(--ink)}
.btn-icon svg,.ico{width:18px;height:18px;flex-shrink:0}
/* segmented */
.seg{border-color:var(--line-strong);border-radius:9px;background:var(--color-bg-2);padding:2px;gap:2px}
.seg-btn{border:0;border-radius:7px;min-height:34px;font-size:13px;color:var(--ink-2);transition:background .18s var(--ease),color .18s}
.seg-btn:hover{color:var(--ink)}
.seg-btn.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.25),inset 0 0 0 1px var(--line-strong)}
/* badges */
.badge{border-radius:999px;font-size:12px;font-weight:600;padding:2px 9px}
.badge-open{background:var(--color-brand-soft);color:var(--color-brand-strong);border-color:color-mix(in srgb,var(--color-brand) 35%,transparent)}
.theme-dark .badge-open{color:#C7CEFF}
/* tables */
.res-table{border-radius:10px;border-color:var(--line)}
.res-table th{background:var(--color-bg-2);font-size:12px;font-weight:600;color:var(--ink-3);text-transform:none;letter-spacing:.01em}
.res-table td{border-top-color:var(--line)}
.res-table tbody tr{transition:background .12s}
.res-table tbody tr:hover td{background:color-mix(in srgb,var(--color-brand) 5%,transparent)}
/* pass colours: green, readable text */
.bom-act .btn.on-match,.bom-st.st-match{background:var(--color-pass-solid);border-color:var(--color-pass-solid);color:var(--color-on-pass)}
.lot-tile.t-pass{background:var(--pass-bg);border-color:var(--pass-line);color:var(--pass)}
/* progress */
.progress-bar{background:var(--sunk)}
.progress-fill{background:linear-gradient(90deg,var(--color-brand),var(--color-accent))}
/* old floating header becomes a slim workspace bar */
.hdr{top:0;margin:0;width:100%;border-radius:0;border:0;border-bottom:1px solid var(--line);box-shadow:none;padding:8px 20px;min-height:var(--top-h);background:var(--color-surface-glass)}
.hdr-title{font-size:16px}
.hdr-sub{font-size:12.5px}
.logo img{height:22px}
.logo img,.sb-logo img{mix-blend-mode:multiply}
.theme-dark .logo img,.theme-dark .sb-logo img{filter:invert(1) hue-rotate(180deg) brightness(1.1);mix-blend-mode:screen}
.theme-toggle{width:34px;height:34px;border-radius:8px;border-color:transparent;background:transparent;color:var(--ink-2)}
.theme-toggle:hover{background:var(--sunk);border-color:transparent;color:var(--ink);transform:none}
.acct-btn{min-height:34px;border-color:transparent;background:transparent;border-radius:9px}
.acct-btn:hover{background:var(--sunk);border-color:transparent}
.avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--color-brand),var(--color-accent));color:#fff}
.dd-menu{border-radius:12px;border-color:var(--line-strong);background:var(--color-surface);box-shadow:0 24px 48px -16px rgba(0,0,0,.5);transform-origin:top right}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
.dd-item{border-radius:7px;font-size:13.5px;padding:8px 10px}

/* ── app shell ─────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .28s var(--ease-out)}
.app.sb-c{grid-template-columns:var(--sb-w-c) minmax(0,1fr)}
.sb{position:sticky;top:0;height:100vh;background:var(--color-sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:60;overflow:hidden}
.sb-top{display:flex;align-items:center;justify-content:space-between;gap:8px;height:var(--top-h);padding:0 12px 0 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.sb-logo{background:none;border:0;padding:4px;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0;color:var(--ink)}
.sb-logo img{height:20px;display:block}
.theme-dark .sb-logo img{filter:invert(1) hue-rotate(180deg) brightness(1.1)}
.sb-mark{display:none;width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--color-brand),var(--color-accent));color:#fff;font-weight:700;font-size:14px;align-items:center;justify-content:center}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 16px;position:relative}
.sb-g{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px;white-space:nowrap}
.sb-g:first-child{padding-top:4px}
.sb-link{position:relative;display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--ink-2);font:inherit;font-size:13.5px;font-weight:500;padding:0 10px;height:36px;border-radius:8px;cursor:pointer;text-align:left;white-space:nowrap;transition:background .15s,color .15s;z-index:1}
.sb-link:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink)}
.sb-link.on{color:var(--ink)}
.sb-link .ico{opacity:.85}
.sb-link.on .ico{color:var(--color-brand);opacity:1}
.sb-link .sb-n{margin-left:auto;font-size:11.5px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--color-danger-bg);color:var(--color-danger);display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.sb-ind{position:absolute;top:0;left:10px;right:10px;height:36px;border-radius:8px;background:var(--color-brand-soft);box-shadow:inset 2px 0 0 var(--color-brand);z-index:0;transition:transform .32s var(--ease-out),opacity .2s;pointer-events:none}
.sb-foot{border-top:1px solid var(--line);padding:10px;flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:10px;padding:6px;border-radius:9px;min-width:0}
.sb-user b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap}
.sb-user > div{min-width:0}
.app.sb-c .sb-g,.app.sb-c .sb-t,.app.sb-c .sb-n,.app.sb-c .sb-user > div,.app.sb-c .sb-logo img{display:none}
.app.sb-c .sb-mark{display:inline-flex}
.app.sb-c .sb-top{padding:0 8px;flex-direction:column;justify-content:center;gap:2px;height:auto;min-height:var(--top-h)}
.app.sb-c .sb-link{justify-content:center;padding:0}
.app.sb-c .sb-g{display:block;height:10px;padding:0;font-size:0;border-top:1px solid var(--line);margin:8px 6px}
.app.sb-c .sb-collapse svg{transform:rotate(180deg)}
.sb-collapse svg{transition:transform .25s var(--ease)}
.app-main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;height:var(--top-h);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--color-surface-glass);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.crumbs button{background:none;border:0;color:var(--ink-3);font:inherit;cursor:pointer;padding:2px 4px;border-radius:5px}
.crumbs button:hover{color:var(--ink);background:var(--sunk)}
.crumbs .cur{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{opacity:.5}
.kbar-btn{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 10px;min-width:220px;border:1px solid var(--line-strong);border-radius:9px;background:var(--color-bg-2);color:var(--ink-3);font:inherit;font-size:13px;cursor:pointer;transition:border-color .15s,color .15s}
.kbar-btn:hover{border-color:color-mix(in srgb,var(--color-brand) 50%,transparent);color:var(--ink-2)}
.kbar-btn kbd,.kbd{margin-left:auto;font-family:var(--font-code);font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-3)}
.app-main > .main{max-width:1440px;padding:24px 28px 32px}
.app-main .pg-footer{margin-top:auto}
.sb-scrim{display:none}
.mob-only{display:none}
@media (max-width:980px){
  .app,.app.sb-c{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;left:0;top:0;bottom:0;width:min(84vw,280px);transform:translateX(-102%);transition:transform .3s var(--ease-out);box-shadow:var(--shadow-2)}
  .app.sb-open .sb{transform:none}
  .app.sb-open .sb-scrim{display:block;position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:55;animation:fadeIn .2s}
  .app.sb-c .sb-g,.app.sb-c .sb-t,.app.sb-c .sb-n,.app.sb-c .sb-user > div,.app.sb-c .sb-logo img{display:revert}
  .app.sb-c .sb-mark{display:none}
  .app.sb-c .sb-link{justify-content:flex-start;padding:0 10px}
  .sb-collapse{display:none}
  .mob-only{display:inline-flex}
  .kbar-btn{min-width:0;width:34px;padding:0;justify-content:center}
  .kbar-btn span,.kbar-btn kbd{display:none}
  .topbar{padding:0 12px}
  .app-main > .main{padding:18px 16px 28px}
}
/* page enter */
@keyframes pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app.pg-enter .main{animation:pgIn .32s var(--ease-out) both}
.intro .rv{animation:rise .5s var(--ease-out) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── command palette ───────────────────────────────────── */
.kp-wrap{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(2,6,23,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .15s ease both}
.kp{width:min(640px,100%);background:var(--color-surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 40px 80px -20px rgba(0,0,0,.6);overflow:hidden;animation:kpIn .22s var(--ease-out) both}
@keyframes kpIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.kp-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.kp-in input{flex:1;height:52px;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;outline:none}
.kp-list{max-height:min(420px,60vh);overflow:auto;padding:6px}
.kp-g{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 4px}
.kp-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
.kp-it .ico{color:var(--ink-3)}
.kp-it small{margin-left:auto;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.kp-it.on{background:var(--color-brand-soft)}
.kp-it.on .ico{color:var(--color-brand)}
.kp-empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:13.5px}
.kp-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
/* toast */
#toast{border-radius:10px}
/* skeleton */
.skel{background:linear-gradient(90deg,var(--sunk) 0%,var(--color-surface-3) 50%,var(--sunk) 100%);background-size:200% 100%;animation:skel 1.3s ease-in-out infinite;border-radius:8px}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
.hero-actions .btn{border-radius:9px;min-height:42px;font-size:14px}
@media (prefers-reduced-motion:reduce){.sb-ind,.app{transition:none!important}}

/* ── quality: tables, badges, drawer ─────────────────────── */
.muted{color:var(--ink-3)}
.late{color:var(--color-danger);font-weight:600}
.nowrap{white-space:nowrap}
.sev{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid}
.sev .ico{width:13px;height:13px}
.sev-c{background:var(--color-danger-solid);border-color:var(--color-danger-solid);color:#fff}
.sev-ma{background:var(--fail-bg);border-color:var(--fail-line);color:var(--fail)}
.sev-mi{background:var(--minor-bg);border-color:var(--minor-line);color:var(--minor)}
.stg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.stg i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex-shrink:0;transition:background .3s}
.stg.st-open i{background:var(--color-brand)}
.stg.st-prog i{background:var(--color-accent)}
.stg.st-wait i{background:var(--color-warn)}
.stg.st-closed i{background:var(--color-pass-solid)}
.stg.st-closed{color:var(--ink-3)}
.q-alerts{display:flex;gap:10px;flex-wrap:wrap;margin:-6px 0 14px}
.q-alert{display:inline-flex;align-items:center;gap:8px;border:1px solid;border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;background:none;transition:transform .15s var(--ease)}
.q-alert:hover{transform:translateY(-1px)}
.q-alert .ico{width:16px;height:16px}
.q-alert b{font-variant-numeric:tabular-nums}
.q-alert.crit{border-color:var(--fail-line);background:var(--fail-bg);color:var(--fail)}
.q-alert.late{border-color:var(--minor-line);background:var(--minor-bg);color:var(--minor)}
.q-alert.wait{border-color:color-mix(in srgb,var(--color-brand) 40%,transparent);background:var(--color-brand-soft);color:var(--color-brand-strong)}
.theme-dark .q-alert.wait{color:#C7CEFF}
.stage-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.ss-it{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.ss-it b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ss-it:hover{border-color:var(--color-brand);color:var(--ink)}
.ss-it.on{background:var(--color-brand-soft);border-color:var(--color-brand);color:var(--ink)}
/* data table */
.dt{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-1)}
.dt-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.dt-search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--color-bg-2);min-width:200px;flex:1 1 200px;max-width:320px;color:var(--ink-3)}
.dt-search:focus-within{border-color:var(--color-brand);box-shadow:var(--ring)}
.dt-search input{flex:1;border:0;background:none;outline:none;color:var(--ink);font:inherit;font-size:13.5px;min-width:0}
.dt-f select.field{min-height:36px;height:36px;padding:0 30px 0 10px;font-size:13px;width:auto;max-width:200px}
.dt-f select.field.on{border-color:var(--color-brand);color:var(--ink)}
.dt-sp{flex:1}
.dt .dd-menu{min-width:230px}
.dt-col{display:flex!important;align-items:center;gap:8px;cursor:pointer}
.dt-col input{accent-color:var(--color-brand)}
.dt-view{display:flex;align-items:center}
.dt-view .dd-item{flex:1}
.dt-bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:var(--color-brand-soft);border-bottom:1px solid var(--line);font-size:13px;animation:fadeIn .18s var(--ease)}
.dt-bulk b{margin-right:6px}
.dt-wrap{overflow-x:auto}
.dt-t{width:100%;border-collapse:collapse;font-size:13.5px}
.dt-t th{position:sticky;top:0;background:var(--color-bg-2);text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:0;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.dtSort{all:unset;display:flex;align-items:center;gap:5px;padding:9px 12px;cursor:pointer;width:100%;box-sizing:border-box}
.dtSort:hover,.dtSort.on{color:var(--ink)}
.dtSort:focus-visible{outline:2px solid var(--color-brand);outline-offset:-2px}
.dt-arr{opacity:.45;font-size:11px}
.dtSort.on .dt-arr{opacity:1;color:var(--color-brand)}
.dt-t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt-t tbody tr{cursor:pointer;transition:background .12s}
.dt-t tbody tr:hover td,.dt-t tbody tr:focus-visible td{background:color-mix(in srgb,var(--color-brand) 6%,transparent)}
.dt-t tbody tr:focus-visible{outline:none}
.dt-t tbody tr.sel td{background:var(--color-brand-soft)}
.dt-t tr.row-crit td:first-child{box-shadow:inset 3px 0 0 var(--color-danger-solid)}
.dt-t tr.row-late td:first-child{box-shadow:inset 3px 0 0 var(--color-warn)}
.dt-t tr.row-crit.row-late td:first-child{box-shadow:inset 3px 0 0 var(--color-danger-solid)}
.dt-ck{width:40px;padding-left:14px!important}
.dt-ck input{width:16px;height:16px;accent-color:var(--color-brand);cursor:pointer}
.id-cell{font-size:12.5px;color:var(--ink-2)}
.cell-title{font-weight:500;color:var(--ink)}
.cell-sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.w-title{min-width:220px}
.dt-empty{text-align:center;color:var(--ink-3);padding:40px 16px!important;cursor:default}
.dt-foot{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:12.5px;color:var(--ink-3)}
.dt-size{display:flex;align-items:center;gap:6px}
.dt-size select.field{min-height:30px;height:30px;padding:0 26px 0 8px;font-size:12.5px;width:auto}
.dt-pn{font-variant-numeric:tabular-nums}
.btn-icon:disabled{opacity:.35;cursor:default}
.cp-cell{display:flex;flex-direction:column;gap:5px}
.cp-bar{display:flex;gap:3px}
.cp-bar i{width:14px;height:4px;border-radius:2px;background:var(--sunk)}
.cp-bar i.done{background:var(--color-pass-solid)}
.cp-bar i.cur{background:var(--color-brand)}
@media (max-width:760px){
  .dt-t thead{display:none}
  .dt-t,.dt-t tbody,.dt-t tr,.dt-t td{display:block;width:100%}
  .dt-t tr{padding:10px 14px;border-bottom:1px solid var(--line)}
  .dt-t td{border:0;padding:3px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
  .dt-t td::before{content:attr(data-l);font-size:12px;color:var(--ink-3);flex-shrink:0}
  .dt-t td.dt-ck{display:none}
  .dt-t td.w-title{display:block}.dt-t td.w-title::before{content:none}
  .dt-search{max-width:none}
  .dt-f{flex:1 1 45%}.dt-f select.field{max-width:none;width:100%}
  .dt-t tr.row-crit,.dt-t tr.row-late{box-shadow:inset 3px 0 0 var(--color-warn)}
  .dt-t tr.row-crit{box-shadow:inset 3px 0 0 var(--color-danger-solid)}
  .dt-t tr td:first-child{box-shadow:none!important}
}
/* drawer */
.dw-wrap{position:fixed;inset:0;z-index:120;pointer-events:none}
.dw-scrim{position:absolute;inset:0;background:rgba(2,6,23,.5);pointer-events:auto}
.dw{position:absolute;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--color-surface);border-left:1px solid var(--line-strong);box-shadow:-30px 0 60px -30px rgba(0,0,0,.6);display:flex;flex-direction:column;pointer-events:auto}
.dw-anim .dw{animation:dwIn .34s var(--ease-out) both}
.dw-anim .dw-scrim{animation:fadeIn .25s ease both}
.dw-out .dw{animation:dwOut .18s ease-in both}.dw-out .dw-scrim{animation:fadeOut .18s ease-in both}
@keyframes dwIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes dwOut{to{transform:translateX(40px);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.dw-h{position:relative;padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.dw-id{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);padding-right:40px}
.dw-id .mono{color:var(--ink-2)}
.dirty{font-size:11.5px;color:var(--color-warn);font-weight:600}
.dw-h h2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:6px 0 12px;padding-right:30px;line-height:1.3}
.dw-x{position:absolute;top:14px;right:14px}
.dw-b{flex:1;overflow-y:auto;padding:6px 22px 22px}
.dw-sec{padding:16px 0;border-bottom:1px solid var(--line)}
.dw-sec:last-child{border-bottom:0}
.dw-sec h3{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .fw{grid-column:1/-1}
.fgrid .fg{margin-bottom:12px}
.req{color:var(--color-danger);margin-left:2px}
.hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.dw textarea.field{resize:vertical;min-height:64px;line-height:1.45}
.dw .field[readonly],.dw select.field:disabled{background:transparent;border-style:dashed;color:var(--ink-2)}
.dw-f{border-top:1px solid var(--line);padding:12px 22px;background:var(--color-bg-2);display:flex;flex-direction:column;gap:10px}
.row-btns{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row-btns .more,.row-btns .main-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-btns .main-btns{margin-left:auto}
.gate{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding:8px 10px;border-radius:8px;background:var(--minor-bg);border:1px solid var(--minor-line)}
.gate .ico{width:16px;height:16px;color:var(--color-warn);flex-shrink:0;margin-top:1px}
.gate.ok{background:var(--pass-bg);border-color:var(--pass-line)}
.gate.ok .ico{color:var(--color-ok)}
.dw-b > .gate{margin-top:14px}
.back-box{display:grid;gap:8px;padding:10px;border:1px solid var(--fail-line);border-radius:8px;background:var(--fail-bg);animation:fadeIn .2s}
.back-box .row-btns{justify-content:flex-end}
/* stepper */
.stepper{list-style:none;display:flex;gap:0;margin:0;padding:0;overflow-x:auto;scrollbar-width:none}
.stepper li{flex:1;min-width:72px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;font-size:11px;color:var(--ink-3);text-align:center}
.stepper li::before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line-strong);z-index:0}
.stepper li:first-child::before{content:none}
.stepper li.done::before,.stepper li.cur::before{background:var(--color-pass-solid)}
.sp-dot{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--color-surface);border:2px solid var(--line-strong);color:var(--ink-3);transition:all .3s var(--ease)}
.sp-dot .ico{width:13px;height:13px}
.stepper li.done .sp-dot{background:var(--color-pass-solid);border-color:var(--color-pass-solid);color:var(--color-on-pass)}
.stepper li.cur .sp-dot{border-color:var(--color-brand);color:var(--color-brand);box-shadow:0 0 0 4px var(--color-brand-soft);animation:spPulse .6s var(--ease-out)}
.stepper li.cur{color:var(--ink);font-weight:600}
@keyframes spPulse{from{transform:scale(.7)}60%{transform:scale(1.12)}to{transform:none}}
.sp-t{line-height:1.25;padding:0 2px}
/* timeline */
.tl2{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl2 li{position:relative;padding:0 0 14px 6px;font-size:13px}
.tl2 li::before{content:"";position:absolute;left:-24px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--color-surface);border:2px solid var(--ink-3)}
.tl2 li.tl-fw::before{border-color:var(--color-pass-solid);background:var(--color-pass-solid)}
.tl2 li.tl-bk::before{border-color:var(--color-warn)}
.tl-d{color:var(--ink-2);margin-top:2px;white-space:pre-wrap}
.tl-m{font-size:12px;color:var(--ink-3);margin-top:2px}
/* evidence */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:4px}
.ev{display:block;aspect-ratio:4/3;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--sunk);transition:border-color .15s,transform .15s var(--ease)}
.ev:hover{border-color:var(--color-brand);transform:translateY(-1px)}
.ev img{width:100%;height:100%;object-fit:cover;display:block}
.ev-f{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;font-size:12px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--color-brand);color:var(--ink)}
/* 5 whys + fishbone */
.whys{display:grid;gap:6px;margin-bottom:14px}
.why{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;position:relative}
.why-n{font-size:12px;font-weight:600;color:var(--ink-3)}
.why:not(:last-child)::after{content:"";position:absolute;left:30px;bottom:-6px;height:6px;width:1px;background:var(--line-strong)}
.fish{display:grid;grid-template-columns:1fr 110px;align-items:stretch;gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fish-bones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);position:relative}
.bone{background:var(--color-surface);padding:8px;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-3)}
.bone textarea.field{min-height:46px;font-size:12.5px;font-weight:400}
.fish-head{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12.5px;font-weight:600;background:linear-gradient(90deg,var(--color-brand-soft),transparent);border-left:2px solid var(--color-brand);color:var(--ink)}
@media (max-width:640px){ .fgrid{grid-template-columns:1fr} .fish{grid-template-columns:1fr} .fish-bones{grid-template-columns:1fr 1fr} .fish-head{border-left:0;border-top:2px solid var(--color-brand)} .dw-h,.dw-b,.dw-f{padding-left:16px;padding-right:16px} }
/* dialog */
.dlg-wrap{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,23,.55);animation:fadeIn .18s}
.dlg{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--color-surface);border:1px solid var(--line-strong);border-radius:14px;padding:22px;box-shadow:0 40px 80px -20px rgba(0,0,0,.6);animation:kpIn .24s var(--ease-out)}
.dlg h2{font-size:18px;font-weight:600;letter-spacing:-.015em;margin-bottom:6px}
.dlg .muted{font-size:13.5px;margin-bottom:14px}
.dlg-list{display:grid;gap:8px;margin-bottom:16px}
.dlg-it{display:grid;grid-template-columns:auto 150px 1fr 110px;gap:8px;align-items:center;font-size:12.5px}
.dlg-it input[type=checkbox]{width:16px;height:16px;accent-color:var(--color-brand)}
@media (max-width:640px){ .dlg-it{grid-template-columns:auto 1fr} .dlg-it .field{grid-column:1/-1} }
</style>
</head>

function mmyy(s){ if(!s)return''; const[y,m]=s.split('-'); return m+y.slice(2); }
function mmyyDisp(c){ if(!c||c.length!==4)return'-'; return c.slice(0,2)+'/20'+c.slice(2); }
function mmyyInp(c){ if(!c||c.length!==4)return''; return'20'+c.slice(2)+'-'+c.slice(0,2); }

// ═══════════════════════════════════════════════════════════
// DRAFT AUTO-SAVE (so in-progress inspections survive refresh/close)
// ═══════════════════════════════════════════════════════════
function draftKey(lot){
  return 'oba_draft_'+(user?user.username:'anon')+'_'+lot.batchName+'_'+lot.lotNumber+((lot.round||1)>1?'_r'+lot.round:'');
}
/* Lot state used everywhere: pass, fail (old rule), hold, reoffer, open, closed */
function lotState(l){ return l.result==='PASS'?'pass':l.result==='FAIL'?'fail':l.status==='Hold'?'hold':l.status==='Reoffered'?'reoffer':l.status==='Open'?'open':'closed'; }
function inspectable(l){ return l.status==='Open'||l.status==='Reoffered'; }
let draftSavedAt=null, prevResults={}, focusSerial=null;
function saveDraft(){
  if(!activeLot) return;
  draftSavedAt=new Date(); const ds=document.getElementById('draftAt'); if(ds) ds.textContent='Draft saved '+draftSavedAt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  // Stamp each sample with its completion time if not already stamped
  samples.forEach(s=>{
    if(!s.inspectedAt && sampleResult(s)!=='PENDING'){
      s.inspectedAt = new Date().toISOString();
    }
  });
  try{
    localStorage.setItem(draftKey(activeLot), JSON.stringify({
      lot:activeLot, samples:samples,
      lotRemarks:lotRemarksVal,
      savedAt:new Date().toISOString()
    }));
  }catch(e){ /* storage full or blocked - ignore */ }
}
function loadDraft(lot){
  try{
    const raw=localStorage.getItem(draftKey(lot));
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearDraft(lot){
  try{ localStorage.removeItem(draftKey(lot)); }catch(e){}
}
function listDraftsForUser(){
  const out=[];
  const prefix='oba_draft_'+(user?user.username:'anon')+'_';
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.startsWith(prefix)){
      try{
        const d=JSON.parse(localStorage.getItem(k));
        out.push({key:k, ...d});
      }catch(e){}
    }
  }
  return out;
}

function toast(msg,type='ok'){
  clearTimeout(toastTimer);
  const el=document.getElementById('toast');
  const ms=type==='err'?6000:3500;
  el.className=`toast toast-${type}`;
  el.textContent=msg;
  el.style.setProperty('--t',ms+'ms');
  el.style.display='block'; el.style.animation='none'; void el.offsetWidth; el.style.animation='';
  toastTimer=setTimeout(()=>{ el.style.display='none'; },ms);
}

function saveSession(){ try{ if(user&&session) localStorage.setItem('oba_session',JSON.stringify({user,session})); else localStorage.removeItem('oba_session'); }catch(e){} }
function restoreSession(){
  try{
    const s=JSON.parse(localStorage.getItem('oba_session')||'null');

async function api(action,data={}){

// GROUPING
// ═══════════════════════════════════════════════════════════
function groupBatches(){
  const map={},order=[];
  batches.forEach(b=>{
    if(!map[b.batchName]){map[b.batchName]=[];order.push(b.batchName);}
    map[b.batchName].push(b);
  });
  return order.map(name=>{
    const lots=map[name];
    lots.sort((a,b)=>{
      const na=parseInt(String(a.lotNumber).replace(/\D+/g,''))||0;
      const nb=parseInt(String(b.lotNumber).replace(/\D+/g,''))||0;
      return na-nb;
    });
    const batchQty   = Number(lots[0].batchQty)||0;
    const totalLots  = Number(lots[0].totalLots)||lots.length;
    const completed  = lots.filter(l=>l.status==='Closed').length;
    const pending    = lots.filter(l=>l.status==='Open'||l.status==='Reoffered').length;
    const holdLots   = lots.filter(l=>l.status==='Hold').length;
    const passLots   = lots.filter(l=>l.result==='PASS').length;
    const failLots   = lots.filter(l=>l.result==='FAIL').length;
    const fgTotal    = lots.reduce((s,l)=>s+Number(l.fgPassQty||0),0);
    return{name,lots,batchQty,totalLots,completed,pending,holdLots,passLots,failLots,fgTotal,
           model:lots[0].model||'',prodMonthCode:lots[0].prodMonthCode||'',prodMonthCode2:lots[0].prodMonthCode2||'',
           bomStatus:lots[0].bomStatus||'',bomVerId:lots[0].bomVerId||''};
  });
}

// SERIAL VALIDATION
// ═══════════════════════════════════════════════════════════
/* the fixed start of every serial in this lot: model code + month (only when the lot has one production month) */
function serialPrefix(lot){
  const md=lot&&getModel(lot.model); if(!md) return '';
  let pmc=String(lot.prodMonthCode||'').trim(); if(pmc.length===3) pmc='0'+pmc;
  return md.code+(!lot.prodMonthCode2&&/^\d{4}$/.test(pmc)?pmc:'');
}
function validateSerial(serial,model,prodMonthCode,batchUsed,prodMonthCode2){
  const s=(serial||'').trim().toUpperCase();
  if(!/^\d{15}$/.test(s)) return 'Must be exactly 15 digits';
  // Model code: first 4 digits
  const md=getModel(model);
  if(!md) return `Model "${model}" not found in model list — ask admin to add it`;
  if(s.substring(0,4)!==md.code){
    return `Model code must be ${md.code} for ${model} — got ${s.substring(0,4)}`;
  }
  // Month codes: digits 5-8 (MMYY)
  let pmc=String(prodMonthCode||'').trim(); if(pmc.length===3) pmc='0'+pmc;
  let pmc2=String(prodMonthCode2||'').trim(); if(pmc2.length===3) pmc2='0'+pmc2;
  const serialMonth=s.substring(4,8);
  const validMonths=[pmc,pmc2].filter(Boolean);
  if(validMonths.length>0 && !validMonths.includes(serialMonth)){
    const labels=validMonths.map(m=>m+' ('+mmyyDisp(m)+')').join(' or ');
    return `Month code must be ${labels} — got ${serialMonth}`;
  }
  const mm=parseInt(s.substring(4,6));
  if(isNaN(mm)||mm<1||mm>12) return 'Month digits invalid (01-12)';
  // Last 7 digits: numeric serial
  if(!/^\d{7}$/.test(s.substring(8))) return 'Last 7 chars must be numeric';
  if((batchUsed||[]).includes(s)) return 'Duplicate serial in this batch';
  return '';
}

// ═══════════════════════════════════════════════════════════
// BLACK DOT LOGIC — limits come from the model's spec (admin-defined)
// ═══════════════════════════════════════════════════════════
function evalBD(s,spec){
  spec=spec||activeSpec;
  if(s.bdNoDot) return {ok:true,reason:'No Black Dot — Acceptable'};
  if(!s.bdVisible) return {ok:true,reason:'Not visible at 2m — Acceptable (any quantity)'};
  if(!spec) return {ok:false,reason:'No Black Dot spec for this model — ask admin'};
  const D=parseFloat(s.bdD), N=parseInt(s.bdN), DS=parseFloat(s.bdDS);
  // Incomplete entry → sample stays PENDING (not a false FAIL)
  if(!(D>0))  return {ok:false,incomplete:true,reason:'Enter D (mm)'};
  if(!(N>=1)) return {ok:false,incomplete:true,reason:'Enter N (spots)'};
  if(N>1 && !(DS>=0) ) return {ok:false,incomplete:true,reason:'Enter DS (mm) — needed when N>1'};
  if(D>spec.maxD) return {ok:false,reason:`D=${D}mm > ${spec.maxD}mm — FAIL`};
  if(N>spec.maxN) return {ok:false,reason:`N=${N} > ${spec.maxN} — FAIL`};
  if(N>1 && DS<spec.minDS) return {ok:false,reason:`DS=${DS}mm < ${spec.minDS}mm — FAIL`};
  const dsTxt=N>1?`, DS=${DS}mm`:'';
  if(D<=spec.smallD) return {ok:true,reason:`D=${D}mm ≤ ${spec.smallD}mm, N=${N}${dsTxt} — OK`};
  // smallD < D <= maxD : area rules
  const area=s.bdArea||'A';
  const lim=area==='A'?spec.nA:area==='B'?spec.nB:spec.nAB;
  if(N<=lim) return {ok:true,reason:`D=${D}mm in Area ${area}, N=${N}≤${lim}${dsTxt} — OK`};
  return {ok:false,reason:`Area ${area}: N=${N}>${lim} — FAIL`};
}

// ═══════════════════════════════════════════════════════════
// SAMPLE RESULT
// ═══════════════════════════════════════════════════════════
function sampleResult(s){
  if(!s.serial||s.serialError) return 'PENDING';
  const bd=evalBD(s);
  if(bd.incomplete) return 'PENDING';
  const major=!s.generalPass||!s.funcPass||!s.screenPass||!bd.ok;
  const minor=!s.aestheticPass;
  if(major) return 'FAIL-MAJOR';
  if(minor) return 'FAIL-MINOR';
  return 'PASS';
}

function freshSamples(n){
  return Array.from({length:n},(_,i)=>({
    num:i+1,serial:'',serialError:'',
    aestheticPass:true,generalPass:true,funcPass:true,screenPass:true,
    bdNoDot:true,bdVisible:false,bdD:'',bdN:'',bdDS:'',bdArea:'A',
    remark:'',locked:false
  }));
}

function tallyLot(){
  let minor=0,major=0;
  samples.forEach(s=>{
    const r=sampleResult(s);
    if(r==='FAIL-MINOR') minor++;
    if(r==='FAIL-MAJOR') major++;
  });
  return{minor,major,defective:minor+major,passed:minor+major===0,filled:samples.filter(s=>sampleResult(s)!=='PENDING').length};
}

function kpOpen(){
  if(!user||kp) return;

  w.innerHTML=`<div class="kp" role="dialog" aria-modal="true" aria-label="Search and commands"><div class="kp-in">${ico('search')}<input id="kpQ" placeholder="Search batches, lots, models, records, or type a command" autocomplete="off" spellcheck="false" aria-controls="kpList"><span class="kbd">Esc</span></div><div class="kp-list" id="kpList" role="listbox"></div><div class="kp-foot"><span><span class="kbd">↑↓</span> move</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">Esc</span> close</span></div></div>`;
  document.body.appendChild(w);

  const q=document.getElementById('kpQ');
  q.oninput=()=>{ kp.q=q.value; kp.sel=0; kpDraw(); };
  q.onkeydown=e=>{
    const n=kp.shown.length;
    if(e.key==='ArrowDown'){ e.preventDefault(); kp.sel=(kp.sel+1)%Math.max(n,1); kpDraw(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); kp.sel=(kp.sel-1+n)%Math.max(n,1); kpDraw(); }
    else if(e.key==='Enter'){ e.preventDefault(); kpRun(kp.shown[kp.sel]); }

function kpScore(it,q){
  if(!q) return it.g==='Go to'||it.g==='Commands'?1:0;
  const t=it.t.toLowerCase(), s=(it.sub||'').toLowerCase();
  if(t.startsWith(q)) return 4; if(t.includes(q)) return 3; if(s.includes(q)) return 2;
  const words=q.split(/\s+/).filter(Boolean); return words.length>1&&words.every(w=>(t+' '+s).includes(w))?1.5:0;
}
function kpDraw(){
  const q=kp.q.trim().toLowerCase();
  const scored=kp.items.map(it=>({it,s:kpScore(it,q)})).filter(x=>x.s>0);
  const order=['Go to','Batches','Lots','Defects','CAPA','Models','Inspections','Commands'];
  const best={}; scored.forEach(x=>{ best[x.it.g]=Math.max(best[x.it.g]||0,x.s); });
  scored.sort((a,b)=>(q?(best[b.it.g]-best[a.it.g]):0)||(order.indexOf(a.it.g)-order.indexOf(b.it.g))||(b.s-a.s));
  const per={}; kp.shown=scored.filter(x=>{ per[x.it.g]=(per[x.it.g]||0)+1; return per[x.it.g]<=(q?8:20); }).map(x=>x.it);
  const list=document.getElementById('kpList'); if(!list) return;
  if(!kp.shown.length){ list.innerHTML=`<div class="kp-empty">Nothing matches “${esc(kp.q)}”.</div>`; return; }
  let g='', h='';
  kp.shown.forEach((it,i)=>{ if(it.g!==g){ g=it.g; h+=`<div class="kp-g">${esc(g)}</div>`; }
    h+=`<button class="kp-it ${i===kp.sel?'on':''}" data-i="${i}" role="option" aria-selected="${i===kp.sel}">${ico(it.icon||'arrow')}<span>${esc(it.t)}</span>${it.sub?`<small>${esc(it.sub)}</small>`:''}</button>`; });
  list.innerHTML=h;
  list.querySelectorAll('.kp-it').forEach(b=>{ b.onmousemove=()=>{ const i=+b.getAttribute('data-i'); if(kp.sel!==i){ kp.sel=i; list.querySelectorAll('.kp-it').forEach(x=>{ const on=+x.getAttribute('data-i')===i; x.classList.toggle('on',on); x.setAttribute('aria-selected',on); }); } }; b.onclick=()=>kpRun(kp.shown[+b.getAttribute('data-i')]); });
  list.querySelector('.kp-it.on')?.scrollIntoView({block:'nearest'});
}
function kpClose(){ const w=document.getElementById('kpWrap'); if(w) w.remove(); const p=kp&&kp.prev; kp=null; try{ p&&p.focus&&p.focus(); }catch(e){} }
function kpRun(it){ if(!it) return; kpClose(); if(activeLot||activeBom||activeRework||activeFai){ toast('Finish or leave the open screen first (Back button), then search again.','err'); return; } it.run(); }
document.addEventListener('keydown',e=>{

/* the same gates as the server: what is still missing before stage `to` */
function gateMissing(kind,f,to){
  const has=k=>String(f[k]||'').trim()!=='';
  const S=kind==='defect'?qd.meta.defectStages:qd.meta.capaStages, i=S.indexOf(to), need=[];
  if(kind==='defect'){
    if(i>=1&&!has('containment')) need.push('containment action');
    if(i>=2&&!has('Owner')) need.push('responsible owner');
    if(i>=3&&!has('rootCause')) need.push('root cause');
    if(i>=4&&!has('corrective')) need.push('corrective action');
    if(i>=4&&!has('preventive')) need.push('preventive action');
    if(i>=5&&!(has('verification')&&f.verificationResult==='Verified')) need.push('verification result: Verified');
    if(i>=6&&!(has('effectiveness')&&f.effectivenessResult==='Effective')) need.push('effectiveness result: Effective');
  } else {
    const whys=f.whys.filter(w=>String(w).trim()).length, fish=Object.values(f.fishbone).some(v=>String(v).trim());
    if(i>=1&&!has('problem')) need.push('problem statement');
    if(i>=1&&!has('containment')) need.push('immediate containment');
    if(i>=2&&!has('rootCause')) need.push('root cause');
    if(i>=2&&!whys&&!fish) need.push('5 Whys or fishbone analysis');
    if(i>=2&&!has('corrective')) need.push('corrective action');
    if(i>=2&&!has('Owner')) need.push('action owner');
    if(i>=2&&!/^\d{4}-\d{2}-\d{2}$/.test(f.DueDate||'')) need.push('due date');
    if(i>=3&&!has('preventive')) need.push('preventive action');
    if(i>=4&&!(has('verificationEvidence')&&f.verificationResult==='Verified')) need.push('verification evidence and result: Verified');

}
function stepperHtml(stages,cur){

function timelineHtml(log){

/* ── after a lot goes on hold: offer one defect record per defective sample ── */
const CHECK_CAT={Aesthetic:'Cosmetic Defect',General:'Functional Failure',Functional:'Functional Failure',Screen:'Functional Failure','Black dot':'Defective Part / Component Failure'};
function offerHoldDefects(lot,units){
  if(!can('quality')) return;
  const items=units.filter(u=>u.sampleResult==='Fail').map(u=>{
    const fails=[]; if(u.aes==='Fail') fails.push('Aesthetic'); if(u.general==='Fail') fails.push('General'); if(u.func==='Fail') fails.push('Functional'); if(u.screen==='Fail') fails.push('Screen'); if(/FAIL/i.test(u.bd||'')) fails.push('Black dot');
    const major=fails.some(f=>f!=='Aesthetic');
    return {on:true,Title:`${fails.join(' and ')||'Inspection'} failure, ${lot.lotNumber}`,Severity:major?'Major':'Minor',Category:CHECK_CAT[fails.find(f=>f!=='Aesthetic')||fails[0]]||'Other',
      Source:'Sampling inspection',Model:(getModel(lot.model)||{}).lumioModel||lot.model,Batch:lot.batchName,Lot:lot.lotNumber,Serial:u.serial,checkpoint:fails.join(', '),
      productionDate:lot.prodMonthCode||'',description:u.remark||''};
  });
  if(!items.length) return;
  qui.dlg={kind:'holdDefects',items,busy:false}; render();
}
function buildDialog(){
  const g=qui.dlg; if(!g) return '';
  if(g.kind==='holdDefects') return `<div class="dlg-wrap"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h2 id="dlgT">Record defects for this hold?</h2>
    <p class="muted">${g.items.length} defective sample${g.items.length===1?'':'s'} found. Each becomes a defect record in Open stage, linked to its lot and serial number, so containment and root cause can be tracked.</p>
    <div class="dlg-list">${g.items.map((it,i)=>`<label class="dlg-it"><input type="checkbox" class="dlgOn" data-i="${i}" ${it.on?'checked':''}><span class="mono">${esc(it.Serial)}</span><input class="field dlgTitle" data-i="${i}" value="${esc(it.Title)}" aria-label="Defect title for ${esc(it.Serial)}"><select class="field dlgSev" data-i="${i}" aria-label="Severity">${['Critical','Major','Minor'].map(x=>`<option ${x===it.Severity?'selected':''}>${x}</option>`).join('')}</select></label>`).join('')}</div>
    <div class="row-btns"><button class="btn btn-ghost" id="dlgSkip">Not now</button><button class="btn btn-primary" id="dlgGo" ${g.busy?'disabled':''}>${g.busy?'Creating…':'Create defect records'}</button></div></div></div>`;
  return '';
}
function bindDialog(){
  const g=qui.dlg; if(!g) return;
  document.querySelectorAll('.dlgOn').forEach(el=>{ el.onchange=()=>{ g.items[+el.dataset.i].on=el.checked; }; });
  document.querySelectorAll('.dlgTitle').forEach(el=>{ el.oninput=()=>{ g.items[+el.dataset.i].Title=el.value; }; });
  document.querySelectorAll('.dlgSev').forEach(el=>{ el.onchange=()=>{ g.items[+el.dataset.i].Severity=el.value; }; });
  document.getElementById('dlgSkip').onclick=()=>{ qui.dlg=null; render(); };
  document.getElementById('dlgGo').onclick=async()=>{
    const items=g.items.filter(x=>x.on).map(({on,...x})=>x); if(!items.length){ qui.dlg=null; render(); return; }
    g.busy=true; render();
    const r=await api('qCreateDefects',{items});
    if(r.ok){ qui.dlg=null; toast(`${r.ids.length} defect${r.ids.length===1?'':'s'} recorded: ${r.ids.join(', ')}`); await loadQuality(true); render(); }
    else { g.busy=false; render(); toast(r.error||'Could not create the defects','err'); }
  };
  setTimeout(()=>document.getElementById('dlgGo')?.focus(),30);
}

  if(page==='models'&&can('models')) return shell(pageHead('models')+`<div class="rv" style="--i:1">${buildModelsPanel()}</div>`);
  if(page==='data'&&can('data')) return shell(pageHead('data')+`<div class="rv" style="--i:1">${buildDataPanel()}</div>`);
  if(isAdmin&&page==='users') return shell(pageHead('users')+buildUsersCard());

function buildOverview(isAdmin){
  const groups=groupBatches();
  const totalLots=batches.length;
  const done=batches.filter(b=>b.status==='Closed').length;
  const passL=batches.filter(b=>b.result==='PASS').length;
  const failL=batches.filter(b=>b.result==='FAIL').length;
  const fgAll=batches.reduce((s,b)=>s+Number(b.fgPassQty||0),0);
  const pct=totalLots?Math.round(done/totalLots*100):0;
  return `${buildHero(groups,isAdmin)}
  <div class="stat-grid rv" style="--i:3" aria-label="Lot totals">
    <div class="stat"><div class="stat-label">Total Lots</div><div class="stat-val">${totalLots}</div></div>
    <div class="stat"><div class="stat-label">Progress</div><div class="stat-val" style="font-size:18px">${done}/${totalLots}</div>
      <div style="margin-top:6px"><div class="progress-bar" style="height:6px"><div class="progress-fill" style="width:${pct}%"></div></div></div>
      <div class="stat-sub">${pct}% done</div></div>
    <div class="stat"><div class="stat-label">Pass Lots</div><div class="stat-val text-pass">${passL}</div><div class="stat-sub text-fail">${failL} fail</div></div>
    <div class="stat"><div class="stat-label">FG Released</div><div class="stat-val text-pass">${fgAll}</div><div class="stat-sub">Certified units</div></div>
  </div>
  <details class="rules rv" style="--i:4">
    <summary>Acceptance and black dot rules</summary>
    <div class="rules-body">
    <b>Acceptance:</b> each lot of 90 units is judged on 13 samples (a smaller lot on 13, or all its units when it has fewer). Any defect, minor (aesthetic) or major (general, functional, screen or black dot), puts the lot on hold.<br>
    ${models.length?models.map(m=>`<b>Black dot, ${esc(m.lumioModel||m.name)}:</b> ${esc(specText(m))}`).join('<br>'):'<b>Black dot:</b> no models yet. '+(isAdmin?'Add one under Admin, Models and black dot spec.':'Ask an admin to add one.')}
    </div>
  </details>`;
}

function buildBatchesBody(isAdmin){
  const groups=groupBatches();
  let html='';
  // BATCH + LOT BROWSER
  const stOf=lotState;
  const inFilter=(l,k)=>k==='all'||(k==='open'?inspectable(l):stOf(l)===k);
  const lotNo=l=>{const m=String(l.lotNumber).match(/(\d+)\s*$/);return m?m[1]:l.lotNumber;};
  const inBatch=l=>!view.batch||l.batchName===view.batch;
  const matches=l=>inFilter(l,view.status)&&(!view.q||String(l.lotNumber).toLowerCase().includes(view.q.trim().toLowerCase()));
  const cnt=k=>batches.filter(l=>inBatch(l)&&inFilter(l,k)).length;
  html+=`<div id="batchList" class="rv" style="--i:1">`;
  if(groups.length===0){
    html+=`<div class="card" style="text-align:center;padding:40px;color:var(--ink-3)">No batches yet. ${isAdmin?'<button class="btn btn-primary btn-sm navGo" data-go="create" style="margin-left:8px">Create a batch</button>':'Ask an admin to create a batch.'}</div>`;
  } else {
    html+=`<div class="lot-toolbar">
      <div><label class="lbl" for="fBatch">Batch</label>
        <select id="fBatch" class="field"><option value="">All batches (${groups.length})</option>${groups.map(g=>`<option value="${esc(g.name)}" ${g.name===view.batch?'selected':''}>${esc(g.name)}, ${g.completed} of ${g.totalLots} lots done</option>`).join('')}</select></div>
      <div><span class="lbl">Show lots</span><div class="seg" role="group" aria-label="Filter lots by status">${[['all','All'],['open','To inspect'],['hold','On hold'],['pass','Passed'],['fail','Failed']].map(([k,l])=>`<button class="seg-btn fStatus ${view.status===k?'on':''}" data-k="${k}" aria-pressed="${view.status===k}">${l}<span>${cnt(k)}</span></button>`).join('')}</div></div>
      <div><label class="lbl" for="fSearch">Find a lot</label><input id="fSearch" class="field" type="search" value="${esc(view.q)}" placeholder="Lot number, e.g. 12"></div>
    </div>`;
    groups.filter(g=>!view.batch||g.name===view.batch).forEach(g=>{
      const pct2=g.totalLots?Math.round(g.completed/g.totalLots*100):0;
      const lots=g.lots.filter(matches);
      const locked=g.bomStatus==='Pending'||g.bomStatus==='Failed';
      const nextOpen=(!isAdmin&&can('sampling')&&!locked)?g.lots.find(inspectable):null;
      html+=`<div class="batch-group fade">
      <div class="batch-hdr">
        <div>
          <div class="batch-name">${esc(g.name)}</div>
          <div class="batch-meta">
            ${esc(modelLabel(g.model))}, production <b>${mmyyDisp(g.prodMonthCode)}${g.prodMonthCode2?' / '+mmyyDisp(g.prodMonthCode2):''}</b>, <b>${g.batchQty||'?'}</b> units in <b>${g.totalLots}</b> lots<br>
            <b>${g.completed}</b> inspected, <b>${g.pending}</b> open${g.holdLots?`, <b class="text-warn">${g.holdLots}</b> on hold`:''},
            <b class="text-pass">${g.passLots}</b> passed, <b class="text-fail">${g.failLots}</b> failed, <b class="text-pass">${g.fgTotal}</b> units released
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div>
            <div class="progress-bar" style="width:140px"><div class="progress-fill" style="width:${pct2}%"></div></div>
            <div class="text-muted" style="text-align:right;margin-top:4px">${pct2}% inspected</div>
          </div>
          ${nextOpen?`<button class="btn btn-primary btn-sm startBtn" data-ri="${batches.indexOf(nextOpen)}">Inspect next open lot (${esc(lotNo(nextOpen))})</button>`:''}
          ${isAdmin?`<button class="btn btn-ghost btn-sm delBatchBtn" data-name="${esc(g.name)}" style="color:var(--fail)">Delete batch</button>`:''}
        </div>
      </div>
      ${buildFlow(g,isAdmin)}`;
      if(!lots.length){
        html+=`<div class="lot-empty">No lots in this batch match the filter.</div>`;
      } else {
        html+=`<div class="lot-grid" role="list">${lots.map(l=>{
          const ri=batches.indexOf(l), st=stOf(l), key=l.batchName+'||'+l.lotNumber;
          const draft=(!isAdmin&&can('sampling')&&inspectable(l))?loadDraft(l):null;
          const cls=draft?'t-draft':(st==='open'&&locked)?'t-lock':'t-'+st;
          const lk=st==='open'&&locked;
          const word=draft?'Draft':lk?'Locked':st==='pass'?'Pass':st==='fail'?'Fail':st==='hold'?'Hold':st==='reoffer'?'Reoffer':st==='open'?'Open':'Closed';
          return `<button class="lot-tile ${cls} lotTile ${selLot===key?'sel':''}" data-ri="${ri}" role="listitem" aria-pressed="${selLot===key}" title="${esc(l.lotNumber)}: ${word}"><span class="lt-no">${esc(lotNo(l))}</span><span class="lt-st">${word}</span></button>`;
        }).join('')}</div>`;
      }
      const sel=g.lots.find(l=>selLot===l.batchName+'||'+l.lotNumber);
      if(sel) html+=buildLotDetail(sel,isAdmin);
      html+=`</div>`;
    });
  }
  html+=`</div>`;
  return html;
}

// ─── DASHBOARD HERO + LOT MAP ─────────────────────────────
function buildHero(groups,isAdmin){
  const st=l=>{const x=lotState(l); return x==='open'&&(l.bomStatus==='Pending'||l.bomStatus==='Failed')?'lock':x;};
  const all=batches, pass=all.filter(l=>l.result==='PASS').length, fail=all.filter(l=>l.result==='FAIL').length;
  const hold=all.filter(l=>l.status==='Hold').length;
  const open=all.filter(l=>l.status!=='Closed').length, lockedB=groups.filter(g=>g.bomStatus==='Pending'||g.bomStatus==='Failed');
  const nextLot=(!isAdmin&&can('sampling'))?all.find(l=>inspectable(l)&&!samplingLocked(l.batchName)):null;
  const holdLot=can('sampling')?all.find(l=>l.status==='Hold'):null;
  const today=new Date().toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'});
  let title, text;
  if(!all.length){ title='No batches yet.'; text=isAdmin?'Create the first batch. It starts with BOM verification, then sampling.':'Batches appear here once an admin creates them.'; }
  else if(!open){ title=`All ${all.length} lots are inspected.`; text=`${pass} passed${fail?`, ${fail} failed`:''}. Nothing is waiting for sampling.`; }
  else { title=`${pass} lots passed, ${open} still to inspect.`;
    const bits=[]; if(hold) bits.push(`${hold} lot${hold===1?' is':'s are'} on hold for rework`); if(lockedB.length) bits.push(`${lockedB.length} batch${lockedB.length===1?' is':'es are'} waiting for BOM verification`); if(fail) bits.push(`${fail} lot${fail===1?' has':'s have'} failed`);
    text=(bits.length?bits.join(' and ')+'. ':'')+`${groups.length} batch${groups.length===1?'':'es'} in total.`; }
  const actions=isAdmin
    ? `<button class="btn btn-primary navGo" data-go="create" type="button">Create a batch</button><button class="btn btn-ghost navGo" data-go="batches" type="button">View batches</button><button class="btn btn-ghost navGo" data-go="bom" type="button">BOM management</button>`
    : (nextLot?`<button class="btn btn-primary startBtn" data-ri="${batches.indexOf(nextLot)}" type="button">Inspect next open lot</button>`:'')
      + (holdLot?`<button class="btn ${nextLot?'btn-ghost':'btn-primary'} heroHold" data-ri="${batches.indexOf(holdLot)}" type="button">Rework ${esc(holdLot.lotNumber)}</button>`:'')
      + (lockedB.length&&can('bomverify')?`<button class="btn ${nextLot?'btn-ghost':'btn-primary'} heroJump" data-batch="${esc(lockedB[0].name)}" type="button">Verify BOM for ${esc(lockedB[0].name)}</button>`:'')
      + `<button class="btn btn-ghost navGo" data-go="batches" type="button">View batches</button>`;
  const rows=groups.slice().reverse().map(g=>`<div class="lm-row"><div class="lm-name">${esc(g.name)}<span>${g.completed}/${g.totalLots}</span></div>
      <div class="lm-cells">${g.lots.map(l=>{const s=st(l);return `<button class="lm-cell c-${s} lmCell" data-ri="${batches.indexOf(l)}" type="button" aria-label="${esc(l.lotNumber)}: ${s==='lock'?'locked until BOM verification':s}" title="${esc(l.lotNumber)}"></button>`;}).join('')}</div></div>`).join('');
  return `<section class="hero" aria-labelledby="heroTitle">
    <div class="hero-copy">
      <p class="hero-date rv" style="--i:0">${esc(today)}, ${esc(user.name)}</p>
      <h1 class="hero-title rv" style="--i:1" id="heroTitle">${esc(title)}</h1>
      <p class="hero-text rv" style="--i:1">${esc(text)}</p>
      <div class="hero-actions rv" style="--i:2">${actions}</div>
    </div>
    <figure class="lotmap rv" style="--i:2" aria-labelledby="lotmapTitle">
      <div class="lotmap-h"><figcaption class="lotmap-t" id="lotmapTitle">Lot map</figcaption>
        <div class="lotmap-legend" aria-hidden="true"><span><i style="background:var(--lime);border-color:var(--lime-deep)"></i>Passed</span><span><i style="background:var(--color-danger-solid);border-color:var(--color-danger-solid)"></i>Failed</span><span><i style="background:var(--color-warn-bg);border:1.5px solid var(--color-warn)"></i>On hold</span><span><i style="border:1.5px solid var(--open)"></i>Open</span><span><i style="background:var(--sunk);border-style:dashed"></i>Locked</span></div></div>
      ${rows?`<div class="lm-rows">${rows}</div>`:`<div class="lm-empty">Lots will appear here as batches are created.</div>`}
    </figure>
  </section>`;
}

// ─── BOM MANAGEMENT ───────────────────────────────────
const BOM_TOOLS=[
  {group:'BOM tools', items:[
    {k:'parts',   t:'Parts', d:'Create a part or change its details. Changes are copied to every BOM that uses the part.'},
    {k:'ecn',     t:'ECN', d:'Generate an ECN to change a BOM, modify or undo an ECN, and print ECN reports.'},
    {k:'compare', t:'Compare BOMs', d:'Two models side by side, or every model: common parts, model-specific parts and QPS differences.'},
    {k:'view',    t:'BOMs and lots', d:'Download a model BOM, see the batches built on it and download their verified BOMs. Create a new model BOM.'}]}

function buildBomMgmt(){

const BX_NATIVE=['parts','ecn','compare','view'];
let bx={model:'',cache:{},f:{},ui:{},busy:''};
function bxReset(){ bx={model:'',cache:{},f:{},ui:{},busy:''}; }
async function bomApi(fn,args){
  const r=await api('bom',{fn,args:args||{}});
  if(!r||!r.ok) throw new Error((r&&r.error)||'Something went wrong. Please try again.');
  return r.data;
}
// cached read: returns {loading} | {data} | {error}; starts the request the first time
function bxGet(fn,args){
  const key=fn+'|'+JSON.stringify(args||{});
  if(!bx.cache[key]){
    bx.cache[key]={loading:true};
    bomApi(fn,args).then(d=>{ bx.cache[key]={data:d}; },e=>{ bx.cache[key]={error:e.message}; }).then(()=>{ if(page==='bom') render(); });
  }
  return bx.cache[key];
}
function bxClear(){ bx.cache={}; }
function bxWait(r,what){ return r.error?`<div class="card err" role="alert">${esc(r.error)}</div>`:`<div class="card text-muted">Loading ${esc(what||'')}…</div>`; }
async function bxRun(label,fn,args,okMsg){
  if(bx.busy) return null;
  bx.busy=label; render();
  try{ const d=await bomApi(fn,args); bxClear(); if(okMsg) toast(typeof okMsg==='function'?okMsg(d):okMsg); return d; }
  catch(e){ toast(e.message,'err'); return null; }
  finally{ bx.busy=''; render(); }
}

function bxCompare(){
  const t=bx.ui.cmpTab||'two';
  const tabs=`<div class="seg" role="tablist"><button class="seg-btn ${t==='two'?'on':''}" data-bx="cmpTab" data-t="two" role="tab" aria-selected="${t==='two'}">Two models</button><button class="seg-btn ${t==='all'?'on':''}" data-bx="cmpTab" data-t="all" role="tab" aria-selected="${t==='all'}">All models</button></div>`;
  const list=bxModels();
  if(!list) return `<div class="bx-bar">${tabs}</div>`+bxWait(bxGet('getControlData'),'models');
  if(t==='two'){
    const a=bx.f.cmpA||(list[0]||{}).model||'', b=bx.f.cmpB||(list[1]||list[0]||{}).model||'';
    const sel=(k,v)=>`<select class="field bx-sel" data-bxc="${k}" aria-label="Model">${list.map(m=>`<option value="${esc(m.model)}" ${m.model===v?'selected':''}>${esc(m.model)}</option>`).join('')}</select>`;
    let h=`<div class="bx-bar"><label class="bx-lbl">Model A ${sel('cmpA',a)}</label><label class="bx-lbl">Model B ${sel('cmpB',b)}</label><span style="flex:1"></span>${tabs}
      <button class="btn btn-ghost btn-sm" data-bx="dlCmpTwo" ${a&&b&&a!==b?'':'disabled'}>Download</button></div>`;
    if(!a||!b||a===b) return h+'<div class="card text-muted">Choose two different models.</div>';
    const r=bxGet('compareTwoModels',{a,b});
    if(!r.data) return h+bxWait(r,'comparison');
    const c=r.data, diff=c.common.filter(x=>!x.same).length;
    const tbl=(rows,hd,cell)=>`<div class="bx-tw"><table class="res-table"><thead><tr><th>Image</th><th>Part</th><th>Description</th>${hd}</tr></thead><tbody>${rows.map(x=>`<tr class="${x.same===false?'row-bad':''}"><td>${bxImg(x.img)}</td><td class="mono">${esc(x.part)}</td><td>${esc(x.desc)}</td>${cell(x)}</tr>`).join('')||'<tr><td colspan="6" class="text-muted">None</td></tr>'}</tbody></table></div>`;
    return h+`<div class="bx-stats"><div><b>${c.common.length}</b><span>common parts</span></div><div><b class="${diff?'text-fail':''}">${diff}</b><span>with different QPS</span></div><div><b>${c.onlyA.length}</b><span>only in ${esc(a)}</span></div><div><b>${c.onlyB.length}</b><span>only in ${esc(b)}</span></div></div>
      <h3 class="bx-h3">Common parts</h3>${tbl(c.common,`<th class="num">QPS ${esc(a)}</th><th class="num">QPS ${esc(b)}</th><th>Check</th>`,x=>`<td class="num mono">${esc(x.qa)}</td><td class="num mono">${esc(x.qb)}</td><td class="${x.same?'':'bad'}">${x.same?'Same':'Different'}</td>`)}
      <h3 class="bx-h3">Only in ${esc(a)}</h3>${tbl(c.onlyA,'<th class="num">QPS</th>',x=>`<td class="num mono">${esc(x.q)}</td>`)}
      <h3 class="bx-h3">Only in ${esc(b)}</h3>${tbl(c.onlyB,'<th class="num">QPS</th>',x=>`<td class="num mono">${esc(x.q)}</td>`)}`;
  }
  const r=bxGet('compareAll');
  const f=bx.ui.cmpFilter||'all';
  let h=`<div class="bx-bar"><input id="bxFilter" class="field bx-search" type="search" placeholder="Filter parts" aria-label="Filter parts"><span style="flex:1"></span>${tabs}
    <button class="btn btn-ghost btn-sm" data-bx="dlCmpAll" ${r.data?'':'disabled'}>Download</button></div>`;
  if(!r.data) return h+bxWait(r,'comparison');
  const d=r.data, n=d.models.length;
  const groups={all:d.rows,common:d.rows.filter(x=>x.used===n),diff:d.rows.filter(x=>x.check==='Different'),only:d.rows.filter(x=>x.used===1&&n>1)};
  const fl=(k,l)=>`<button class="seg-btn ${f===k?'on':''}" data-bx="cmpFilter" data-t="${k}">${l}<span>${groups[k].length}</span></button>`;
  return h+`<div class="seg" style="margin-bottom:12px">${fl('all','All parts')}${fl('common','Common to all')}${fl('diff','Different QPS')}${fl('only','Model-specific')}</div>
    <div class="bx-tw"><table class="res-table bx-tbl"><thead><tr><th>Part</th><th>Description</th>${d.models.map(m=>`<th class="num">${esc(m)}</th>`).join('')}<th>Used in</th><th>QPS check</th></tr></thead><tbody>
    ${groups[f].map(x=>`<tr class="bxRow" data-s="${esc((x.partNo+' '+x.desc).toLowerCase())}"><td class="mono">${esc(x.partNo)}</td><td>${esc(x.desc)}</td>${x.qps.map(q=>`<td class="num mono">${q==null?'<span class="text-muted">-</span>':esc(q)}</td>`).join('')}<td>${esc(x.status)}</td><td class="${x.check==='Different'?'bad':''}">${esc(x.check)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

async function bxAction2(a,el){
  if(a==='openBatch'){ view.batch=el.getAttribute('data-b'); view.status='all'; view.q=''; selLot=null; go('batches',()=>document.querySelector('.flow')?.scrollIntoView({behavior:'smooth',block:'center'})); return true; }
  if(a==='newModelToggle'){ bx.ui.newModel=!bx.ui.newModel; render(); return true; }
  if(a==='newModel'){
    const name=String(bxFval('nmName')).trim(), items=bxParse(bxFval('nmParts'),true);
    if(!name){ toast('Enter the model name.','err'); return true; }
    if(!items.length||items.some(x=>!(Number(x.qps)>0))){ toast('Give every part a QPS above 0.','err'); return true; }
    if(!confirm(`Create model BOM ${name} with ${items.length} part${items.length===1?'':'s'}? It is locked as Rev 0.`)) return true;
    const d=await bxRun('newmodel','createModel',{payload:{newModel:name,items:items.map(x=>({partNo:x.partNo,qps:Number(x.qps)}))}},d=>`${d.model} created with ${d.parts} parts.`);
    if(d){ bx.model=d.model; bx.ui.newModel=false; delete bx.f.nmName; delete bx.f.nmParts; await loadAll(true); render(); }
    return true;
  }
  if(a==='partNew'){ bx.ui.part={isNew:true}; Object.keys(bx.f).filter(k=>k.startsWith('pf_')).forEach(k=>delete bx.f[k]); render(); window.scrollTo(0,0); return true; }
  if(a==='partEdit'){ bx.ui.part={partNo:el.getAttribute('data-p')}; Object.keys(bx.f).filter(k=>k.startsWith('pf_')).forEach(k=>delete bx.f[k]); render(); window.scrollTo(0,0); return true; }
  if(a==='partCancel'){ bx.ui.part=null; render(); return true; }
  if(a==='partSave'){
    const ed=bx.ui.part, d=(bx.cache['listParts|{}']||{}).data; if(!ed||!d) return true;
    const row=ed.isNew?null:d.rows.find(x=>x.partNo===ed.partNo), values={};
    d.fields.forEach((f,i)=>{ const k='pf_'+f; if(bx.f[k]!==undefined) values[f]=String(bx.f[k]).trim(); else if(ed.isNew) values[f]=''; });
    if(row) Object.keys(values).forEach(f=>{ if(values[f]===row.v[d.fields.indexOf(f)]) delete values[f]; });
    const partNo=ed.isNew?String(bxFval('pf__no')).trim():ed.partNo;
    if(!partNo){ toast('Enter the part number.','err'); return true; }
    if(!ed.isNew&&!Object.keys(values).length){ toast('Nothing changed.'); bx.ui.part=null; render(); return true; }
    const r=await bxRun('part','savePart',{payload:{partNo,isNew:!!ed.isNew,values}},x=>x.created?`${x.partNo} created.`:`${x.partNo} saved${x.models?`, updated in ${x.models} BOM${x.models===1?'':'s'}`:''}.`);
    if(r){ bx.ui.part=null; render(); }
    return true;
  }
  if(a==='cmpTab'){ bx.ui.cmpTab=el.getAttribute('data-t'); render(); return true; }
  if(a==='cmpFilter'){ bx.ui.cmpFilter=el.getAttribute('data-t'); render(); return true; }
  if(a==='cmpA'||a==='cmpB'){ bx.f[a]=el.value; render(); return true; }
  if(a==='dlCmpTwo'){
    const list=bxModels()||[]; const A=bx.f.cmpA||(list[0]||{}).model, B=bx.f.cmpB||(list[1]||list[0]||{}).model;
    const c=(bx.cache['compareTwoModels|'+JSON.stringify({a:A,b:B})]||{}).data; if(!c) return true;
    const rows=[].concat(c.common.map(x=>['Common',x.part,x.desc,x.qa,x.qb,x.same?'Same':'Different']),c.onlyA.map(x=>['Only in '+A,x.part,x.desc,x.q,'','']),c.onlyB.map(x=>['Only in '+B,x.part,x.desc,'',x.q,'']));
    saveBlob(makeXlsx([{h:'Group',w:18},{h:'Part No',w:22,text:true},{h:'Description',w:60},{h:'QPS '+A,w:12},{h:'QPS '+B,w:12},{h:'QPS check',w:12}],rows,'Compare',[['BOM comparison',A+' vs '+B],['Downloaded',new Date().toLocaleString()],[]]),`BOM_compare_${bxFile(A)}_vs_${bxFile(B)}.xlsx`);
    return true;
  }
  if(a==='dlCmpAll'){
    const d=(bx.cache['compareAll|{}']||{}).data; if(!d) return true;
    saveBlob(makeXlsx([{h:'Part No',w:22,text:true},{h:'Description',w:60}].concat(d.models.map(m=>({h:m,w:12})),[{h:'Used in',w:20},{h:'QPS check',w:12}]),
      d.rows.map(x=>[x.partNo,x.desc].concat(x.qps.map(q=>q==null?'':q),[x.status,x.check])),'Compare',[['BOM comparison','All models'],['Downloaded',new Date().toLocaleString()],[]]),`BOM_compare_all_${bxToday()}.xlsx`);
    return true;
  }
  return false;
}

function bxParse(text,withQps){
  const out=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    line=line.trim(); if(!line) return;
    if(withQps){
      const t=line.split(/[\t,;]+|\s+/).filter(Boolean);
      out.push({partNo:t[0],qps:t.length>1?t[t.length-1]:''});
    } else line.split(/[\t,;\s]+/).filter(Boolean).forEach(p=>out.push(p));
  });
  return out;
}

async function bxAction(a,el){
  const m=el.getAttribute('data-m'), e=el.getAttribute('data-e'), rv=el.getAttribute('data-r');
  if(a==='model'){ bx.model=el.value; bx.ui={ecnTab:bx.ui.ecnTab,cmpTab:bx.ui.cmpTab,newModel:bx.ui.newModel}; bx.f.repEcn=''; render(); return; }
  if(a==='repEcn'){ bx.f.repEcn=el.value; render(); return; }
  if(a==='dlBom'){ dlModelBom(el.getAttribute('data-m')||bx.model); return; }
  if(a==='dlVer'){ dlVerifiedBom(el.getAttribute('data-v')); return; }
  if(await bxAction2(a,el)) return;
  if(a==='ecnTab'){ bx.ui.ecnTab=el.getAttribute('data-t'); render(); return; }
  if(a==='ecnRecv'){ bx.f.ecnRecv=el.getAttribute('data-v'); render(); return; }
  if(a==='ecnCheck'){
    const before=bxParse(bxFval('ecnOld'),false), after=bxParse(bxFval('ecnNew'),true);
    if(!before.length&&!after.length){ toast('Enter the parts to remove, the parts to add, or both.','err'); return; }
    const sig=bxEcnSig(), model=bx.model;
    bx.ui.ecnCheck={loading:true,model,sig}; render();
    try{
      const [bom,master]=await Promise.all([bomApi('getVerifyBom',{model}),after.length?bomApi('getMasterParts',{partNos:after.map(x=>x.partNo)}):Promise.resolve([])]);
      const inBom={}; bom.parts.forEach(p=>{ inBom[String(p.partNo).trim().toUpperCase()]=p; });
      bx.ui.ecnCheck={model,sig,
        before:before.map(p=>{ const f=inBom[p.toUpperCase()]; return {partNo:p,found:!!f,desc:f?f.desc:'',qps:f?f.qps:''}; }),
        after:after.map((p,i)=>{ const ms=master[i]||{}; const f=inBom[String(p.partNo).toUpperCase()]; return {partNo:p.partNo,qps:p.qps,found:!!ms.found,desc:ms.desc||'',inBom:f?f.qps:''}; })};
    }catch(x){ bx.ui.ecnCheck={model,sig,error:x.message}; }
    render(); return;
  }
  if(a==='ecnRun'){
    const c=bx.ui.ecnCheck; if(!c||c.sig!==bxEcnSig()){ toast('The parts changed. Check them again.','err'); return; }
    const reason=String(bxFval('ecnReason')).trim(), date=String(bxFval('ecnDate',new Date().toISOString().slice(0,10))).trim(), rec=bxFval('ecnRecv','no')==='yes';
    if(!reason){ toast('Enter the reason for the change.','err'); return; }
    if(rec&&!/^https:\/\//.test(String(bxFval('ecnDoc')).trim())){ toast('Paste the https link to the ECN document, or choose Not yet.','err'); return; }
    if(!confirm(`Generate an ECN for ${bx.model}?\n\nRemove or replace: ${c.before.map(x=>x.partNo).join(', ')||'none'}\nAdd: ${c.after.map(x=>x.partNo+' (QPS '+x.qps+')').join(', ')||'none'}\n\nThe BOM changes now and its revision goes up by one.`)) return;
    const d=await bxRun('ecn','runEcnChange',{payload:{model:bx.model,oldParts:c.before.map(x=>x.partNo),newParts:c.after.map(x=>({partNo:x.partNo,qps:Number(x.qps)})),
      reason,effectiveDate:date,received:rec,docUrl:rec?String(bxFval('ecnDoc')).trim():''}},d=>`${d.ecnNo} saved. ${d.model} is now at Rev ${d.rev}.`);
    if(d){ ['ecnOld','ecnNew','ecnReason','ecnDoc'].forEach(k=>delete bx.f[k]); bx.ui.ecnCheck=null; bx.ui.ecnTab='list'; render(); }
    return;
  }
  if(a==='ecnEdit'){ bx.ui.ecnEdit=e; ['edReason','edDate','edDoc'].forEach(k=>delete bx.f[k]); render(); return; }
  if(a==='ecnEditCancel'){ bx.ui.ecnEdit=null; render(); return; }
  if(a==='ecnSave'){
    const g=((bx.cache['getEcnReportData|'+JSON.stringify({model:bx.model,ecnNo:''})]||{}).data||[]).find(x=>x.ecnNo===e)||{};
    const doc=String(bxFval('edDoc',g.docUrl||'')).trim();
    if(doc&&!/^https:\/\//.test(doc)){ toast('The document link must start with https://','err'); return; }
    const d=await bxRun('ecnmeta','updateEcnMeta',{payload:{ecnNo:e,reason:String(bxFval('edReason',g.reason||'')).trim(),effectiveDate:String(bxFval('edDate',g.effectiveDate||'')).trim(),received:!!doc,docUrl:doc}},`${e} updated.`);
    if(d){ bx.ui.ecnEdit=null; render(); } return;
  }
  if(a==='ecnUndo'){
    if(!confirm(`Undo ${e}?\n\nIts part changes are reversed on the live BOM and the ECN is deleted. Later revisions are renumbered.`)) return;
    await bxRun('undo','deleteEcn',{ecnNo:e},d=>`${e} undone. The BOM is at Rev ${d.newRev}.`); return;
  }
  if(a==='ecnDropRec'){
    if(!confirm(`Delete only the record of ${e}?\n\nThe live BOM is NOT changed. Use this only for a duplicate entry whose change is already recorded by another ECN.`)) return;
    if(!confirm(`Are you sure? This cannot be undone.`)) return;
    await bxRun('droprec','deleteEcnRecordOnly',{ecnNo:e},`Record of ${e} deleted.`); return;
  }
  if(a==='ecnPrint'){ bx.f.repEcn=e; bx.ui.ecnTab='print'; render(); window.scrollTo(0,0); return; }
  if(a==='print'){ document.body.classList.add('bx-printing'); window.print(); setTimeout(()=>document.body.classList.remove('bx-printing'),500); return; }
}
