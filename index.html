<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMIO Quality Management - Projector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F2F4F1">
<style>
/* ── Tokens: inspection bench ─────────────────────────── */
:root{
  --paper:#F2F4F1;  --panel:#FFFFFF;  --sunk:#EAEDE8;
  --line:#DCE1DA;   --line-strong:#C3CAC0;
  --ink:#151A16;    --ink-2:#4B554D;  --ink-3:#768078;
  --lime:#82D11C;   --lime-deep:#4E8F0A;
  --pass:#2E7A12;   --pass-bg:#E8F5DB;  --pass-line:#B9DE90;
  --minor:#946000;  --minor-bg:#FFF1D2; --minor-line:#EBC984;
  --fail:#C23321;   --fail-bg:#FBE6E2;  --fail-line:#EFB4A9; --fail-row:#FDF5F3;
  --open:#24569E;   --open-bg:#E6EDF8;  --open-line:#BBCCE7;
  --ui:'Barlow',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --num:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --code:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);min-height:100vh;font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid var(--paper)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes slotIn{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
.fade{animation:fadeIn .2s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Layout ───────────────────────────────────────────── */
.page{min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.hdr-left{display:flex;align-items:center;gap:16px;min-width:0}
.logo{display:flex;align-items:center;padding-right:16px;border-right:1px solid var(--line)}
.logo img{height:26px;width:auto;display:block}
.hdr-title{font-family:var(--num);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.005em;line-height:1.1}
.hdr-sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.main{flex:1;max-width:1320px;width:100%;margin:0 auto;padding:24px}

/* ── Panels ───────────────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.card-title{font-family:var(--num);font-size:19px;font-weight:700;color:var(--ink);margin-bottom:16px;letter-spacing:-.005em}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:16px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}

/* ── Form ─────────────────────────────────────────────── */
.fg{margin-bottom:14px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field{width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-size:15px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;min-height:42px}
.field::placeholder{color:#A3ABA4}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(130,209,28,.35)}
.field.err-field{border-color:var(--fail);box-shadow:0 0 0 3px rgba(194,51,33,.12)}
select.field{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

/* ── Buttons ──────────────────────────────────────────── */
.btn{border:1px solid transparent;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;padding:10px 18px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s,color .15s}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#2C352E}
.btn-danger{background:var(--fail);color:#fff}
.btn-danger:hover{background:#A82917}
.btn-ghost{background:var(--panel);color:var(--ink);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn-full{width:100%}
.btn:disabled{background:var(--sunk);color:var(--ink-3);border-color:var(--line);cursor:not-allowed}

/* ── Status chips ─────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-open{background:var(--open-bg);color:var(--open);border-color:var(--open-line)}
.badge-closed{background:var(--sunk);color:var(--ink-2);border-color:var(--line)}
.badge-pass{background:var(--pass-bg);color:var(--pass);border-color:var(--pass-line)}
.badge-fail{background:var(--fail-bg);color:var(--fail);border-color:var(--fail-line)}

/* ── Stats ────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--panel);padding:16px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat-label{font-size:13px;font-weight:600;color:var(--ink-2)}
.stat-val{font-family:var(--num);font-size:34px;font-weight:700;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat-sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}

/* ── Batches ──────────────────────────────────────────── */
.batch-group{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.batch-hdr{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.batch-name{font-family:var(--num);font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.batch-meta{font-size:13px;color:var(--ink-3);margin-top:4px;line-height:1.7}
.batch-meta b{color:var(--ink);font-weight:600}
.lot-strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px;max-width:640px}
.lot-cell{width:14px;height:14px;border-radius:3px;background:var(--sunk);border:1px solid var(--line-strong)}
.lot-cell.c-pass{background:var(--lime);border-color:var(--lime-deep)}
.lot-cell.c-fail{background:var(--fail);border-color:#8E2214}
.lot-cell.c-open{background:var(--panel);border-color:var(--open)}
.lot-row{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.lot-row:last-child{border-bottom:none}
.lot-row:hover{background:#FAFBF9}
.lot-name{font-size:15px;font-weight:600;color:var(--ink)}
.lot-meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.lot-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.progress-bar{background:var(--sunk);border-radius:99px;height:8px;overflow:hidden;min-width:80px}
.progress-fill{background:var(--lime);height:100%;transition:width .4s;border-radius:99px}

/* ── Lot browser ─────────────────────────────────────── */
.lot-toolbar{display:grid;grid-template-columns:minmax(220px,1.3fr) auto minmax(180px,1fr);gap:16px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px}
.lot-toolbar .lbl{margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg-btn{border:none;border-right:1px solid var(--line);background:none;padding:0 14px;min-height:42px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg-btn:last-child{border-right:none}
.seg-btn span{font-family:var(--num);color:var(--ink-3);margin-left:4px}
.seg-btn.on{background:var(--ink);color:#fff}
.seg-btn.on span{color:var(--lime)}
.lot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;padding:16px 20px}
.lot-tile{height:60px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:var(--ink-2);padding:0}
.lot-tile:hover{border-color:var(--ink)}
.lt-no{font-family:var(--num);font-size:21px;font-weight:700;line-height:1;color:var(--ink)}
.lt-st{font-size:11.5px;font-weight:600}
.lot-tile.t-pass{background:var(--pass-bg);border-color:var(--pass-line);color:var(--pass)}
.lot-tile.t-fail{background:var(--fail);border-color:var(--fail);color:#fff}
.lot-tile.t-fail .lt-no{color:#fff}
.lot-tile.t-open{border:1.5px dashed var(--open);color:var(--open)}
.lot-tile.t-closed{background:var(--sunk);color:var(--ink-3)}
.lot-tile.t-draft{border:1.5px solid var(--open);background:var(--open-bg);color:var(--open)}
.lot-tile.sel{outline:3px solid var(--ink);outline-offset:2px}
.lot-empty{padding:18px 20px;color:var(--ink-3);font-size:14px}
.lot-detail{margin:0 20px 20px;border:1px solid var(--line-strong);border-radius:12px;background:var(--paper);overflow:hidden;animation:fadeIn .18s ease both}
.ld-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:16px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.ld-title{font-family:var(--num);font-size:22px;font-weight:700;line-height:1.15}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.facts div{background:var(--panel);padding:10px 18px;font-size:13px;color:var(--ink-3)}
.facts b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-top:1px}
.res-wrap{padding:14px 18px 18px}
.res-table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.res-table th{background:var(--sunk);text-align:left;padding:8px 10px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.res-table td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.res-table td.bad{color:var(--fail);font-weight:700}
.res-table tr.row-bad td{background:var(--fail-row)}
.found-box{border:1px solid var(--minor-line);background:var(--minor-bg);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.found-box table td{background:transparent}

.ok-note{background:var(--pass-bg);border:1px solid var(--pass-line);color:var(--pass);border-radius:10px;padding:12px 16px;font-weight:600}
.res-table tr.row-muted td{color:var(--ink-3);background:var(--paper)}

/* ── Admin navigation + BOM management ─────────────────── */
.topnav{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.navBtn{border:none;background:none;padding:0 14px;min-height:36px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
.navBtn:hover{color:var(--ink)}
.navBtn.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(21,26,22,.12)}
.tool-group{margin-bottom:22px}
.tool-group-h{font-family:var(--num);font-size:18px;font-weight:700;margin:0 0 10px}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tool-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--lime);border-radius:12px;padding:16px 18px;cursor:pointer;color:var(--ink);font:inherit;transition:border-color .15s}
.tool-card:hover{border-color:var(--ink);border-left-color:var(--lime)}
.tc-t{font-weight:700;font-size:15.5px}
.tc-d{font-size:13.5px;color:var(--ink-3);line-height:1.45}
.tool-page{height:100vh;overflow:hidden}
.tool-bar{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
.tool-title{font-family:var(--num);font-size:18px;font-weight:700}
.tool-frame{flex:1;width:100%;border:0;background:#f6f8fb;min-height:0}
@media (max-width:760px){ .topnav{order:3;width:100%} .navBtn{flex:1} .tool-bar{padding:8px 12px;flex-wrap:wrap} }

/* ── Batch flow ──────────────────────────────────────── */
.flow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-bottom:1px solid var(--line);background:var(--paper)}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px 20px;border-right:1px solid var(--line);position:relative}
.step:last-child{border-right:none}
.step-n{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:700;font-size:15px;border:2px solid var(--line-strong);color:var(--ink-3);background:var(--panel)}
.step-t{font-weight:700;font-size:14.5px;color:var(--ink)}
.step-s{font-size:13px;color:var(--ink-3);margin-top:1px;line-height:1.4}
.step-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.step.s-pass .step-n{background:var(--lime);border-color:var(--lime-deep);color:var(--ink)}
.step.s-pass .step-s{color:var(--pass)}
.step.s-fail .step-n{background:var(--fail);border-color:var(--fail);color:#fff}
.step.s-fail .step-s{color:var(--fail)}
.step.s-wait .step-n{border-color:var(--open);color:var(--open);background:var(--open-bg)}
.step.s-wait .step-s{color:var(--open)}
.step.s-na .step-n,.step.s-soon .step-n{border-style:dashed}
.step.s-lock{opacity:.75}
.lot-tile.t-lock{border:1.5px dashed var(--line-strong);background:var(--sunk);color:var(--ink-3)}
.bom-result{margin:0 20px 18px;border:1px solid var(--line-strong);border-radius:12px;background:var(--panel);overflow:hidden;animation:fadeIn .18s ease both}

/* ── BOM verification screen ─────────────────────────── */
.bom-meter{height:10px;background:#2E362F;border-radius:99px;overflow:hidden;display:flex;margin-top:12px;min-width:260px}
.bom-meter i{display:block;height:100%}
.bom-list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bom-row{display:grid;grid-template-columns:72px minmax(0,1fr) 90px auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.bom-row:last-child{border-bottom:none}
.bom-row.r-match{background:#FAFDF6}
.bom-row.r-diff{background:var(--fail-row)}
.bom-img{width:72px;height:72px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);object-fit:contain;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3);text-align:center;overflow:hidden}
.bom-img img{width:100%;height:100%;object-fit:contain;background:#fff}
.bom-pn{font-family:var(--code);font-size:13.5px;color:var(--ink);font-weight:500}
.bom-desc{font-size:14px;color:var(--ink-2);margin-top:2px;line-height:1.35}
.bom-meta{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.bom-qps{text-align:center}
.bom-qps b{display:block;font-family:var(--num);font-size:24px;line-height:1;color:var(--ink)}
.bom-qps span{font-size:12px;color:var(--ink-3)}
.bom-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bom-act .btn.on-match{background:var(--lime);border-color:var(--lime-deep);color:var(--ink)}
.bom-act .btn.on-diff{background:var(--fail);border-color:var(--fail);color:#fff}
.bom-diff{grid-column:2 / -1;display:grid;grid-template-columns:1fr 120px 2fr;gap:8px}
@media (max-width:760px){
  .flow{grid-template-columns:1fr}
  .step{border-right:none;border-bottom:1px solid var(--line)}
  .bom-row{grid-template-columns:56px minmax(0,1fr)}
  .bom-img{width:56px;height:56px}
  .bom-qps{grid-column:1;text-align:left}
  .bom-act{grid-column:2;justify-content:flex-start}
  .bom-diff{grid-column:1 / -1;grid-template-columns:1fr}
}

/* ── Inspection: sample tray (signature) ──────────────── */
.bench{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:16px}
.bench-title{font-family:var(--num);font-size:24px;font-weight:700;letter-spacing:-.01em}
.bench-sub{font-size:13px;color:#AEB8AF;margin-top:3px;line-height:1.6}
.tray{display:grid;grid-template-columns:repeat(var(--n,13),34px);gap:5px;padding:8px;background:#232A24;border-radius:10px;border:1px solid #39423A}
.slot{height:40px;border-radius:5px;background:#2E362F;border:1px dashed #56605A;color:#8D978F;font-family:var(--num);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.slot:hover{border-color:#fff;color:#fff}
.slot.s-pass{background:var(--lime);border:1px solid var(--lime);color:var(--ink);animation:slotIn .25s ease}
.slot.s-minor{background:#F2B33D;border:1px solid #F2B33D;color:var(--ink);animation:slotIn .25s ease}
.slot.s-major{background:#E2533F;border:1px solid #E2533F;color:#fff;animation:slotIn .25s ease}
.verdict{display:flex;gap:18px;align-items:flex-end;margin-top:10px;font-size:13px;color:#AEB8AF}
.verdict b{font-family:var(--num);font-size:20px;color:#fff;display:block;line-height:1}
.verdict .v-ok{color:var(--lime)}.verdict .v-bad{color:#FF8A78}.verdict .v-warn{color:#F2B33D}

/* ── Inspection rows ─────────────────────────────────── */
.samp-table{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.samp-row{border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;scroll-margin-top:90px}
.samp-row:last-child{border-bottom:none}
.samp-row.is-fail{background:var(--fail-row)}
.samp-row.flash{box-shadow:inset 4px 0 0 var(--lime)}
.samp-num-badge{width:30px;height:30px;border-radius:6px;background:var(--sunk);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:15px;font-weight:700;flex-shrink:0}
.samp-serial-wrap{width:220px;flex-shrink:0}
.samp-serial-inp{width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);outline:none;font-family:var(--code);letter-spacing:.02em;min-height:38px}
.samp-serial-inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(130,209,28,.35)}
.samp-serial-inp.err-field{border-color:var(--fail)}
.samp-toggles{display:flex;gap:5px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.mini-toggle{padding:0 10px;height:36px;border-radius:7px;border:1px solid;font-size:13px;font-weight:600;cursor:pointer;min-width:52px;text-align:center;transition:background .12s,color .12s}
.mini-toggle-pass{background:var(--panel);color:var(--ink-2);border-color:var(--line-strong)}
.mini-toggle-pass:hover{border-color:var(--ink);color:var(--ink)}
.mini-toggle-fail{background:var(--fail);color:#fff;border-color:var(--fail)}
.samp-bd-toggle{padding:0 12px;height:36px;border-radius:7px;border:1px dashed var(--line-strong);background:var(--panel);color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.samp-bd-toggle.bd-active-ok{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass-line)}
.samp-bd-toggle.bd-active-fail{background:var(--fail);color:#fff;border:1px solid var(--fail)}
.samp-spacer{flex:1}

<body>
<div id="toast"></div>
<div id="app"></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let API = localStorage.getItem('oba_api')||'';
let user = null;          // {username,role,name}
let batches = [];         // all batch/lot rows from backend
let activeLot = null;     // lot object being inspected
let samples = [];         // array of sample state objects
let expandedSample = null; // index of sample with expanded BD/remark panel open
let toastTimer = null;

let models = [];            // loaded from backend "Models" sheet — managed by admin
let activeSpec = null;      // Black Dot spec of the model being inspected
let editingModel = null;    // name of model being edited in admin panel
let lotRemarksVal = '';     // lot remarks kept across re-renders
let modelUsage = {};        // model name -> usage found in Batches/Master
let modelSuggestions = [];  // models found in existing data but not yet defined
let modelPrefill = null;    // values copied from a suggestion into the add form
let view = {batch:'', status:'all', q:''};  // dashboard lot filters
let selLot = null;          // "batch||lot" of the lot opened in the detail panel
let lotUnits = {};          // cache of sample results per lot
let dataScan = null;        // duplicate-serial check result (admin)
let recSearch = {q:'', loading:false, res:null};  // record lookup (admin)
let bomModels = [];         // models in the BOM sheet (BOM_CONTROL)
let activeBom = null;       // BOM verification in progress
let bomResult = null;       // {batch, loading, data} verification result being viewed
let session = null;         // {token, expiresAt, partdbUrl, bomSheetUrl}
let page = 'insp';          // 'insp' | 'bom' (admin: BOM management)
let bomTool = null;         // open BOM management tool key
const LOT_SIZE   = 90;
const SAMPLE_N   = 13;

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function mmyy(s){ if(!s)return''; const[y,m]=s.split('-'); return m+y.slice(2); }
function mmyyDisp(c){ if(!c||c.length!==4)return'-'; return c.slice(0,2)+'/20'+c.slice(2); }
function mmyyInp(c){ if(!c||c.length!==4)return''; return'20'+c.slice(2)+'-'+c.slice(0,2); }

// ═══════════════════════════════════════════════════════════
// DRAFT AUTO-SAVE (so in-progress inspections survive refresh/close)
// ═══════════════════════════════════════════════════════════
function draftKey(lot){
  return 'oba_draft_'+(user?user.username:'anon')+'_'+lot.batchName+'_'+lot.lotNumber;
}
function saveDraft(){
  if(!activeLot) return;
  // Stamp each sample with its completion time if not already stamped
  samples.forEach(s=>{
    if(!s.inspectedAt && sampleResult(s)!=='PENDING'){
      s.inspectedAt = new Date().toISOString();
    }
  });
  try{
    localStorage.setItem(draftKey(activeLot), JSON.stringify({
      lot:activeLot, samples:samples,
      lotRemarks:lotRemarksVal,
      savedAt:new Date().toISOString()
    }));
  }catch(e){ /* storage full or blocked - ignore */ }
}
function loadDraft(lot){
  try{
    const raw=localStorage.getItem(draftKey(lot));
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearDraft(lot){
  try{ localStorage.removeItem(draftKey(lot)); }catch(e){}
}
function listDraftsForUser(){
  const out=[];
  const prefix='oba_draft_'+(user?user.username:'anon')+'_';
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.startsWith(prefix)){
      try{
        const d=JSON.parse(localStorage.getItem(k));
        out.push({key:k, ...d});
      }catch(e){}
    }
  }
  return out;
}

function toast(msg,type='ok'){
  clearTimeout(toastTimer);
  const el=document.getElementById('toast');
  el.className=`toast toast-${type}`;
  el.textContent=msg;
  el.style.display='block';
  toastTimer=setTimeout(()=>{ el.style.display='none'; },3500);
}

function saveSession(){ try{ if(user&&session) localStorage.setItem('oba_session',JSON.stringify({user,session})); else localStorage.removeItem('oba_session'); }catch(e){} }
function restoreSession(){
  try{
    const s=JSON.parse(localStorage.getItem('oba_session')||'null');
    if(s&&s.session&&new Date(s.session.expiresAt)>new Date()){ user=s.user; session=s.session; return true; }
    localStorage.removeItem('oba_session');
  }catch(e){}
  return false;
}
function resetApp(){ activeBom=null; bomResult=null; dataScan=null; recSearch={q:'',loading:false,res:null}; view={batch:'',status:'all',q:''}; selLot=null; lotUnits={}; user=null; session=null; page='insp'; bomTool=null; batches=[]; activeLot=null; samples=[]; expandedSample=null; saveSession(); }
let expiredShown=false;
async function api(action,data={}){
  data.action=action;
  if(session&&session.token&&action!=='login') data.token=session.token;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
    const text=await r.text();
    // If response starts with < it is an HTML error page (script not deployed / URL wrong)
    if(text.trim().startsWith('<')){
      console.error('Apps Script returned HTML instead of JSON. URL may be wrong or script needs redeployment.');
      return {ok:false, error:'Backend error: The Apps Script URL is invalid or the script needs to be redeployed. Please check the URL and redeploy as a New Version.'};
    }
    const res=JSON.parse(text);
    if(res&&res.auth&&user){
      // session ended: keep any open inspection as a draft, then back to login
      if(activeLot) saveDraft();
      if(activeBom) saveBomDraft();
      resetApp(); render();
      if(!expiredShown){ expiredShown=true; toast('Your session has expired. Please log in again.','err'); setTimeout(()=>{expiredShown=false;},4000); }
    }
    return res;
  }catch(err){
    return {ok:false, error:'Network error: '+err.message+'. Check your internet connection and Apps Script URL.'};
  }
}

// ═══════════════════════════════════════════════════════════
// MODELS (all model data comes from backend — nothing hardcoded)
// ═══════════════════════════════════════════════════════════
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getModel(name){ return models.find(m=>m.name===name)||null; }
function normModel(m){
  return {
    name:String(m.name||'').trim(),
    code:String(m.code||'').trim().padStart(4,'0'),
    maxD:Number(m.maxD), smallD:Number(m.smallD),
    maxN:Number(m.maxN), minDS:Number(m.minDS),
    nA:Number(m.nA), nB:Number(m.nB), nAB:Number(m.nAB),
    lumioModel:String(m.lumioModel||'').trim()
  };
}
function modelLabel(name){
  const m=getModel(name);
  return m&&m.lumioModel ? `${m.lumioModel} (${m.name})` : (name||'-');
}
function specText(m){
  if(!m) return 'No spec';
  return `Not visible @2m → OK | D>${m.maxD}mm → FAIL | N>${m.maxN} → FAIL | DS<${m.minDS}mm (when N>1) → FAIL | D≤${m.smallD}mm → OK | ${m.smallD}<D≤${m.maxD}mm → Area A N≤${m.nA} / Area B N≤${m.nB} / A+B N≤${m.nAB}`;
}
function modelOptions(selected){
  return models.map(m=>`<option value="${esc(m.name)}" ${m.name===selected?'selected':''}>${esc(m.lumioModel||m.name)}, ${esc(m.name)}, code ${esc(m.code)}</option>`).join('');
}
async function loadModels(){
  const r=await api('getModels');
  if(r.ok){
    models=(r.models||[]).map(normModel).filter(m=>m.name);
    modelUsage=r.usage||{};
    modelSuggestions=r.suggestions||[];
  }
  else console.warn('getModels failed:',r.error);
}
async function loadBomList(){
  const r=await api('getBomList');
  bomModels=r.ok?(r.models||[]):[];
}
async function loadAll(){ await Promise.all([loadBatches(),loadModels(),loadBomList()]); }
function bomFor(modelName){ const m=getModel(modelName); return m&&m.lumioModel?bomModels.find(b=>b.model===m.lumioModel)||null:null; }
function batchBom(batchName){ const l=batches.find(b=>b.batchName===batchName); return l?(l.bomStatus||''):''; }
function samplingLocked(batchName){ const s=batchBom(batchName); return s==='Pending'||s==='Failed'; }

async function loadBatches(){
  let r=await api('getBatches');
  if(!r.ok && (r.error||'').toLowerCase().includes('unknown')){
    r=await api('getKits');
    if(r.ok && r.kits){
      // normalize kits to batch format
      r.batches=r.kits.map(k=>({
        batchName:k.kitName||k.batchName||'',
        lotNumber:k.lotNumber||'',
        lotSize:Number(k.lotSize)||90,
        sampleSize:Number(k.sampleSize)||13,
        bdMax:Number(k.bdMax)||0,
        status:k.status||'Open',
        createdBy:k.createdBy||'',
        createdAt:k.createdAt||'',
        result:k.result||'',
        batchQty:Number(k.kitTotalQty)||Number(k.batchQty)||0,
        totalLots:Number(k.totalLots)||0,
        model:k.model||'',
        prodMonthCode:k.prodMonthCode||'',
      prodMonthCode2:k.prodMonthCode2||'',
        fgPassQty:Number(k.fgPassQty)||0
      }));
    }
  }
  if(r.ok) batches=r.batches||[];
}

// ═══════════════════════════════════════════════════════════
// GROUPING
// ═══════════════════════════════════════════════════════════
function groupBatches(){
  const map={},order=[];
  batches.forEach(b=>{
    if(!map[b.batchName]){map[b.batchName]=[];order.push(b.batchName);}
    map[b.batchName].push(b);
  });
  return order.map(name=>{
    const lots=map[name];
    lots.sort((a,b)=>{
      const na=parseInt(String(a.lotNumber).replace(/\D+/g,''))||0;
      const nb=parseInt(String(b.lotNumber).replace(/\D+/g,''))||0;
      return na-nb;
    });
    const batchQty   = Number(lots[0].batchQty)||0;
    const totalLots  = Number(lots[0].totalLots)||lots.length;
    const completed  = lots.filter(l=>l.status==='Closed').length;
    const pending    = lots.filter(l=>l.status==='Open').length;
    const passLots   = lots.filter(l=>l.result==='PASS').length;
    const failLots   = lots.filter(l=>l.result==='FAIL').length;
    const fgTotal    = lots.reduce((s,l)=>s+Number(l.fgPassQty||0),0);
    return{name,lots,batchQty,totalLots,completed,pending,passLots,failLots,fgTotal,
           model:lots[0].model||'',prodMonthCode:lots[0].prodMonthCode||'',prodMonthCode2:lots[0].prodMonthCode2||'',
           bomStatus:lots[0].bomStatus||'',bomVerId:lots[0].bomVerId||''};
  });
}

// ═══════════════════════════════════════════════════════════
// SERIAL VALIDATION
// ═══════════════════════════════════════════════════════════
function validateSerial(serial,model,prodMonthCode,batchUsed,prodMonthCode2){
  const s=(serial||'').trim().toUpperCase();
  if(!/^\d{15}$/.test(s)) return 'Must be exactly 15 digits';
  // Model code: first 4 digits
  const md=getModel(model);
  if(!md) return `Model "${model}" not found in model list — ask admin to add it`;
  if(s.substring(0,4)!==md.code){
    return `Model code must be ${md.code} for ${model} — got ${s.substring(0,4)}`;
  }
  // Month codes: digits 5-8 (MMYY)
  let pmc=String(prodMonthCode||'').trim(); if(pmc.length===3) pmc='0'+pmc;
  let pmc2=String(prodMonthCode2||'').trim(); if(pmc2.length===3) pmc2='0'+pmc2;
  const serialMonth=s.substring(4,8);
  const validMonths=[pmc,pmc2].filter(Boolean);
  if(validMonths.length>0 && !validMonths.includes(serialMonth)){
    const labels=validMonths.map(m=>m+' ('+mmyyDisp(m)+')').join(' or ');
    return `Month code must be ${labels} — got ${serialMonth}`;
  }
  const mm=parseInt(s.substring(4,6));
  if(isNaN(mm)||mm<1||mm>12) return 'Month digits invalid (01-12)';
  // Last 7 digits: numeric serial
  if(!/^\d{7}$/.test(s.substring(8))) return 'Last 7 chars must be numeric';
  if((batchUsed||[]).includes(s)) return 'Duplicate serial in this batch';
  return '';
}

// ═══════════════════════════════════════════════════════════
// BLACK DOT LOGIC — limits come from the model's spec (admin-defined)
// ═══════════════════════════════════════════════════════════
function evalBD(s,spec){
  spec=spec||activeSpec;
  if(s.bdNoDot) return {ok:true,reason:'No Black Dot — Acceptable'};
  if(!s.bdVisible) return {ok:true,reason:'Not visible at 2m — Acceptable (any quantity)'};
  if(!spec) return {ok:false,reason:'No Black Dot spec for this model — ask admin'};
  const D=parseFloat(s.bdD), N=parseInt(s.bdN), DS=parseFloat(s.bdDS);
  // Incomplete entry → sample stays PENDING (not a false FAIL)
  if(!(D>0))  return {ok:false,incomplete:true,reason:'Enter D (mm)'};
  if(!(N>=1)) return {ok:false,incomplete:true,reason:'Enter N (spots)'};
  if(N>1 && !(DS>=0) ) return {ok:false,incomplete:true,reason:'Enter DS (mm) — needed when N>1'};
  if(D>spec.maxD) return {ok:false,reason:`D=${D}mm > ${spec.maxD}mm — FAIL`};
  if(N>spec.maxN) return {ok:false,reason:`N=${N} > ${spec.maxN} — FAIL`};
  if(N>1 && DS<spec.minDS) return {ok:false,reason:`DS=${DS}mm < ${spec.minDS}mm — FAIL`};
  const dsTxt=N>1?`, DS=${DS}mm`:'';
  if(D<=spec.smallD) return {ok:true,reason:`D=${D}mm ≤ ${spec.smallD}mm, N=${N}${dsTxt} — OK`};
  // smallD < D <= maxD : area rules
  const area=s.bdArea||'A';
  const lim=area==='A'?spec.nA:area==='B'?spec.nB:spec.nAB;
  if(N<=lim) return {ok:true,reason:`D=${D}mm in Area ${area}, N=${N}≤${lim}${dsTxt} — OK`};
  return {ok:false,reason:`Area ${area}: N=${N}>${lim} — FAIL`};
}

// ═══════════════════════════════════════════════════════════
// SAMPLE RESULT
// ═══════════════════════════════════════════════════════════
function sampleResult(s){
  if(!s.serial||s.serialError) return 'PENDING';
  const bd=evalBD(s);
  if(bd.incomplete) return 'PENDING';
  const major=!s.generalPass||!s.funcPass||!s.screenPass||!bd.ok;
  const minor=!s.aestheticPass;
  if(major) return 'FAIL-MAJOR';
  if(minor) return 'FAIL-MINOR';
  return 'PASS';
}

function freshSamples(n){
  return Array.from({length:n},(_,i)=>({
    num:i+1,serial:'',serialError:'',
    aestheticPass:true,generalPass:true,funcPass:true,screenPass:true,
    bdNoDot:true,bdVisible:false,bdD:'',bdN:'',bdDS:'',bdArea:'A',
    remark:''
  }));
}

function tallyLot(){
  let minor=0,major=0;
  samples.forEach(s=>{
    const r=sampleResult(s);
    if(r==='FAIL-MINOR') minor++;
    if(r==='FAIL-MAJOR') major++;
  });
  return{minor,major,passed:minor<=1&&major===0,filled:samples.filter(s=>sampleResult(s)!=='PENDING').length};
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function render(){ document.getElementById('app').innerHTML=buildPage(); bindEvents(); }

function buildPage(){
  if(!API)          return buildSetup();
  if(!user)         return buildLogin();
  if(activeLot)     return buildInspection();
  if(activeBom)     return buildBomVerify();
  if(page==='bom' && user.role==='admin') return buildBomMgmt();
  return buildDashboard();
}

// ─── SETUP ────────────────────────────────────────────────
function buildSetup(){
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">

  <div class="main">

    <div class="stat"><div class="stat-label">FG Released</div><div class="stat-val text-pass">${fgAll}</div><div class="stat-sub">Certified units</div></div>
  </div>

  <!-- INFO BANNER -->
  <div class="info-banner">
    <b>Acceptance:</b> each lot of 90 units is judged on 13 samples. One aesthetic (minor) defect is allowed. Any general, functional, screen or black dot (major) defect fails the lot.<br>
    ${models.length?models.map(m=>`<b>Black dot, ${esc(m.lumioModel||m.name)}:</b> ${esc(specText(m))}`).join('<br>'):'<b>Black dot:</b> no models yet. '+(isAdmin?'Add one in Models and black dot spec below.':'Ask an admin to add one.')}
  </div>`;

  // ADMIN PANELS
  if(isAdmin){
    html+=`<div class="grid-3">
    <!-- CREATE BATCH -->
    <div class="card">
      <div class="card-title">Create a batch</div>
      <div class="fg"><label class="lbl">Batch Name</label><input id="bName" class="field" type="text" placeholder="e.g. MODEL-JUN-2026"></div>
      <div class="fg"><label class="lbl">Batch Quantity (total units)</label><input id="bQty" class="field" type="number" placeholder="e.g. 2000" min="1"></div>
      <div class="fg"><label class="lbl">Model</label>
        ${models.length?`<select id="bModel" class="field">${modelOptions('')}</select>`:`<div class="err">No models yet. Add one in Models and black dot spec first.</div><input type="hidden" id="bModel" value="">`}</div>
      <div class="fg"><label class="lbl">Production Month 1</label><input id="bMonth" class="field" type="month"></div>

      <button id="btnSummary" class="btn btn-ghost btn-full" style="margin-top:8px">📊 View Summary</button>
    </div>
    </div>`;

    html+=buildDataPanel();

  // BATCH + LOT BROWSER
  const stOf=l=>l.result==='PASS'?'pass':l.result==='FAIL'?'fail':l.status==='Open'?'open':'closed';
  const lotNo=l=>{const m=String(l.lotNumber).match(/(\d+)\s*$/);return m?m[1]:l.lotNumber;};
  const inBatch=l=>!view.batch||l.batchName===view.batch;
  const matches=l=>(view.status==='all'||stOf(l)===view.status)&&(!view.q||String(l.lotNumber).toLowerCase().includes(view.q.trim().toLowerCase()));
  const cnt=k=>batches.filter(l=>inBatch(l)&&(k==='all'||stOf(l)===k)).length;

      <div><span class="lbl">Show lots</span><div class="seg" role="group" aria-label="Filter lots by status">${[['all','All'],['open','Open'],['pass','Passed'],['fail','Failed']].map(([k,l])=>`<button class="seg-btn fStatus ${view.status===k?'on':''}" data-k="${k}" aria-pressed="${view.status===k}">${l}<span>${cnt(k)}</span></button>`).join('')}</div></div>
      <div><label class="lbl" for="fSearch">Find a lot</label><input id="fSearch" class="field" type="search" value="${esc(view.q)}" placeholder="Lot number, e.g. 12"></div>
    </div>`;
    groups.filter(g=>!view.batch||g.name===view.batch).forEach(g=>{
      const pct2=g.totalLots?Math.round(g.completed/g.totalLots*100):0;
      const lots=g.lots.filter(matches);
      const locked=g.bomStatus==='Pending'||g.bomStatus==='Failed';
      const nextOpen=(!isAdmin&&!locked)?g.lots.find(l=>l.status==='Open'):null;
      html+=`<div class="batch-group fade">
      <div class="batch-hdr">
        <div>
          <div class="batch-name">${esc(g.name)}</div>
          <div class="batch-meta">
            ${esc(modelLabel(g.model))}, production <b>${mmyyDisp(g.prodMonthCode)}${g.prodMonthCode2?' / '+mmyyDisp(g.prodMonthCode2):''}</b>, <b>${g.batchQty||'?'}</b> units in <b>${g.totalLots}</b> lots<br>
            <b>${g.completed}</b> inspected, <b>${g.pending}</b> open,
            <b class="text-pass">${g.passLots}</b> passed, <b class="text-fail">${g.failLots}</b> failed, <b class="text-pass">${g.fgTotal}</b> units released
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div>
            <div class="progress-bar" style="width:140px"><div class="progress-fill" style="width:${pct2}%"></div></div>
            <div class="text-muted" style="text-align:right;margin-top:4px">${pct2}% inspected</div>
          </div>
          ${nextOpen?`<button class="btn btn-primary btn-sm startBtn" data-ri="${batches.indexOf(nextOpen)}">Inspect next open lot (${esc(lotNo(nextOpen))})</button>`:''}
          ${isAdmin?`<button class="btn btn-ghost btn-sm delBatchBtn" data-name="${esc(g.name)}" style="color:var(--fail)">Delete batch</button>`:''}
        </div>
      </div>
      ${buildFlow(g,isAdmin)}`;
      if(!lots.length){
        html+=`<div class="lot-empty">No lots in this batch match the filter.</div>`;
      } else {
        html+=`<div class="lot-grid" role="list">${lots.map(l=>{
          const ri=batches.indexOf(l), st=stOf(l), key=l.batchName+'||'+l.lotNumber;
          const draft=(!isAdmin&&l.status==='Open')?loadDraft(l):null;
          const cls=draft?'t-draft':(st==='open'&&locked)?'t-lock':'t-'+st;
          const lk=st==='open'&&locked;
          const word=draft?'Draft':lk?'Locked':st==='pass'?'Pass':st==='fail'?'Fail':st==='open'?'Open':'Closed';
          return `<button class="lot-tile ${cls} lotTile ${selLot===key?'sel':''}" data-ri="${ri}" role="listitem" aria-pressed="${selLot===key}" title="${esc(l.lotNumber)}: ${word}"><span class="lt-no">${esc(lotNo(l))}</span><span class="lt-st">${word}</span></button>`;
        }).join('')}</div>`;
      }
      const sel=g.lots.find(l=>selLot===l.batchName+'||'+l.lotNumber);
      if(sel) html+=buildLotDetail(sel,isAdmin);
      html+=`</div>`;
    });
  }
  html+=`</div></div>
  <footer class="pg-footer">LUMIO Quality Management - Projector</footer>
  </div>`;
  return html;
}

// ─── BATCH FLOW STRIP ─────────────────────────────────────
function buildFlow(g,isAdmin){
  const s=g.bomStatus, bm=bomFor(g.model);
  let cls='s-na', txt='', act='';
  const verRef=g.bomVerId&&/^VER-/.test(g.bomVerId)?g.bomVerId:'';
  const draft=loadBomDraft(g.name);
  const canVerify=!!bm;
  const startLbl=draft?'Resume BOM verification':(s==='Failed'?'Verify again':'Start BOM verification');
  if(s==='Passed'){ cls='s-pass'; txt=`Passed, all parts matched${verRef?` (${verRef})`:''}`; }
  else if(s==='Failed'){ cls='s-fail'; txt=`Failed, deviations found${verRef?` (${verRef})`:''}. Sampling is on hold.`; }
  else if(s==='Pending'){ cls='s-wait'; txt=canVerify?`Check all ${bm.parts} BOM parts of ${esc(bm.model)} for this batch`:`No BOM found for ${esc(modelLabel(g.model))}. Set its Lumio model number to a BOM tab name.`; }
  else if(s==='Waived'){ cls='s-na'; txt='Not required (waived by admin)'; }
  else { cls='s-na'; txt='Not required (batch created before the BOM step)'; }
  if((s==='Pending'||s==='Failed')&&canVerify) act+=`<button class="btn btn-primary btn-sm bomStartBtn" data-batch="${esc(g.name)}">${startLbl}</button>`;
  if(verRef) act+=`<button class="btn btn-ghost btn-sm bomViewBtn" data-batch="${esc(g.name)}" data-ver="${esc(verRef)}">${bomResult&&bomResult.batch===g.name?'Hide result':'View result'}</button>`;
  if(isAdmin&&(s==='Pending'||s==='Failed')) act+=`<button class="btn btn-ghost btn-sm bomStageBtn" data-batch="${esc(g.name)}" data-st="Waived">Waive</button>`;
  if(isAdmin&&(s===''||s==='Waived')) act+=`<button class="btn btn-ghost btn-sm bomStageBtn" data-batch="${esc(g.name)}" data-st="Pending">Require BOM check</button>`;
  const locked=s==='Pending'||s==='Failed';
  const sampTxt=locked?'Locked until BOM verification passes':`${g.completed} of ${g.totalLots} lots inspected`;
  const sampCls=locked?'s-lock':(g.completed===g.totalLots&&g.totalLots?(g.failLots?'s-fail':'s-pass'):'s-wait');
  let h=`<div class="flow" aria-label="Batch inspection flow">
    <div class="step ${cls}"><div class="step-n">1</div><div><div class="step-t">BOM verification</div><div class="step-s">${txt}</div>${act?`<div class="step-a">${act}</div>`:''}</div></div>
    <div class="step s-soon"><div class="step-n">2</div><div><div class="step-t">FAI inspection</div><div class="step-s">Coming soon. Not required yet.</div></div></div>
    <div class="step ${sampCls}"><div class="step-n">3</div><div><div class="step-t">Sampling inspection</div><div class="step-s">${sampTxt}</div></div></div>
  </div>`;
  if(bomResult&&bomResult.batch===g.name) h+=buildBomResult();
  return h;
}
function buildBomResult(){
  const r=bomResult;
  if(r.loading) return `<div class="bom-result"><div class="res-wrap text-muted">Loading verification…</div></div>`;
  if(r.error) return `<div class="bom-result"><div class="res-wrap err">${esc(r.error)}</div></div>`;
  if(!r.data||!r.data.found) return `<div class="bom-result"><div class="res-wrap text-muted">No verification record found.</div></div>`;
  const v=r.data.verification, items=r.data.items.slice().sort((a,b)=>(a.result==='Matched')-(b.result==='Matched'));
  return `<div class="bom-result">
    <div class="ld-head"><div><div class="ld-title">${esc(v.verId)}: ${esc(v.result)}</div><div class="text-muted" style="margin-top:4px">${esc(v.model)}, BOM revision ${esc(v.rev)} (${esc(v.bomStatus)}), ${v.partsChecked} parts, verified by ${esc(v.by)} on ${esc(v.time)}${v.remarks?`. Remarks: ${esc(v.remarks)}`:''}</div></div>
      <button class="btn btn-ghost btn-sm bomViewClose">Close</button></div>
    <div class="res-wrap"><div style="overflow-x:auto"><table class="res-table"><thead><tr><th>Part</th><th>Description</th><th>BOM QPS</th><th>Found part</th><th>Found QPS</th><th>Result</th><th>Remark</th></tr></thead><tbody>
    ${items.map(i=>`<tr class="${i.result==='Matched'?'':'row-bad'}"><td style="font-family:var(--code);white-space:nowrap">${esc(i.partNo)}</td><td>${esc(i.description)}</td><td>${esc(i.bomQps)}</td><td style="font-family:var(--code);white-space:nowrap" class="${i.lotPartNo!==i.partNo?'bad':''}">${esc(i.lotPartNo)}</td><td class="${String(i.lotQps)!==String(i.bomQps)?'bad':''}">${esc(i.lotQps)}</td><td class="${i.result==='Matched'?'':'bad'}">${esc(i.result)}</td><td>${esc(i.remark)}</td></tr>`).join('')}
    </tbody></table></div></div></div>`;
}

// ─── BOM VERIFICATION SCREEN ──────────────────────────────
function bomDraftKey(batch){ return 'oba_bomdraft_'+(user?user.username:'anon')+'_'+batch; }
function loadBomDraft(batch){ try{ const r=localStorage.getItem(bomDraftKey(batch)); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveBomDraft(){ if(!activeBom) return; try{ localStorage.setItem(bomDraftKey(activeBom.batch),JSON.stringify({model:activeBom.model,items:activeBom.items,remarks:activeBom.remarks,savedAt:new Date().toISOString()})); }catch(e){} }
function clearBomDraft(batch){ try{ localStorage.removeItem(bomDraftKey(batch)); }catch(e){} }
function bomCounts(){
  const a=activeBom; let match=0,diff=0;
  a.parts.forEach(p=>{ const it=a.items[p.partNo]; if(it&&it.state==='match') match++; else if(it&&it.state==='diff') diff++; });
  return {match,diff,todo:a.parts.length-match-diff,total:a.parts.length};
}
function bomItemValid(p,it){ return it&&it.state==='diff'?String(it.lotPartNo||'').trim()!==''&&String(it.lotQps??'').trim()!==''&&String(it.remark||'').trim()!=='':!!(it&&it.state==='match'); }
function bomInvalid(){ return activeBom.parts.filter(p=>activeBom.items[p.partNo]&&activeBom.items[p.partNo].state==='diff'&&!bomItemValid(p,activeBom.items[p.partNo])).length; }
function bomTallyHtml(){
  const c=bomCounts(), invalid=bomInvalid();
  return `<div>Checked: <b class="${c.todo?'t-warn':'t-ok'}">${c.total-c.todo}/${c.total}</b></div>
      <div>Deviations: <b class="${c.diff?'t-fail':'t-ok'}">${c.diff}</b></div>
      ${invalid?`<div class="t-fail">${invalid} deviation${invalid===1?'':'s'} missing part number, QPS or remark</div>`:''}`;
}
function updateBomFooter(){
  const btn=document.getElementById('btnBomSubmit'), tally=document.getElementById('bomTally');
  if(!btn||!activeBom) return;
  const c=bomCounts(), ready=c.todo===0&&bomInvalid()===0, a=activeBom;
  if(tally) tally.innerHTML=bomTallyHtml();
  btn.className='btn '+(ready?(c.diff?'btn-danger':'btn-primary'):'');
  btn.disabled=!(ready&&!a.saving);
  btn.textContent=a.saving?'Saving…':ready?(c.diff?`Submit with ${c.diff} deviation${c.diff===1?'':'s'}`:'Submit, all parts matched'):(c.todo?`Check all ${c.total} parts to submit`:'Complete the deviation details');
}

      <div class="verdict">

  <footer class="pg-footer">LUMIO Quality Management - Projector</footer>
  </div>`;
  return h;
}

function fmtDate(v){ const d=new Date(v); return isNaN(d)?(v||'-'):d.toLocaleString([], {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function buildLotDetail(lot,isAdmin){
  const ri=batches.indexOf(lot), key=lot.batchName+'||'+lot.lotNumber;

      <div><div class="ld-title">${esc(lot.lotNumber)}</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${st}${draft?`<span class="badge badge-open">Draft, ${draft.samples.filter(s=>s.serial).length} of ${draft.samples.length} samples</span>`:''}</div></div>

        <button class="btn btn-ghost btn-sm lotCloseBtn" aria-label="Close lot details">Close</button>

      <div>Lot size<b>${lot.lotSize} units</b></div>
      <div>Samples<b>${lot.sampleSize}</b></div>
      <div>Model<b>${esc(modelLabel(lot.model))}</b></div>
      <div>Production<b>${mmyyDisp(lot.prodMonthCode)}${lot.prodMonthCode2?' / '+mmyyDisp(lot.prodMonthCode2):''}</b></div>
      <div>Released<b>${lot.fgPassQty?lot.fgPassQty+' units':'—'}</b></div>
      <div>Created<b>${esc(fmtDate(lot.createdAt))}</b></div>
    </div>
    <div id="editArea${ri}" class="hidden" style="padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line)"></div>`;
  if(lot.status==='Closed'||lot.result){
    const c=lotUnits[key];
    h+=`<div class="res-wrap"><div style="font-weight:700;margin-bottom:8px">Sample results</div>`;
    if(!c||c.loading) h+=`<div class="text-muted">Loading sample results…</div>`;
    else if(c.error) h+=`<div class="err">${esc(c.error)}</div>`;
    else if(!c.units.length) h+=`<div class="text-muted">No sample records found for this lot.</div>`;
    else {
      const cell=v=>`<td class="${/fail/i.test(v)?'bad':''}">${esc(v||'-')}</td>`;
      h+=`<div style="overflow-x:auto"><table class="res-table"><thead><tr><th>#</th><th>Serial</th><th>Aes</th><th>Gen</th><th>Func</th><th>Scr</th><th>Black dot</th><th>Result</th><th>Remark</th><th>Inspected</th></tr></thead><tbody>
        ${c.units.map((u,i)=>`<tr class="${/fail/i.test(u.sampleResult)?'row-bad':''}"><td>${i+1}</td><td style="font-family:var(--code);white-space:nowrap">${esc(u.serial)}</td>${cell(u.aes)}${cell(u.general)}${cell(u.func)}${cell(u.screen)}<td>${esc(u.bd)}</td>${cell(u.sampleResult)}<td>${esc(u.remark)}</td><td style="white-space:nowrap">${esc(u.inspector)}<br><span class="text-muted">${esc(fmtDate(u.time))}</span></td></tr>`).join('')}
      </tbody></table></div>`;
    }
    h+=`</div>`;
  } else {
    h+=`<div class="res-wrap text-muted">${isAdmin?'Not inspected yet. An inspector can start this lot from their dashboard.':'Not inspected yet.'}</div>`;
  }
  return h+`</section>`;
}
async function loadLotUnits(lot){
  const k=lot.batchName+'||'+lot.lotNumber;
  lotUnits[k]={loading:true};
  const r=await api('getLotUnits',{batchName:lot.batchName,lotNumber:lot.lotNumber});
  lotUnits[k]=r.ok?{units:r.units||[]}:{error:(r.error||'').toLowerCase().includes('unknown')?'Sample results need the latest backend version.':(r.error||'Could not load sample results')};
  if(!activeLot && selLot===k) render();
}

// ─── DATA RECORDS PANEL (admin) ───────────────────────────
function buildDataPanel(){
  const d=dataScan;
  const brief=r=>`<b>${esc(r.lot||'-')}</b><br><span class="text-muted">${esc(fmtDate(r.time))}, ${esc(r.inspector||'-')}, ${esc(r.result||'-')}, Master row ${r.row}</span>`;
  let scanHtml='';
  if(d&&d.loading) scanHtml=`<div class="text-muted" style="margin-top:14px">Checking every serial number…</div>`;
  else if(d&&d.error) scanHtml=`<div class="err" style="margin-top:14px">${esc(d.error)}</div>`;
  else if(d){
    scanHtml=`<div class="stat-grid" style="margin:16px 0">
      <div class="stat"><div class="stat-label">Records</div><div class="stat-val">${d.totalRecords}</div></div>
      <div class="stat"><div class="stat-label">Unique serials</div><div class="stat-val">${d.uniqueSerials}</div></div>
      <div class="stat"><div class="stat-label">Serials recorded twice or more</div><div class="stat-val ${d.duplicateSerials?'text-fail':'text-pass'}">${d.duplicateSerials}</div></div>
      <div class="stat"><div class="stat-label">Extra copies</div><div class="stat-val ${d.extraRows?'text-fail':'text-pass'}">${d.extraRows}</div><div class="stat-sub">${d.archivedRows} moved out earlier</div></div>
    </div>`;
    if((d.exceptions||[]).length){
      scanHtml+=`<div class="text-muted" style="margin:-4px 0 14px">Approved to stay in more than one lot: ${d.exceptions.map(x=>`<span style="font-family:var(--code)">${esc(x.serial)}</span>`).join(', ')}. New inspections still can't reuse these serials.</div>`;
    }
    if(!d.extraRows){
      scanHtml+=`<div class="ok-note">No duplicates. Every serial number is recorded once.</div>`;
    } else {
      const shown=d.groups.slice(0,100);
      scanHtml+=`<div style="overflow-x:auto"><table class="res-table">
        <thead><tr><th>Serial number</th><th>Original, kept</th><th>Extra copies, will be moved</th><th></th></tr></thead>
        <tbody>${shown.map(g=>{const cross=g.dups.some(x=>x.lot!==g.keep.lot);return `<tr><td style="font-family:var(--code);white-space:nowrap">${esc(g.serial)}${cross?'<br><span class="badge badge-open" style="margin-top:4px">In different lots</span>':''}</td><td>${brief(g.keep)}</td><td>${g.dups.map(brief).join('<div style="height:6px"></div>')}</td><td>${cross?`<button class="btn btn-ghost btn-sm approveSerialBtn" data-serial="${esc(g.serial)}" title="Keep one record in each lot and stop flagging this serial">Keep in both lots</button>`:''}</td></tr>`;}).join('')}</tbody>
      </table></div>
      ${d.groups.length>shown.length?`<div class="text-muted" style="margin-top:8px">Showing the first ${shown.length} of ${d.groups.length} serial numbers.</div>`:''}
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px">
        <button id="btnRemoveDups" class="btn btn-danger">Move ${d.extraRows} extra ${d.extraRows===1?'copy':'copies'} to Duplicates sheet</button>
        <span class="text-muted">The earliest record of each serial stays in Master. Extra copies are moved to a sheet named Duplicates, not deleted.</span>
      </div>`;
    }
  }
  const rs=recSearch;
  let recHtml='';
  if(rs.loading) recHtml=`<div class="text-muted" style="margin-top:10px">Searching…</div>`;
  else if(rs.res&&rs.res.error) recHtml=`<div class="err" style="margin-top:10px">${esc(rs.res.error)}</div>`;
  else if(rs.res){
    const recs=rs.res.records||[];
    recHtml=!recs.length?`<div class="text-muted" style="margin-top:10px">No records match “${esc(rs.q)}”.</div>`:`
      <div class="text-muted" style="margin:10px 0 8px">${recs.length}${rs.res.truncated?'+':''} record${recs.length===1?'':'s'} found${rs.res.truncated?', showing the first 300':''}.</div>
      <div style="overflow-x:auto"><table class="res-table"><thead><tr><th>Serial number</th><th>Batch</th><th>Lot</th><th>Result</th><th>Inspector</th><th>Inspected</th><th>Status</th><th>Sheet row</th></tr></thead><tbody>
      ${recs.map(r=>`<tr class="${r.status==='Active'?'':'row-muted'}"><td style="font-family:var(--code);white-space:nowrap">${esc(r.serial)}</td><td>${esc(r.batch)}</td><td>${esc(r.lot)}</td><td class="${/fail/i.test(r.result)?'bad':''}">${esc(r.result||'-')}</td><td>${esc(r.inspector)}</td><td style="white-space:nowrap">${esc(fmtDate(r.time))}</td><td>${r.status==='Active'?'<span class="badge badge-pass">In Master</span>':`<span class="badge badge-closed">Moved to Duplicates</span>`}</td><td>${r.status==='Active'?'Master':'Duplicates'} ${r.row}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  return `<div class="card" id="dataCard">
    <div class="card-title">Data records</div>
    <p class="text-muted" style="font-size:14px;max-width:70ch">Rule: each serial number is recorded once. New submissions with a serial that already exists are refused. Use the check below to find older duplicates.</p>
    <div style="margin-top:12px"><button id="btnScanDups" class="btn btn-primary" ${d&&d.loading?'disabled':''}>${d&&!d.loading?'Check again':'Check for duplicate serials'}</button></div>
    ${scanHtml}
    <div style="border-top:1px solid var(--line);margin:22px 0 16px"></div>
    <div style="font-weight:700;margin-bottom:8px">Look up a record</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;max-width:620px">
      <input id="recQ" class="field" type="search" value="${esc(rs.q)}" placeholder="Serial number (or part of it) or lot number" style="flex:1;min-width:220px">
      <button id="btnRecSearch" class="btn btn-ghost">Search</button>
    </div>
    ${recHtml}
  </div>`;
}

// ─── MODELS PANEL (admin) ─────────────────────────────────
function buildModelsPanel(){

      <td style="${td}">${u?`${u.lots} lots${u.openLots?`, ${u.openLots} open`:''}`:'<span class="text-muted">Not used yet</span>'}</td>
      <td style="${td};text-align:right;white-space:nowrap">

        <button class="btn btn-ghost btn-sm delModelBtn" data-name="${esc(m.name)}" aria-label="Delete ${esc(m.name)}" style="color:var(--fail)">Delete</button>
      </td></tr>`;}).join('');
  if(!rows) rows=`<tr><td colspan="8" style="padding:16px;text-align:center;color:var(--ink-3)">No models yet. ${modelSuggestions.length?'Start with the models found in your data below.':'Add your first model below.'}</td></tr>`;

  const sugg=modelSuggestions.length?`
    <div class="found-box">
      <div style="font-weight:700;color:var(--ink);margin-bottom:4px">Found in your existing data</div>
      <div class="text-muted" style="margin-bottom:10px">These model names are used by batches but have no spec yet. Lots using them can't be inspected until you add them.</div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px;color:var(--ink-2)">
        <thead><tr style="color:var(--ink-3);font-size:13px"><th style="${th}">Model</th><th style="${th}">Serial code in data</th><th style="${th}">Black dot limit used</th><th style="${th}">Lots</th><th style="${th}">Batches</th><th></th></tr></thead>
        <tbody>${modelSuggestions.map(sg=>`<tr style="border-top:1px solid var(--line)">
          <td style="${td};color:var(--ink);font-weight:600">${esc(sg.name)}</td>

        <tbody>${rows}</tbody>
      </table>

    <div id="modelForm" style="font-size:16px;font-weight:700;color:var(--ink);margin:6px 0 12px">${em?'Edit '+esc(em.lumioModel||em.name):(modelPrefill?'Add '+esc(modelPrefill.name)+' from existing data':'Add a model')}</div>
    ${modelPrefill&&!em?`<div class="text-muted" style="margin:-6px 0 12px">Model name, serial code and black dot fail limit were copied from your data. Fill in the Lumio model number and the remaining limits.</div>`:''}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px">

      ${nf('m_maxD','Fail if D &gt; (mm)','e.g. 2.4','0.01','Any dot bigger fails')}
      ${nf('m_smallD','OK if D ≤ (mm)','e.g. 1.28','0.01','Small dot, no area check')}
      ${nf('m_maxN','Max N (spots)','e.g. 3','1','More spots fails')}
      ${nf('m_minDS','Min DS (mm)','e.g. 15','0.1','Spot spacing, when N &gt; 1')}
      ${nf('m_nA','Area A, max N','e.g. 1','1','For mid-size dots')}
      ${nf('m_nB','Area B, max N','e.g. 3','1','For mid-size dots')}
      ${nf('m_nAB','Area A+B, max N','e.g. 3','1','For mid-size dots')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="btnSaveModel" class="btn btn-primary">${em?'Save changes':'Add model'}</button>
      ${em||modelPrefill?'<button id="btnCancelModel" class="btn btn-ghost">Cancel</button>':''}
    </div>
    <div class="text-muted" style="margin-top:12px;font-size:12.5px;line-height:1.6">Black dot rules run in this order: not visible at 2 m passes; D above the fail limit fails; more than max N spots fails; spacing below min DS fails (only when N &gt; 1); D at or below the OK limit passes; otherwise the area limit decides. Changes apply to inspections immediately.</div>
  </div>`;
}

  <div class="main">
