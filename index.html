// ─── BATCH FLOW STRIP ─────────────────────────────────────
function buildFlow(g,isAdmin){
  const s=g.bomStatus, bm=bomFor(g.model);
  let cls='s-na', txt='', act='';
  const verRef=g.bomVerId&&/^VER-/.test(g.bomVerId)?g.bomVerId:'';
  const sd=(g.lots.find(l=>l.bomDraft)||{}).bomDraft||null, draft=sd||loadBomDraft(g.name);
  const canVerify=!!bm;
  const startLbl=draft?'Resume BOM verification':(s==='Failed'?'Verify again':'Start BOM verification');
  if(s==='Passed'){ cls='s-pass'; txt=`Passed, all parts matched${verRef?` (${esc(verRef)})`:''}`; }
  else if(s==='Failed'){ cls='s-fail'; txt=`Failed, deviations found${verRef?` (${esc(verRef)})`:''}. Sampling is on hold.`; }
  else if(s==='Pending'){ cls='s-wait'; txt=canVerify?`Check all ${bm.parts} BOM parts of ${esc(bm.model)} for this batch`:`No BOM found for ${esc(modelLabel(g.model))}. Set its Lumio model number to a BOM tab name.`; }
  else if(s==='Waived'){ cls='s-na'; txt='Not required (waived by admin)'; }
  else { cls='s-na'; txt='Not required (batch created before the BOM step)'; }
  if(sd&&(s==='Pending'||s==='Failed')) txt+=`<br><span class="text-muted">Draft: ${sd.checked} of ${sd.total} parts checked${sd.open?`, ${sd.open} in progress`:''}${sd.deviations?`, ${sd.deviations} deviation${sd.deviations===1?'':'s'}${sd.ecn?` (${sd.ecn} ECN pending)`:''}`:''}. Saved ${esc(fmtDate(sd.at))} by ${esc(sd.by)}.</span>`;
  if((s==='Pending'||s==='Failed')&&canVerify&&can('bomverify')) act+=`<button class="btn btn-primary btn-sm bomStartBtn" data-batch="${esc(g.name)}">${startLbl}</button>`;
  if(bm) act+=`<button class="btn btn-ghost btn-sm" data-bxg="dlBom" data-m="${esc(bm.model)}">BOM ${esc(bm.model)} Rev ${esc(bm.rev)}</button>`;
  if(verRef) act+=`<button class="btn btn-ghost btn-sm" data-bxg="dlVer" data-v="${esc(verRef)}">Verified BOM</button>`;
  if(verRef) act+=`<button class="btn btn-ghost btn-sm bomViewBtn" data-batch="${esc(g.name)}" data-ver="${esc(verRef)}">${bomResult&&bomResult.batch===g.name?'Hide result':'View result'}</button>`;
  if(isAdmin&&(s==='Pending'||s==='Failed')) act+=`<button class="btn btn-ghost btn-sm bomStageBtn" data-batch="${esc(g.name)}" data-st="Waived">Waive</button>`;
  if(isAdmin&&(s===''||s==='Waived')) act+=`<button class="btn btn-ghost btn-sm bomStageBtn" data-batch="${esc(g.name)}" data-st="Pending">Require BOM check</button>`;
  const locked=s==='Pending'||s==='Failed';
  const faiSt=(g.lots.find(l=>l.faiStatus)||{}).faiStatus||'';
  const faiTxt=faiSt?`${faiSt==='Pass'?'Passed':faiSt==='Fail'?'Failed':faiSt}, 5 samples for the batch`:'Not done yet. 5 samples for the batch.';
  const faiCls=faiSt==='Pass'?'s-pass':faiSt==='Fail'?'s-fail':faiSt?'s-wait':'s-na';
  const faiAct=can('fai')?`<button class="btn ${faiSt?'btn-ghost':'btn-primary'} btn-sm faiBtn" data-batch="${esc(g.name)}">${faiSt?'Edit FAI':'Start FAI'}</button>`:faiSt?`<button class="btn btn-ghost btn-sm faiBtn" data-batch="${esc(g.name)}">View FAI</button>`:'';
  const sampTxt=locked?'Locked until BOM verification passes':`${g.completed} of ${g.totalLots} lots inspected`;
  const sampCls=locked?'s-lock':(g.completed===g.totalLots&&g.totalLots?(g.failLots?'s-fail':'s-pass'):'s-wait');
  let h=`<div class="flow" aria-label="Batch inspection flow">
    <div class="step ${cls}"><div class="step-n">1</div><div><div class="step-t">BOM verification</div><div class="step-s">${txt}</div>${act?`<div class="step-a">${act}</div>`:''}</div></div>
    <div class="step ${faiCls}"><div class="step-n">2</div><div><div class="step-t">FAI inspection</div><div class="step-s">${faiTxt}</div>${faiAct?`<div class="step-a">${faiAct}</div>`:''}</div></div>
    <div class="step ${sampCls}"><div class="step-n">3</div><div><div class="step-t">Sampling inspection</div><div class="step-s">${sampTxt}</div></div></div>
  </div>`;
  if(bomResult&&bomResult.batch===g.name) h+=buildBomResult();
  return h;
}
function buildBomResult(){
  const r=bomResult;
  if(r.loading) return `<div class="bom-result"><div class="res-wrap text-muted">Loading verification…</div></div>`;
  if(r.error) return `<div class="bom-result"><div class="res-wrap err">${esc(r.error)}</div></div>`;
  if(!r.data||!r.data.found) return `<div class="bom-result"><div class="res-wrap text-muted">No verification record found.</div></div>`;
  const v=r.data.verification, items=r.data.items.slice().sort((a,b)=>(a.result==='Matched')-(b.result==='Matched'));
  return `<div class="bom-result">
    <div class="ld-head"><div><div class="ld-title">${esc(v.verId)}: ${esc(v.result)}</div><div class="text-muted" style="margin-top:4px">${esc(v.model)}, BOM revision ${esc(v.rev)} (${esc(v.bomStatus)}), ${esc(v.partsChecked)} parts, verified by ${esc(v.by)} on ${esc(v.time)}${v.remarks?`. Remarks: ${esc(v.remarks)}`:''}</div></div>
      <button class="btn btn-ghost btn-sm bomViewClose">Close</button></div>
    <div class="res-wrap"><div style="overflow-x:auto"><table class="res-table"><thead><tr><th>Part</th><th>Description</th><th>BOM QPS</th><th>Found part</th><th>Found QPS</th><th>Locations</th><th>Result</th><th>Remark</th></tr></thead><tbody>
    ${items.map(i=>`<tr class="${i.result==='Matched'?'':'row-bad'}"><td style="font-family:var(--code);white-space:nowrap">${esc(i.partNo)}</td><td>${esc(i.description)}</td><td>${esc(i.bomQps)}</td><td style="font-family:var(--code);white-space:nowrap" class="${i.lotPartNo!==i.partNo?'bad':''}">${esc(i.lotPartNo)}</td><td class="${String(i.lotQps)!==String(i.bomQps)?'bad':''}">${esc(i.lotQps)}</td><td style="font-size:12.5px">${esc(i.locations||'')}</td><td class="${i.result==='Matched'?'':'bad'}">${esc(i.result)}</td><td>${esc(i.remark)}</td></tr>`).join('')}
    </tbody></table></div></div></div>`;
}

/* Drafts live on the server (shared, survive days and devices); the browser keeps a backup copy */
function bomDraftKey(batch){ return 'oba_bomdraft_'+(user?user.username:'anon')+'_'+batch; }
function loadBomDraft(batch){ try{ const r=localStorage.getItem(bomDraftKey(batch)); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveBomDraft(){ if(!activeBom) return; try{ localStorage.setItem(bomDraftKey(activeBom.batch),JSON.stringify({model:activeBom.model,items:activeBom.items,remarks:activeBom.remarks,savedAt:new Date().toISOString(),v:2})); }catch(e){} scheduleBomSave(); }
function clearBomDraft(batch){ try{ localStorage.removeItem(bomDraftKey(batch)); }catch(e){} }
/* older browser drafts: {state, lotPartNo, lotQps, remark} */
function bomItemFromOld(p,it){
  if(!it) return null;
  if(Array.isArray(it.lines)) return it;
  if(it.state==='match') return {found:'',lines:[{loc:'',qty:p.qps,note:''}],remark:'',ecn:false};
  return {found:String(it.lotPartNo||'')===p.partNo?'':String(it.lotPartNo||''),lines:[{loc:'',qty:it.lotQps??'',note:''}],remark:it.remark||'',ecn:false};
}
/* Same rules as the server (judgeBomItem_) */
function bomJudge(p,it){
  if(!it) return {state:'todo'};
  const found=String(it.found||'').trim()||p.partNo;
  const okPn=found===p.partNo||(p.alternates||[]).includes(found);
  let total=0, blank=0;
  (it.lines||[]).forEach(l=>{ const q=String(l.qty??'').trim(); if(q===''||isNaN(Number(q))||Number(q)<0) blank++; else total+=Number(q); });
  total=Math.round(total*1e6)/1e6;
  const qps=Number(p.qps);
  if(!(it.lines||[]).length||blank) return {state:'open',why:'Enter the quantity',found,total,okPn};
  if(it.lines.length>1&&it.lines.some(l=>!String(l.loc||'').trim())) return {state:'open',why:'Enter the location of each quantity',found,total,okPn};
  if(okPn&&Math.abs(total-qps)<1e-9) return {state:'match',result:'Matched',found,total,okPn};
  if(okPn&&total<qps&&!it.ecn) return {state:'open',why:`${total} of ${qps} entered`,found,total,okPn};
  return {state:'dev',found,total,okPn,result:total===0?'Not used in lot':!okPn?'Part changed':'QPS changed'};
}
function bomCounts(){
  const a=activeBom; let match=0,dev=0,open=0,ecn=0,noRemark=0;
  a.parts.forEach(p=>{ const it=a.items[p.partNo], j=bomJudge(p,it);
    if(j.state==='match') match++; else if(j.state==='dev'){ dev++; if(it.ecn) ecn++; if(!String(it.remark||'').trim()) noRemark++; } else if(j.state==='open') open++; });
  return {match,dev,open,ecn,noRemark,todo:a.parts.length-match-dev-open,total:a.parts.length};
}
function bomTallyHtml(){
  const c=bomCounts();
  return `<div>Checked: <b class="${c.todo+c.open?'t-warn':'t-ok'}">${c.match+c.dev}/${c.total}</b>${c.open?` <span class="text-muted">(${c.open} in progress)</span>`:''}</div>
      <div>Deviations: <b class="${c.dev?'t-fail':'t-ok'}">${c.dev}</b>${c.ecn?` <span class="text-muted">(${c.ecn} ECN pending)</span>`:''}</div>
      ${c.noRemark?`<div class="t-fail">${c.noRemark} deviation${c.noRemark===1?'':'s'} without a remark</div>`:''}
      <div class="save-st ${activeBom.saveErr?'bad':''}" id="bomSaveSt">${bomSaveText()}</div>`;
}
function bomSaveText(){
  const a=activeBom;
  if(a.saveErr) return 'Draft not saved: '+esc(a.saveErr);
  if(a.saveTimer||a.saveBusy) return 'Saving draft…';
  if(a.savedAt) return `Draft saved ${new Date(a.savedAt).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}${a.savedBy&&a.savedBy!==user.name?' by '+esc(a.savedBy):''}`;
  return 'Draft is saved on the server as you work';
}
function updateBomFooter(){
  const a=activeBom; if(!a) return;

}
function refreshBomRow(pn){
  const a=activeBom, p=a.parts.find(x=>x.partNo===pn); if(!p) return;

  if(row){ row.classList.toggle('r-match',j.state==='match'); row.classList.toggle('r-diff',j.state==='dev'); row.classList.toggle('r-open',j.state==='open'); }

function bomStatusPill(p,it){

}
function bomTotalHtml(p,j){

}

function scheduleBomSave(){
  const a=activeBom; if(!a||a.conflict) return;
  if(a.saveTimer) clearTimeout(a.saveTimer);
  a.saveTimer=setTimeout(()=>{ a.saveTimer=null; flushBomSave(); },1200);
  const el=document.getElementById('bomSaveSt'); if(el){ el.className='save-st'; el.textContent='Saving draft…'; }
}
async function flushBomSave(){
  const a=activeBom; if(!a||a.conflict) return true;
  if(a.saveTimer){ clearTimeout(a.saveTimer); a.saveTimer=null; }
  if(a.saveBusy){ a.saveAgain=true; return true; }
  a.saveBusy=true;
  const c=bomCounts();
  const r=await api('saveBomDraft',{batchName:a.batch,model:a.model,rev:a.control.rev||'',items:a.items,remarks:a.remarks||'',baseVersion:a.version,
    summary:{checked:c.match+c.dev,total:c.total,deviations:c.dev,ecn:c.ecn,open:c.open}});
  a.saveBusy=false;
  if(r.ok){ a.version=r.version; a.savedAt=r.at; a.savedBy=user.name; a.saveErr=''; }
  else { a.saveErr=r.error||'network error'; if(r.conflict){ a.conflict=true; toast(r.error,'err'); } }
  if(activeBom===a){ const el=document.getElementById('bomSaveSt'); if(el){ el.className='save-st'+(a.saveErr?' bad':''); el.innerHTML=bomSaveText(); } }
  if(a.saveAgain&&!a.conflict){ a.saveAgain=false; return flushBomSave(); }
  return r.ok;
}
/* After an ECN the BOM changes: keep what was entered, matched to the parts of the new revision */
function realignBomItems(parts,items){
  const out={}, used=new Set(), notes=[], inBom=new Set(parts.map(p=>p.partNo));
  parts.forEach(p=>{ const it=bomItemFromOld(p,items[p.partNo]); if(it){ out[p.partNo]=it; used.add(p.partNo); } });
  parts.forEach(p=>{
    if(out[p.partNo]) return;
    const k=Object.keys(items).find(k=>!used.has(k)&&!inBom.has(k)&&items[k]&&(String(items[k].found||items[k].lotPartNo||'').trim()===p.partNo||(p.alternates||[]).includes(String(items[k].found||items[k].lotPartNo||'').trim())));
    if(k){ const it=bomItemFromOld(p,items[k]); out[p.partNo]={...it,found:'',ecn:false}; used.add(k); notes.push(`${k} was replaced by ${p.partNo}; its quantities now check against ${p.partNo}.`); }
  });
  const gone=Object.keys(items).filter(k=>!used.has(k));
  if(gone.length) notes.push(`No longer in the BOM: ${gone.join(', ')}.`);
  return {items:out,notes};
}
/* ── Generate ECN from the verification screen ── */
/* the usual part code prefix in PART_MASTER, e.g. "D018." (the most common text up to the first dot) */
function partCodePrefix(rows){
  const n={}; (rows||[]).forEach(r=>{ const m=String(r.partNo).match(/^([^.]+\.)/); if(m) n[m[1]]=(n[m[1]]||0)+1; });
  let best='',c=0; Object.keys(n).forEach(k=>{ if(n[k]>c){ best=k; c=n[k]; } }); return best;
}
/* part code for a part number found on the material: an existing part if there is one, else prefix + number */
function genPartCode(found,prefix,known){
  const f=String(found||'').trim(); if(!f) return '';
  const has=x=>known.has(String(x).toUpperCase());
  if(has(f)) return f;
  if(prefix&&has(prefix+f)) return prefix+f;
  if(prefix&&f.toUpperCase().startsWith(prefix.toUpperCase())) return f;
  return prefix+f;
}
function bomEcnRows(){
  const a=activeBom, out=[];
  a.parts.forEach(p=>{
    const it=a.items[p.partNo], j=bomJudge(p,it); if(j.state!=='dev') return;
    const kind=j.total===0?'remove':!j.okPn?'replace':'qps';
    out.push({p,it,j,kind});
  });
  return out;
}
function bomEcnPanel(){
  const a=activeBom, e=a.ecn; if(!e||!e.open) return '';
  if(e.loading) return '<div class="ecn-panel text-muted">Loading parts…</div>';
  if(e.error) return `<div class="ecn-panel err">${esc(e.error)} <button class="btn btn-ghost btn-sm" id="btnEcnCancel">Close</button></div>`;
  const rows=bomEcnRows(), known=e.known;
  const body=rows.map(({p,it,j,kind})=>{
    const r=e.rows[p.partNo]||{};
    if(kind==='remove') return `<tr><td><div class="mono">${esc(p.partNo)}</div><div class="text-muted">${esc(p.description)}</div></td><td>Remove (not used, QPS ${esc(p.qps)} → 0)</td><td colspan="2" class="text-muted">No new part</td></tr>`;
    if(kind==='qps') return `<tr><td><div class="mono">${esc(p.partNo)}</div><div class="text-muted">${esc(p.description)}</div></td><td>QPS ${esc(p.qps)} → <b>${esc(j.total)}</b></td><td class="mono">${esc(j.okPn?p.partNo:j.found)}</td><td class="text-muted">Same part, new QPS</td></tr>`;
    const code=r.code??genPartCode(j.found,e.prefix,known), isNew=code&&!known.has(code.toUpperCase());
    return `<tr><td><div class="mono">${esc(p.partNo)}</div><div class="text-muted">${esc(p.description)}</div></td>
      <td>Replace, QPS ${esc(j.total)}<div class="text-muted">Found: <span class="mono">${esc(j.found)}</span></div></td>
      <td><input class="field mono ecnRow" data-pn="${esc(p.partNo)}" data-f="code" value="${esc(code)}" aria-label="New part code for ${esc(p.partNo)}" maxlength="60">
        <span class="ecn-code-st" data-pn="${esc(p.partNo)}">${isNew?'<span class="ecn-new">New part code, created with the ECN</span>':'<span class="ecn-old">Already in Parts</span>'}</span></td>

}
async function openBomEcn(){
  const a=activeBom;
  const why=bomEcnRows().map(r=>String(r.it.remark||'').trim()?`${r.p.partNo}: ${String(r.it.remark).trim()}`:'').filter(Boolean);
  a.ecn={open:true,loading:true,rows:{},reason:(`BOM verification of ${a.batch}. `+why.join('; ')).slice(0,1000),
    date:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),recv:false,doc:'',prefix:''};
  render();
  try{
    const lp=await bomApi('listParts');
    a.ecn.master=lp; a.ecn.known=new Set(lp.rows.map(r=>String(r.partNo).toUpperCase())); a.ecn.prefix=partCodePrefix(lp.rows); a.ecn.loading=false;
  }catch(x){ a.ecn.loading=false; a.ecn.error=x.message; }
  if(activeBom===a){ render(); document.querySelector('.ecn-panel')?.scrollIntoView({block:'start',behavior:'smooth'}); }
}
async function runBomEcn(){
  const a=activeBom, e=a.ecn, rows=bomEcnRows();
  const lp=e.master, f=lp.fields, descF=lp.descField, row=pn=>lp.rows.find(r=>r.partNo===pn);
  const reason=String(e.reason||'').trim(); if(!reason) return toast('Enter the reason for the change.','err');
  if(!e.date) return toast('Enter the effective date.','err');
  if(e.recv&&!/^https:\/\//.test(String(e.doc||'').trim())) return toast('Paste the https link to the ECN document, or choose Not yet.','err');
  const oldParts=[], newParts=[], create={}, codeOf={};
  for(const {p,j,kind} of rows){
    oldParts.push(p.partNo);
    if(kind==='remove') continue;
    if(kind==='qps'){ newParts.push({partNo:j.okPn?p.partNo:j.found,qps:j.total}); continue; }
    const r=e.rows[p.partNo]||{}, code=String(r.code??genPartCode(j.found,e.prefix,e.known)).trim();
    if(!code) return toast(`Enter the new part code for ${p.partNo}.`,'err');
    if(!/^[A-Za-z0-9][A-Za-z0-9 ._\-\/]{0,59}$/.test(code)) return toast(`Part code ${code}: use letters, numbers, . _ - / (up to 60).`,'err');
    codeOf[p.partNo]=code; newParts.push({partNo:code,qps:j.total});
    if(!e.known.has(code.toUpperCase())&&!create[code.toUpperCase()]){
      const desc=String(r.desc??p.description).trim(); if(!desc) return toast(`Enter the description of new part ${code}.`,'err');
      const src=row(p.partNo), values={};
      f.forEach((h,i)=>{ if(h===descF) values[h]=desc; else if(h===lp.urlField||/^image$/i.test(h)) values[h]=''; else values[h]=src?src.v[i]:''; });
      create[code.toUpperCase()]={partNo:code,values};
    }
  }
  const nNew=Object.keys(create).length;
  if(!confirm(`Generate an ECN for ${a.model}?\n\n${nNew?`New part codes: ${Object.values(create).map(x=>x.partNo).join(', ')}\n`:''}Remove or replace: ${oldParts.join(', ')}\nAdd: ${newParts.map(x=>x.partNo+' (QPS '+x.qps+')').join(', ')||'none'}\n\nThe BOM changes now and its revision goes up by one.`)) return;
  try{
    for(const c of Object.values(create)){ e.busy='Creating '+c.partNo+'…'; render(); await bomApi('savePart',{payload:{partNo:c.partNo,isNew:true,values:c.values}}); e.known.add(c.partNo.toUpperCase()); }
    e.busy='Generating ECN…'; render();
    const d=await bomApi('runEcnChange',{payload:{model:a.model,oldParts,newParts,reason,effectiveDate:e.date,received:!!e.recv,docUrl:e.recv?String(e.doc).trim():''}});
    // the draft follows the new part codes, then is checked against the new BOM revision
    Object.keys(codeOf).forEach(pn=>{ if(a.items[pn]) a.items[pn].found=codeOf[pn]; });
    bxClear();
    const r=await api('getBom',{model:a.model});
    if(r.ok){ const al=realignBomItems(r.parts,a.items); a.parts=r.parts; a.items=al.items; a.notes=al.notes; a.draftRev=a.control.rev; a.control=r.control||a.control; }
    a.ecn=null; saveBomDraft(); render(); window.scrollTo(0,0);
    toast(`${d.ecnNo} saved, ${a.model} is now at Rev ${d.rev}.${nNew?` ${nNew} new part code${nNew===1?'':'s'} created.`:''}`);
  }catch(x){ e.busy=''; render(); toast(x.message,'err'); }
}
function bomEcnPrefill(){
  const a=activeBom, old=[], add=[], why=[];
  a.parts.forEach(p=>{
    const it=a.items[p.partNo], j=bomJudge(p,it); if(j.state!=='dev') return;
    old.push(p.partNo);
    if(j.total>0) add.push(`${j.okPn?p.partNo:j.found}  ${j.total}`);
    if(String(it.remark||'').trim()) why.push(`${p.partNo}: ${String(it.remark).trim()}`);
  });
  return {old:old.join('\n'),add:add.join('\n'),reason:`BOM verification of ${a.batch}. `+why.join('; ')};
}

// Small built-in reader/writer so no outside library is loaded.
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true);
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;

    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    const lo=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);
    const data=u8.slice(lo,lo+csize);
    out[name]={method,data};
    p+=46+nlen+xlen+clen;

  return {
    has:nm=>!!out[nm], names:()=>Object.keys(out),
    text:async nm=>{ const f=out[nm]; if(!f) return null; let b=f.data;
      if(f.method===8) b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      else if(f.method!==0) throw new Error('Unsupported Excel compression');

}
function cellText(v){

}
async function readXlsx(buf){
  const z=await unzip(buf), X=t=>new DOMParser().parseFromString(t,'application/xml');

  if(sst) X(sst).querySelectorAll('si').forEach(si=>ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')));

  if(!z.has(sheet)) sheet=z.names().filter(n=>/^xl\/worksheets\/[^/]+\.xml$/.test(n)).sort()[0];
  if(!sheet) throw new Error('No worksheet found in the file');

    const row=[];
    r.querySelectorAll('c').forEach(c=>{

function parseCsv(text){
  const rows=[]; let row=[], f='', q=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','||ch===';'||ch==='\t'){ row.push(f); f=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=ch;

async function readSheetFile(file){
  if(file.size>5*1024*1024) throw new Error('File is larger than 5 MB');

  if(name.endsWith('.xlsx')) return readXlsx(await file.arrayBuffer());
  if(name.endsWith('.csv')||name.endsWith('.txt')) return parseCsv(await file.text());
  if(name.endsWith('.xls')) throw new Error('Old .xls files are not supported. In Excel use File > Save As > Excel Workbook (.xlsx).');

// ─── FAI INSPECTION ──────────────────────────────────────
const FAI_N=5;
function faiJudge(it,val){
  if(it.na) return 'N/A';

  if(it.type==='text'){ const t=String(val&&val.v!=null?val.v:'').trim(); if(!t) return ''; if(it.expected) return t.toLowerCase()===String(it.expected).trim().toLowerCase()?'Pass':'Fail'; return val&&(val.j==='Pass'||val.j==='Fail')?val.j:''; }
  if(it.type==='number'){ const raw=val&&val.v!=null?String(val.v).trim():''; if(raw==='') return ''; const x=Number(raw); if(!isFinite(x)) return 'Fail';
    if(has(it.nom)&&has(it.tol)) return Math.abs(x-Number(it.nom))<=Number(it.tol)+1e-9?'Pass':'Fail';
    if(has(it.min)||has(it.max)) return (!has(it.min)||x>=Number(it.min))&&(!has(it.max)||x<=Number(it.max))?'Pass':'Fail';
    return val&&(val.j==='Pass'||val.j==='Fail')?val.j:''; }
  if(it.type==='xy'){ const xs=val&&val.x!=null?String(val.x).trim():'', ys=val&&val.y!=null?String(val.y).trim():''; if(xs===''||ys==='') return ''; const X=Number(xs),Y=Number(ys); if(!isFinite(X)||!isFinite(Y)) return 'Fail';
    if(has(it.x)&&has(it.y)&&has(it.tol)) return Math.abs(X-Number(it.x))<=Number(it.tol)+1e-9&&Math.abs(Y-Number(it.y))<=Number(it.tol)+1e-9?'Pass':'Fail';
    return val&&(val.j==='Pass'||val.j==='Fail')?val.j:''; }
  return '';
}
function faiAuto(it){ const has=x=>x!==''&&x!=null; return it.type==='text'?!!it.expected:it.type==='number'?((has(it.nom)&&has(it.tol))||has(it.min)||has(it.max)):it.type==='xy'?(has(it.x)&&has(it.y)&&has(it.tol)):false; }
function faiSpecText(it){
  const has=x=>x!==''&&x!=null, u=it.unit?' '+it.unit:'';
  if(it.na) return 'Not involved';
  if(it.type==='text') return it.expected?`= ${it.expected}`:'Record value';
  if(it.type==='number'){ if(has(it.nom)&&has(it.tol)) return `${it.nom} ± ${it.tol}${u}`; if(has(it.min)&&has(it.max)) return `${it.min} to ${it.max}${u}`; if(has(it.min)) return `≥ ${it.min}${u}`; if(has(it.max)) return `≤ ${it.max}${u}`; return 'No limit set'+(u?` (${u.trim()})`:''); }

  const [sp,fr]=await Promise.all([api('getFaiSpec',{model:lot.model}),api('getFai',{batchName:lot.batchName})]);

  const n=Math.min(FAI_N,Number(lot.lotSize)||FAI_N);
  const readOnly=!can('fai');
  let rep, meta=null;
  if(fr.found){ meta=fr.report; rep=JSON.parse(JSON.stringify(fr.report.data||{})); }
  else rep={header:{customer:sp.spec.customer||'Lumio',inspectionDate:new Date().toISOString().slice(0,10)},samples:[],remarks:{},others:'',defects:'',result:''};
  rep.header=rep.header||{}; rep.remarks=rep.remarks||{};
  rep.samples=Array.from({length:n},(_,i)=>(rep.samples||[])[i]||{serial:'',results:{}});
  if(!readOnly){
    let d=null; try{ d=JSON.parse(localStorage.getItem(faiDraftKey(lot))||'null'); }catch(e){}
    if(d&&d.rep&&(d.base||0)===(meta?meta.revision:0)&&confirm(`An unsaved FAI draft for ${lot.label} exists (${new Date(d.savedAt).toLocaleString()}). Resume it? Cancel starts from the ${meta?'saved report':'blank form'}.`)) rep=d.rep;
  }
  activeFai={lot,spec:sp.spec,specSaved:sp.saved,rep,meta,readOnly,saving:false,n};
  render(); window.scrollTo(0,0);
}
function faiTally(){
  const a=activeFai, items=a.spec.items;
  let pending=0; const bad=new Set();
  a.rep.samples.forEach((smp,si)=>items.forEach(it=>{ const j=faiJudge(it,smp.results[it.id]); if(j==='') pending++; if(j==='Fail') bad.add(si); }));
  const noSerial=a.rep.samples.filter(x=>!String(x.serial||'').trim()).length;
  return {pending,defective:bad.size,noSerial};
}

// ─── REWORK (lot on hold) ─────────────────────────────────
const CHECKPOINTS=['Aesthetic','General','Functional','Screen','Black dot'];
const UNIT_STATUSES=['Reworked OK','Scrapped'];
function reworkDraftKey(lot){ return 'oba_rework_'+(user?user.username:'anon')+'_'+lot.batchName+'_'+lot.lotNumber+'_r'+(lot.round||1); }
function saveReworkDraft(){ if(!activeRework) return; try{ localStorage.setItem(reworkDraftKey(activeRework.lot),JSON.stringify({count:activeRework.count,items:activeRework.items,remarks:activeRework.remarks})); }catch(e){} }
function checkpointOf(u){
  if(/fail/i.test(u.general)) return 'General'; if(/fail/i.test(u.func)) return 'Functional'; if(/fail/i.test(u.screen)) return 'Screen';
  if(/fail/i.test(u.bd)) return 'Black dot'; if(/fail/i.test(u.aes)) return 'Aesthetic'; return '';
}
async function openRework(lot){
  const r=await api('getLotUnits',{batchName:lot.batchName,lotNumber:lot.lotNumber});
  if(!r.ok){ toast(r.error||'Could not load the lot','err'); return; }
  const round=lot.round||1;
  const bad=(r.units||[]).filter(u=>(u.round||1)===round&&/fail/i.test(u.sampleResult));
  let d=null; try{ d=JSON.parse(localStorage.getItem(reworkDraftKey(lot))||'null'); }catch(e){}
  const items=d&&d.items&&d.items.length?d.items:bad.map(u=>({serial:u.serial,checkpoint:checkpointOf(u),defect:u.remark&&u.remark!=='OK'?u.remark:'',action:'',status:'Reworked OK',fromSample:true}));
  activeRework={lot,bad:bad.map(u=>u.serial),items,count:d?d.count:'',remarks:d?d.remarks||'':'',paste:'',pasteCp:'Functional',pasteDefect:'',pasteAction:'',pasteStatus:'Reworked OK',saving:false};
  render(); window.scrollTo(0,0);
}
function reworkRowError(it){
  const lot=activeRework.lot;
  const e=validateSerial(it.serial,lot.model,lot.prodMonthCode,[],lot.prodMonthCode2||'');
  if(e) return e;
  if(!CHECKPOINTS.includes(it.checkpoint)) return 'Choose the check point';
  if(!String(it.defect||'').trim()) return 'Describe the defect';
  if(!String(it.action||'').trim()) return 'Describe the rework done';
  return '';
}
function reworkProblems(){
  const a=activeRework, p=[];
  const n=parseInt(a.count);
  if(!(n>=1)) p.push('Enter the number of units reworked');
  else if(n!==a.items.length) p.push(`Units reworked is ${n} but ${a.items.length} serial number${a.items.length===1?' is':'s are'} listed`);
  const missing=a.bad.filter(x=>!a.items.some(it=>it.serial===x));
  if(missing.length) p.push('Defective units missing from the list: '+missing.join(', '));
  const bad=a.items.map((it,i)=>[i,reworkRowError(it)]).filter(x=>x[1]);
  if(bad.length) p.push(`${bad.length} row${bad.length===1?'':'s'} need${bad.length===1?'s':''} attention`);
  const sn={}; a.items.forEach(it=>{ sn[it.serial]=(sn[it.serial]||0)+1; });
  const dups=Object.keys(sn).filter(k=>sn[k]>1); if(dups.length) p.push('Listed twice: '+dups.join(', '));
  return p;
}

      <td><select class="field rwF" data-i="${i}" data-f="status" aria-label="Unit status ${i+1}">${opt(UNIT_STATUSES,it.status)}</select></td>
      <td>${it.fromSample?'':`<button class="btn btn-ghost btn-sm rwDel" data-i="${i}" aria-label="Remove row ${i+1}">✕</button>`}${err?`<div class="err" style="font-size:11.5px;margin-top:2px">${esc(err)}</div>`:''}</td></tr>`;}).join('');

  <div class="main">

    <div class="card">
      <div class="form-2" style="max-width:640px">
        <div class="fg"><label class="lbl" for="rwCount">Number of units reworked</label><input id="rwCount" class="field mono" type="number" min="1" max="${esc(lot.lotSize)}" value="${esc(a.count)}" placeholder="e.g. 12"></div>
        <div class="fg"><span class="lbl">Serial numbers listed</span><div class="rw-count ${parseInt(a.count)===a.items.length?'text-pass':'text-warn'}">${a.items.length}</div></div>
      </div>
      <div class="bulk-box">
        <div class="bulk-head"><div><b>Bulk upload</b><div class="text-muted" style="font-size:13px">Upload an Excel (.xlsx) or CSV file with one row per reworked unit.</div></div>
          <div class="bulk-actions"><button id="btnRwTpl" class="btn btn-ghost btn-sm">Download template</button>
          <label class="btn btn-primary btn-sm" for="rwFile">Upload file</label><input id="rwFile" type="file" accept=".xlsx,.csv,.txt" class="sr-only"></div></div>
        ${a.upload?`<div class="bulk-result ${a.upload.bad.length?'has-bad':''}"><b>${esc(a.upload.file)}:</b> ${a.upload.added} unit${a.upload.added===1?'':'s'} added${a.upload.updated?`, ${a.upload.updated} updated`:''}${a.upload.bad.length?`, ${a.upload.bad.length} row${a.upload.bad.length===1?'':'s'} skipped`:''}.
          ${a.upload.bad.length?`<ul>${a.upload.bad.slice(0,15).map(b=>`<li>Row ${esc(b.row)}: ${esc(b.why)}</li>`).join('')}${a.upload.bad.length>15?`<li>and ${a.upload.bad.length-15} more</li>`:''}</ul>`:''}</div>`:''}
        <details class="bulk-guide"><summary>How to bulk upload</summary>
          <ol>
            <li>Click <b>Download template</b>. It opens in Excel with these columns: <b>Serial Number</b>, <b>Check Point</b>, <b>Defect</b>, <b>Rework Done</b>, <b>Unit Status</b>. The defective sample units are already in it.</li>
            <li>Add one row per reworked unit. Paste serial numbers into column A (it is set to Text, so all 15 digits stay). Pick Check Point (Aesthetic, General, Functional, Screen, Black dot) and Unit Status (Reworked OK or Scrapped) from the drop-downs.</li>
            <li>Save the file, then click <b>Upload file</b> and choose it. Rows are added to the list below; a serial already in the list is updated, not added twice.</li>
            <li>Empty Check Point, Defect, Rework Done or Status cells take the values in the boxes under "Add reworked units", so you can upload just a list of serial numbers.</li>
            <li>Check the list, enter the number of units reworked, then save.</li>
          </ol>
          <div class="text-muted" style="font-size:12.5px">Your own sheet works too if row 1 has headings like Serial, Check point, Defect, Rework, Status (any order). A CSV must keep serials as text; if Excel shows them as 1.21706E+14, format the column as Text before typing them.</div>
        </details>
      </div>
      <div class="lbl" style="margin:6px 0 8px">Add reworked units</div>
      <div class="rw-paste">
        <textarea id="rwPaste" class="field mono" rows="3" placeholder="Scan or paste serial numbers, one per line">${esc(a.paste)}</textarea>
        <div class="rw-paste-f">
          <select id="rwPCp" class="field" aria-label="Check point for these units">${opt(CHECKPOINTS,a.pasteCp)}</select>
          <input id="rwPDef" class="field" placeholder="Defect (same for all)" value="${esc(a.pasteDefect)}" maxlength="300">
          <input id="rwPAct" class="field" placeholder="Rework done (same for all)" value="${esc(a.pasteAction)}" maxlength="300">
          <select id="rwPSt" class="field" aria-label="Unit status">${opt(UNIT_STATUSES,a.pasteStatus)}</select>
          <button id="btnRwAdd" class="btn btn-ghost">Add to list</button>
        </div>
      </div>
      <div style="overflow-x:auto;margin-top:16px"><table class="res-table rw-table"><thead><tr><th>#</th><th>Serial number</th><th>Inspection check point</th><th>Defect</th><th>Rework done</th><th>Unit status</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="7" class="text-muted">No units listed yet.</td></tr>'}</tbody></table></div>
      <div class="fg" style="margin-top:14px"><label class="lbl" for="rwRemarks">Rework remarks</label><input id="rwRemarks" class="field" value="${esc(a.remarks)}" maxlength="500" placeholder="Optional"></div>
      ${probs.length?`<div class="rw-probs">${probs.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>`:''}
      <button id="btnRwSave" class="btn btn-primary" ${probs.length||a.saving?'disabled':''} style="margin-top:12px">${a.saving?'Saving…':'Save rework and reoffer lot'}</button>
      <div class="text-muted" style="font-size:12.5px;margin-top:8px">Scrapped units are saved but not reoffered. If fewer than ${esc(lot.sampleSize)} units can be picked, the remaining samples are scanned fresh from the lot during the reoffer inspection.</div>
    </div>
  </div>
  <footer class="pg-footer">LUMIO Quality Management - Projector</footer>
  </div>`;
}

// ─── INSPECTION ───────────────────────────────────────────
function buildInspection(){
  const lot=activeLot;
  const {minor,major,passed,filled,defective}=tallyLot();
  const allReady=filled===samples.length&&samples.every(s=>!s.serialError&&s.serial);
  // a defective sample puts the lot on hold straight away; samples started but not finished must be finished or cleared
  const holdReady=defective>0&&samples.every(s=>!s.serial||(!s.serialError&&sampleResult(s)!=='PENDING'));
  const firstBad=samples.findIndex(s=>sampleResult(s).startsWith('FAIL'));
  const round=lot.round||1;
  if(prevResults._lot!==lot.batchName+'|'+lot.lotNumber+'|'+round) prevResults={_lot:lot.batchName+'|'+lot.lotNumber+'|'+round};

  const slots=samples.map((s,i)=>{const r=sampleResult(s);const c=r==='PASS'?'s-pass':r==='FAIL-MINOR'?'s-minor':r==='FAIL-MAJOR'?'s-major':'';const tl=r==='PASS'?'pass':r==='FAIL-MINOR'?'minor fail':r==='FAIL-MAJOR'?'major fail':'not inspected yet';return `<button class="slot ${c}" data-i="${i}" title="Sample ${i+1}: ${tl}" aria-label="Go to sample ${i+1}, ${tl}">${i+1}</button>`;}).join('');
  let html=`<div class="page">
  <header class="hdr">
    <div class="hdr-left">
      <div class="logo"><img src="${LOGO_SRC}" alt="Lumio"></div>
      <div><div class="hdr-title">Sampling inspection</div>
        <div class="hdr-sub">${esc(lot.batchName)}</div>
      </div>
    </div>
    <div class="hdr-right">
      <span class="text-muted">${esc(user.name)}</span>
      ${themeToggleHtml()}
      <button id="btnBackInsp" class="btn btn-ghost btn-sm" title="Your progress is saved as a draft">← Back to batches</button>
    </div>
  </header>
  <div class="main">
  <section class="bench fade">
    <div>
      <div class="bench-title">${esc(lot.lotNumber)}${round>1?` <span class="badge badge-open" style="vertical-align:middle">Reoffer, round ${round}</span>`:''}</div>
      <div class="bench-sub">${esc(modelLabel(lot.model))} (serial code ${activeSpec?activeSpec.code:'?'}), production ${mmyyDisp(lot.prodMonthCode)}${lot.prodMonthCode2?' or '+mmyyDisp(lot.prodMonthCode2):''}<br>Lot of ${lot.lotSize} units, ${lot.sampleSize} samples. Black dot fails above ${activeSpec?activeSpec.maxD:'?'} mm.${serialPrefix(lot).length===8?`<br>Serials start with <b class="mono">${esc(serialPrefix(lot))}</b>: it is filled in for you, type the last 7 digits and press Enter.`:''}</div>
      <div class="verdict">
        <div><b>${filled}/${samples.length}</b>Inspected</div>
        <div><b class="${minor?'v-bad':''}">${minor}</b>Minor (0 allowed)</div>
        <div><b class="${major===0?'':'v-bad'}">${major}</b>Major (0 allowed)</div>
        <div><b class="${passed?'v-ok':'v-bad'}">${passed?'Passing':'On hold'}</b>Lot verdict</div>
      </div>
    </div>
    <div class="tray" style="--n:${samples.length}" role="group" aria-label="Sample tray">${slots}</div>
  </section>`;

  if(defective>0) html+=`<div class="hold-banner" role="alert"><b>Sample ${firstBad+1} is defective. The whole lot goes on hold.</b> Any defect holds the lot. Put it on hold now with the ${filled} sample${filled===1?'':'s'} inspected; then record the rework and the lot is reoffered.</div>`;
  const emptyRows=samples.filter(s=>!s.locked&&!s.serial).length;
  if(emptyRows) html+=`<details class="bulk-fill" ${bulkFillOpen?'open':''}><summary>Bulk fill serial numbers (${emptyRows} empty row${emptyRows===1?'':'s'})</summary>
    <div class="bulk-fill-body"><textarea id="bfText" class="field mono" rows="4" placeholder="Scan or paste serial numbers, one per line"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button id="btnBfGo" class="btn btn-primary btn-sm">Fill empty rows</button>
    <label class="btn btn-ghost btn-sm" for="bfFile">Upload Excel or CSV</label><input id="bfFile" type="file" accept=".xlsx,.csv,.txt" class="sr-only">
    <span class="text-muted" style="font-size:12.5px">Serials go into the empty rows in order and are checked like typed ones. The first column of the file is used (or a column headed Serial).</span></div></div></details>`;
  if(round>1&&!defective) html+=`<div class="reoffer-banner">Reoffer inspection, round ${round}. Serial numbers marked with a lock were picked for you (defective units from the last round first, then random reworked units) and cannot be changed.${samples.some(s=>!s.locked)?' Scan fresh units from the lot into the empty rows.':''}</div>`;
  html+=`<div class="samp-table">
  <div class="samp-head" style="padding:10px 16px;display:flex;align-items:center;gap:12px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)">
    <div style="width:30px;flex-shrink:0"></div>
    <div style="width:220px;flex-shrink:0">Serial number</div>
    <div style="flex-shrink:0">Checkpoints <span style="font-weight:400;color:var(--ink-3)">all pass by default, click one to mark it failed</span></div>
    <div style="flex:1"></div>
    <div style="width:104px;text-align:center;flex-shrink:0">Result</div>
  </div>`;

  samples.forEach((s,i)=>{
    const r=sampleResult(s);
    const rCls=r==='PASS'?'res-pass':r==='FAIL-MINOR'?'res-minor':r==='FAIL-MAJOR'?'res-major':'res-pending';
    const rLbl=r==='PASS'?'Pass':r==='FAIL-MINOR'?'Minor fail':r==='FAIL-MAJOR'?'Major fail':'Pending';
    const rBg=r==='PASS'?'background:var(--lime);color:var(--color-on-brand)':r==='FAIL-MINOR'?'background:var(--color-slot-minor);color:#1A1405':r==='FAIL-MAJOR'?'background:var(--color-danger-solid);color:#fff':'background:var(--sunk);color:var(--ink-3)';
    const bd=evalBD(s);
    const isExpanded=expandedSample===i;
    const hasBDIssue=!s.bdNoDot;
    const bdBtnCls=s.bdNoDot?'':(bd.ok?'bd-active-ok':'bd-active-fail');
    const bdBtnLabel=s.bdNoDot?'No dot':(s.bdVisible?(bd.incomplete?'Dot: finish':(bd.ok?'Dot OK':'Dot fail')):'Dot <2m view');

    const changed=prevResults[i]!==undefined&&prevResults[i]!==r; prevResults[i]=r;
    const ck=(f,l,kind)=>`<button class="mini-toggle ${s[f]?'mini-toggle-pass':'mini-toggle-fail'} sToggle" data-i="${i}" data-f="${f}" title="${l} (${kind}): click to mark ${s[f]?'failed':'passed'}" aria-pressed="${!s[f]}"><span class="mt-ic" aria-hidden="true">${s[f]?'✓':'✕'}</span>${l}</button>`;
    html+=`<div class="samp-row ${r.startsWith('FAIL')?'is-fail':r==='PASS'?'is-pass':''}" id="samp-row-${i}">
      <div class="samp-num-badge">${i+1}</div>

      <div class="samp-serial-wrap">
        <div class="serial-box"><input class="samp-serial-inp sSerial ${s.serialError?'err-field':''} ${s.locked?'locked':''}" data-i="${i}" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="${esc(s.serial)}" ${s.locked?'readonly title="Picked for the reoffer"':''} placeholder="Serial number" aria-label="Serial number of sample ${i+1}">
          ${s.locked?'<span class="serial-lock" aria-hidden="true">🔒</span>':`<span class="serial-count" data-c="${i}" aria-hidden="true">${s.serial?s.serial.length+'/15':''}</span>`}</div>
        ${s.serialError?`<div class="err" style="margin-top:3px">${esc(s.serialError)}</div>`:''}
      </div>

      <div class="samp-toggles">
        ${ck('aestheticPass','Aesthetic','minor')}${ck('generalPass','General','major')}${ck('funcPass','Functional','major')}${ck('screenPass','Screen','major')}
        <button class="samp-bd-toggle ${bdBtnCls} bdExpandBtn" data-i="${i}" title="Black dot: open the black dot check" aria-expanded="${isExpanded}">${bdBtnLabel}</button>
        <button class="samp-note-btn bdExpandBtn ${s.remark?'has-note':''}" data-i="${i}" title="${s.remark?'Note: '+esc(s.remark):'Add a note to this sample'}" aria-label="Note for sample ${i+1}">Note</button>
      </div>

      <div class="samp-spacer"></div>

      <span class="samp-result-tag ${changed?'tag-pop':''}" style="${rBg}">${rLbl}</span>

      ${isExpanded?`
      <div class="samp-expand">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px">
          <span class="lbl" style="margin-bottom:0">Black Dot Detail</span>
          <span class="text-muted" style="font-size:12px;font-family:var(--num)">${esc(specText(activeSpec))}</span>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px">
            <input type="checkbox" class="sBDNoDot" data-i="${i}" ${s.bdNoDot?'checked':''}> No Black Dot
          </label>
          ${!s.bdNoDot?`<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px">
            <input type="checkbox" class="sBDVis" data-i="${i}" ${s.bdVisible?'checked':''}> Visible at 2m
          </label>`:''}
        </div>
        ${!s.bdNoDot?`
        <div class="bd-grid">
          <div><label class="lbl">D (mm)</label><input class="field mono sBDF" data-i="${i}" data-f="bdD" type="number" step="0.01" value="${esc(s.bdD)}" placeholder="e.g. 1.2"></div>
          <div><label class="lbl">N (spots)</label><input class="field mono sBDF" data-i="${i}" data-f="bdN" type="number" value="${esc(s.bdN)}" placeholder="e.g. 2"></div>
          <div><label class="lbl">DS (mm)</label><input class="field mono sBDF" data-i="${i}" data-f="bdDS" type="number" step="0.1" value="${esc(s.bdDS)}" placeholder="e.g. 20"></div>
          <div><label class="lbl">Area</label>
            <select class="field mono sBDF" data-i="${i}" data-f="bdArea">
              <option value="A" ${s.bdArea==='A'?'selected':''}>Area A</option>
              <option value="B" ${s.bdArea==='B'?'selected':''}>Area B</option>
              <option value="A+B" ${s.bdArea==='A+B'?'selected':''}>Area A+B</option>
            </select></div>
          <div style="display:flex;align-items:flex-end">
            <div class="bd-result ${bd.ok?'bd-ok':'bd-fail'}" ${bd.incomplete?'style="background:var(--minor-bg);border-color:var(--minor-line);color:var(--minor)"':''}>${bd.incomplete?'… INCOMPLETE':(bd.ok?'✓ OK':'✗ FAIL')}<br>${bd.reason}</div>
          </div>
        </div>`:`<div class="text-pass" style="font-size:13px;font-family:var(--num)">✓ No Black Dot — Acceptable</div>`}
        <input class="samp-remark-inp sRemark" data-i="${i}" type="text" value="${esc(s.remark||'')}" placeholder="Note or defect description (optional)" aria-label="Note for sample ${i+1}">
      </div>`:''}
    </div>`;
  });

  html+=`</div>`;

  const segs=samples.map(x=>{const q=sampleResult(x);return `<i class="${q==='PASS'?'g-pass':q==='FAIL-MINOR'?'g-minor':q==='FAIL-MAJOR'?'g-major':''}"></i>`;}).join('');
  html+=`<div class="insp-footer">
    <div class="insp-prog" aria-hidden="true">${segs}</div>
    <div class="insp-tally">
      <div>Samples filled: <b class="${filled===samples.length?'t-ok':'t-warn'}">${filled}/${samples.length}</b></div>
      <div>Defective samples: <b class="${defective?'t-fail':'t-ok'}">${defective} / 0 allowed</b></div>
      <div>Lot verdict: <b class="${passed?'t-ok':'t-fail'}">${passed?'✓ PASS':'HOLD'}</b></div>
      <div class="text-muted" id="draftAt">${draftSavedAt?'Draft saved '+draftSavedAt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <input id="lotRemarks" class="field" type="text" style="width:260px" value="${esc(lotRemarksVal)}" placeholder="General lot remarks (optional)">
      ${defective?`<button id="btnSubmitLot" class="btn btn-danger" ${holdReady?'':'disabled'} style="min-width:200px">${holdReady?`Put lot on hold (${defective} defective)`:'Finish the started samples first'}</button>`
      :`<button id="btnSubmitLot" class="btn ${allReady?'btn-primary':''}" ${allReady?'':'disabled'} style="min-width:200px">${allReady?'✓ Submit Lot — PASS':`Complete all ${samples.length} samples to submit`}</button>`}
    </div>
  </div>

  </div>
  <footer class="pg-footer">LUMIO Quality Management - Projector</footer>
  </div>`;
  return html;
}

// ═══════════════════════════════════════════════════════════
// EVENT BINDING
// ═══════════════════════════════════════════════════════════
function bindEvents(){
  // Setup
  const bs=document.getElementById('btnSetup');
  if(bs) bs.onclick=()=>{ const v=document.getElementById('apiInput').value.trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(v)){ toast('Paste the Apps Script web app URL (https://script.google.com/macros/s/…/exec)','err'); return; }
    API=v; localStorage.setItem('oba_api',v); render(); };

  // Login
  const bl=document.getElementById('btnLogin');
  if(bl) bl.onclick=async()=>{
    const u=document.getElementById('lUser').value.trim();
    const p=document.getElementById('lPass').value.trim();
    const err=document.getElementById('lErr');
    err.classList.add('hidden');
    try{
      const r=await api('login',{username:u,password:p});
      if(r.ok){
        user={username:r.username,role:r.role,name:r.name,access:Array.isArray(r.access)?r.access:['bomverify','sampling']};
        session={token:r.token,expiresAt:r.expiresAt,partdbUrl:r.partdbUrl||'',bomSheetUrl:r.bomSheetUrl||''};
        routeFromHash(); introDone=false; saveSession();
        render(); // show dashboard immediately
        loadAll().then(()=>render()); // load batches + models in background
      }
      else{
        err.textContent=r.error||'Login failed';
        err.classList.remove('hidden');
        if((r.error||'').includes('Apps Script')||(r.error||'').includes('redeployed')){
          err.innerHTML=esc(r.error)+'<br><br><b>Fix:</b> In Apps Script → Deploy → Manage deployments → pencil icon → New version → Deploy. Then copy the new URL here.';
        }
      }
    }catch(e){ err.textContent='Network error: '+e.message; err.classList.remove('hidden'); }
  };
  const lp=document.getElementById('lPass');
  if(lp) lp.onkeydown=e=>{ if(e.key==='Enter') document.getElementById('btnLogin')?.click(); };

  const bcu=document.getElementById('btnChgUrl');
  if(bcu) bcu.onclick=()=>{ API=''; localStorage.removeItem('oba_api'); render(); };

  // Logout
  const blo=document.getElementById('btnLogout');
  if(blo) blo.onclick=()=>{ if(session&&session.token) api('logout'); resetApp(); render(); };
  // Theme toggle
  document.querySelectorAll('.themeToggle').forEach(b=>{ b.onclick=()=>{
    const d=!isDark(); document.documentElement.classList.toggle('theme-dark',d);
    try{ localStorage.setItem('lqm_theme',d?'dark':'light'); }catch(e){}
    document.querySelectorAll('.themeToggle').forEach(x=>{ x.setAttribute('aria-pressed',String(d)); x.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme'); x.title=d?'Light theme':'Dark theme'; });
  }; });
  // Hero actions + lot map
  document.querySelectorAll('.heroJump').forEach(b=>{ b.onclick=()=>{ view.batch=b.getAttribute('data-batch'); view.status='all'; view.q=''; selLot=null; go('batches',()=>document.querySelector('.flow')?.scrollIntoView({behavior:'smooth',block:'center'})); }; });
  document.querySelectorAll('.lmCell').forEach(b=>{ b.onclick=()=>{
    const lot=batches[parseInt(b.getAttribute('data-ri'))]; if(!lot) return;
    view.batch=lot.batchName; view.status='all'; view.q=''; selLot=lot.batchName+'||'+lot.lotNumber;
    if(!lotUnits[selLot]) loadLotUnits(lot);
    go('batches',()=>document.querySelector('.lot-detail')?.scrollIntoView({behavior:'smooth',block:'center'}));
  }; });
  if(document.querySelector('.main.intro')) setTimeout(()=>{ introDone=true; },1200);

  // Admin navigation
  document.querySelectorAll('.navGo').forEach(b=>{ b.onclick=()=>{ document.getElementById('appShell')?.classList.remove('sb-open'); go(b.getAttribute('data-go')); }; });
  const sbc=document.getElementById('btnSbCollapse');
  if(sbc) sbc.onclick=()=>{ sbCollapsed=!sbCollapsed; try{ localStorage.setItem('lqm_sb',sbCollapsed?'1':'0'); }catch(e){} const a=document.getElementById('appShell'); a.classList.toggle('sb-c',sbCollapsed); sbc.setAttribute('aria-label',sbCollapsed?'Expand sidebar':'Collapse sidebar'); sbc.title=sbCollapsed?'Expand sidebar':'Collapse sidebar'; setTimeout(()=>{ sbIndY=null; placeSbInd(); },300); };
  const sbo=document.getElementById('btnSbOpen'); if(sbo) sbo.onclick=()=>document.getElementById('appShell').classList.add('sb-open');
  const sbs=document.getElementById('sbScrim'); if(sbs) sbs.onclick=()=>document.getElementById('appShell').classList.remove('sb-open');
  const kbb=document.getElementById('btnKbar'); if(kbb) kbb.onclick=()=>kpOpen();
  placeSbInd();
  document.querySelectorAll('.toolCard').forEach(b=>{ b.onclick=()=>go('bom/'+b.getAttribute('data-k')); });

  // Refresh
  ['btnRefresh','btnRefreshMenu'].forEach(id=>{ const br=document.getElementById(id);
    if(br) br.onclick=async()=>{ lotUnits={}; bxClear(); await loadAll(true); render(); toast('Refreshed'); }; });

  // Create Batch
  const bcb=document.getElementById('btnCreateBatch');
  if(bcb) bcb.onclick=async()=>{
    const batchName=document.getElementById('bName').value.trim();
    const batchQty=parseInt(document.getElementById('bQty').value)||0;
    const model=document.getElementById('bModel').value;
    const month=document.getElementById('bMonth').value;
    const month2=document.getElementById('bMonth2')?document.getElementById('bMonth2').value:'';
    const msgEl=document.getElementById('createMsg');
    if(!batchName){ toast('Enter Batch Name','err'); return; }
    if(batchQty<1){ toast('Enter Batch Quantity > 0','err'); return; }
    if(!getModel(model)){ toast('Add a model first','err'); return; }
    const prodMonthCode=month?mmyy(month):'';
    const prodMonthCode2=month2?mmyy(month2):'';
    msgEl.textContent='Creating lots…'; msgEl.classList.remove('hidden');
    try{
      const r=await api('createBatch',{batchName,batchQty,model,prodMonthCode,prodMonthCode2});
      if(r.ok){
        const lots=r.lotsCreated;
        const rem=batchQty%90;
        msgEl.innerHTML=`✓ <b>${esc(batchName)}</b>: <b>${esc(lots)} lots</b> created.<br>
          Batch Qty: <b>${batchQty}</b> | Each lot: 90 units | Sample: 13${rem>0?`<br>Last lot: ${rem} units (still 13 samples)`:''}`;
        msgEl.classList.remove('hidden');
        document.getElementById('bName').value='';

        const rowNo=ix+(head.length?2:1);
        const sn=String(r[cS]||'').trim().toUpperCase().replace(/\s+/g,'');
        if(!sn&&r.every(x=>!String(x||'').trim())) return;
        if(/E\+?\d+$/i.test(String(r[cS]||''))){ res.bad.push({row:rowNo,why:'serial shown as a number in scientific format; format the column as Text'}); return; }
        const e=validateSerial(sn,lot.model,lot.prodMonthCode,[],lot.prodMonthCode2||'');
        if(e){ res.bad.push({row:rowNo,why:(sn||'(blank)')+': '+e}); return; }
        const cp=cC>-1?matchCheckpoint(r[cC]):'';
        if(cp===null){ res.bad.push({row:rowNo,why:sn+': check point "'+r[cC]+'" is not one of '+CHECKPOINTS.join(', ')}); return; }
        const st=cT>-1?matchStatus(r[cT]):'';
        if(st===null){ res.bad.push({row:rowNo,why:sn+': unit status "'+r[cT]+'" must be Reworked OK or Scrapped'}); return; }
        const vals={checkpoint:cp||a.pasteCp, defect:(cD>-1&&String(r[cD]||'').trim())||a.pasteDefect, action:(cA>-1&&String(r[cA]||'').trim())||a.pasteAction, status:st||a.pasteStatus};
        const ex=a.items.find(it=>it.serial===sn);
        if(ex){ if(ex.fromSample){ ex.checkpoint=vals.checkpoint||ex.checkpoint; ex.defect=vals.defect||ex.defect; ex.action=vals.action||ex.action; ex.status=vals.status||ex.status; } else Object.assign(ex,vals); res.updated++; }
        else { a.items.push({serial:sn,...vals}); res.added++; }
      });
      a.upload=res; rf.value='';
      if(!(parseInt(a.count)>=1)) a.count=String(a.items.length);
      toast(`${res.added} added${res.updated?`, ${res.updated} updated`:''}${res.bad.length?`, ${res.bad.length} skipped`:''}`, res.bad.length?'err':'ok');
      rr();
    };
    const add=document.getElementById('btnRwAdd'); if(add) add.onclick=()=>{
      const sns=(a.paste.toUpperCase().match(/[A-Z0-9]{6,40}/g)||[]);
      if(!sns.length){ toast('Scan or paste at least one serial number','err'); return; }
      let added=0, skipped=0;
      sns.forEach(sn=>{ if(a.items.some(it=>it.serial===sn)){ skipped++; return; } a.items.push({serial:sn,checkpoint:a.pasteCp,defect:a.pasteDefect,action:a.pasteAction,status:a.pasteStatus}); added++; });
      a.paste=''; toast(`${added} unit${added===1?'':'s'} added${skipped?`, ${skipped} already listed`:''}`); rr();
    };
    const save=document.getElementById('btnRwSave'); if(save) save.onclick=async()=>{
      if(reworkProblems().length) return;
      const lot=a.lot;
      if(!confirm(`Save rework for ${lot.lotNumber} (${a.items.length} units) and reoffer the lot?`)) return;
      a.saving=true; render();
      const r=await api('recordRework',{batchName:lot.batchName,lotNumber:lot.lotNumber,unitsReworked:parseInt(a.count),remarks:a.remarks,
        items:a.items.map(it=>({serial:it.serial,checkpoint:it.checkpoint,defect:it.defect,action:it.action,status:it.status}))});
      a.saving=false;
      if(r.ok){
        try{ localStorage.removeItem(reworkDraftKey(lot)); }catch(e){}
        activeRework=null; lotUnits={};
        toast(`Rework saved. ${lot.lotNumber} is reoffered with ${r.reoffer.length} units picked${r.fresh?`, ${r.fresh} to scan fresh`:''}.`);
        await loadBatches();
        view.batch=lot.batchName; view.status='all'; view.q=''; selLot=lot.batchName+'||'+lot.lotNumber;
        const nl=batches.find(l=>l.batchName===lot.batchName&&l.lotNumber===lot.lotNumber); if(nl) loadLotUnits(nl);
        go('batches',()=>document.querySelector('.lot-detail')?.scrollIntoView({block:'center'}));
      } else { render(); toast(r.error||'Save failed','err'); }
    };
  }

  // Submit Lot
  const bsub=document.getElementById('btnSubmitLot');
  if(bsub) bsub.onclick=async()=>{
    const {passed,defective}=tallyLot();
    const lotResult=defective?'HOLD':'PASS';
    if(lotResult==='HOLD'&&!confirm(`Put ${activeLot.lotNumber} on hold?\n\n${defective} defective sample${defective===1?'':'s'} found. The inspected samples are saved and the lot waits for rework.`)) return;
    const fgPassQty=passed?Number(activeLot.lotSize):0;
    const lotRemarks=lotRemarksVal;
    const toSend=lotResult==='HOLD'?samples.filter(s=>sampleResult(s)!=='PENDING'):samples;
    const units=toSend.map(s=>{
      const bd=evalBD(s);
      const r=sampleResult(s);
      const fails=[];
      if(!s.aestheticPass) fails.push('Aesthetic Fail (Minor)');
      if(!s.generalPass)   fails.push('General Fail (Major)');
      if(!s.funcPass)      fails.push('Functional Fail (Major)');
      if(!s.screenPass)    fails.push('Screen Fail (Major)');
      if(!bd.ok)           fails.push('Black Dot Fail (Major): '+bd.reason);
      return{
        serial:s.serial,
        aes:s.aestheticPass?'Pass':'Fail',
        general:s.generalPass?'Pass':'Fail',
        func:s.funcPass?'Pass':'Fail',
        screen:s.screenPass?'Pass':'Fail',
        bd:s.bdNoDot?'No BD':(s.bdVisible?bd.reason:'Not visible @2m'),
        remark:fails.length?fails.join(' | '):(s.remark||lotRemarks||'OK'),
        sampleResult:r==='PASS'?'Pass':'Fail',
        bdIn:{noDot:!!s.bdNoDot,visible:!!s.bdVisible,D:s.bdD,N:s.bdN,DS:s.bdDS,area:s.bdArea||'A'},
        inspectedAt: s.inspectedAt || new Date().toISOString()
      };
    });

    const r=await api('submitLot',{
      inspector:user.name,
      batchName:activeLot.batchName,
      lotNumber:activeLot.lotNumber,
      lotResult,fgPassQty,
      bdSpec:specText(activeSpec),
      batchQty:activeLot.batchQty,
      totalLots:activeLot.totalLots,
      model:activeLot.model,
      prodMonthCode:activeLot.prodMonthCode,
      units
    });

    if(r.ok){
      clearDraft(activeLot);
      const done=activeLot;
      toast(lotResult==='HOLD'?`${done.lotNumber} is on hold. Record the rework to reoffer it.`:`${done.lotNumber}: PASS | FG released: ${fgPassQty}`, lotResult==='HOLD'?'err':'ok');
      activeLot=null; activeSpec=null; samples=[]; expandedSample=null; lotUnits={};
      await loadBatches();
      if(lotResult==='HOLD'){ view.batch=done.batchName; view.status='all'; view.q=''; selLot=done.batchName+'||'+done.lotNumber; const nl=batches.find(l=>l.batchName===done.batchName&&l.lotNumber===done.lotNumber); if(nl) loadLotUnits(nl); go('batches',()=>document.querySelector('.lot-detail')?.scrollIntoView({block:'center'})); offerHoldDefects(done,units); }
      else render();
    } else { saveDraft(); toast(r.error||'Save failed — draft kept locally','err'); }
  };
}

function csvCell(v){
  let t=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(t)) t="'"+t;       // spreadsheet apps must not run it as a formula
  return '"'+t.replace(/"/g,'""')+'"';
}
function downloadCSV(){
  const groups=groupBatches();
  const rows=[['LUMIO Quality Management - Projector, inspection report'],[`Generated: ${new Date().toLocaleString()}`],[],
    ['BatchName','LotNumber','Model','ProdMonth','BatchQty','LotSize','SampleSize','Status','Result','FGPassQty']];
  groups.forEach(g=>g.lots.forEach(l=>rows.push([l.batchName,l.lotNumber,l.model||'-',mmyyDisp(l.prodMonthCode),l.batchQty,l.lotSize,l.sampleSize,l.status,l.result||'Pending',l.fgPassQty||0])));
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\ufeff'+csv);
  a.download=`LUMIO_QM_Report_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

      <div class="stat"><div class="stat-label">Lots Failed</div><div class="stat-val" style="color:${failLots>0?'var(--fail)':'var(--ink-3)'}">${failLots}</div></div>
      <div class="stat"><div class="stat-label">Pending Lots</div><div class="stat-val" style="color:var(--minor)">${pendLots}</div></div>
      <div class="stat"><div class="stat-label">FG Released</div><div class="stat-val text-pass">${fgAll}</div><div class="stat-sub">of ${totalBatchQty} units</div></div>
      <div class="stat"><div class="stat-label">Yield Rate</div><div class="stat-val" style="color:var(--open)">${doneLots>0?((passLots/doneLots)*100).toFixed(1):0}%</div></div>

  groups.forEach(g=>{
    const pct=g.totalLots>0?Math.round(g.completed/g.totalLots*100):0;
    const fgPct=g.batchQty>0?Math.round(g.fgTotal/g.batchQty*100):0;
    html+=`
    <div class="batch-group" style="margin-bottom:20px">
      <div style="padding:14px 18px;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-size:14px;font-weight:700;color:var(--ink);font-family:var(--num)">${esc(g.name)}</div>
            <div style="font-size:12.5px;color:var(--ink-3);font-family:var(--num);margin-top:3px">
              Model: <b style="color:var(--ink-2)">${esc(g.model||'-')}</b> &nbsp;|&nbsp;
              Prod Month: <b style="color:var(--ink-2)">${mmyyDisp(g.prodMonthCode)}${g.prodMonthCode2?' / '+mmyyDisp(g.prodMonthCode2):''}</b> &nbsp;|&nbsp;
              Batch Qty: <b style="color:var(--ink-2)">${esc(g.batchQty)}</b> &nbsp;|&nbsp;
              Total Lots: <b style="color:var(--ink-2)">${g.totalLots}</b>
            </div>
          </div>
          <div style="display:flex;gap:16px;flex-wrap:wrap">
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Completed</div><div style="font-size:18px;font-weight:700;color:var(--ink)">${g.completed}/${g.totalLots}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Pass</div><div style="font-size:18px;font-weight:700;color:var(--pass)">${g.passLots}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Fail</div><div style="font-size:18px;font-weight:700;color:${g.failLots>0?'var(--fail)':'var(--ink-3)'}">${g.failLots}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">FG Released</div><div style="font-size:18px;font-weight:700;color:var(--pass)">${g.fgTotal}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Pending</div><div style="font-size:18px;font-weight:700;color:var(--minor)">${g.pending}</div></div>
          </div>
        </div>
        <div style="margin-top:10px;display:flex;gap:16px;flex-wrap:wrap">
          <div style="flex:1;min-width:160px">
            <div style="font-size:12px;color:var(--ink-3);margin-bottom:3px">Lot Progress (${pct}%)</div>
            <div style="background:var(--line);border-radius:4px;height:6px;overflow:hidden"><div style="background:var(--lime);height:100%;width:${pct}%"></div></div>
          </div>
          <div style="flex:1;min-width:160px">
            <div style="font-size:12px;color:var(--ink-3);margin-bottom:3px">FG Release (${fgPct}%)</div>
            <div style="background:var(--line);border-radius:4px;height:6px;overflow:hidden"><div style="background:var(--pass);height:100%;width:${fgPct}%"></div></div>
          </div>
        </div>
      </div>

      <!-- LOT WISE TABLE -->
      <div style="overflow-x:auto">
        <table class="summ-table" style="width:100%;border-collapse:collapse;font-size:13px;font-family:var(--num)">
          <thead>
            <tr style="background:var(--sunk);color:var(--ink-3);font-size:12px">
              <th style="padding:8px 14px;text-align:left;border-bottom:1px solid var(--line)">#</th>
              <th style="padding:8px 14px;text-align:left;border-bottom:1px solid var(--line)">Lot Number</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Lot Size</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Sample</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Status</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Result</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">FG Qty</th>

    `;
    g.lots.forEach((lot,idx)=>{

      const stBg=lot.status==='Open'?'background:var(--open-bg);color:var(--open)':'background:var(--line);color:var(--ink-3)';
      html+=`<tr style="border-bottom:1px solid var(--paper);${idx%2===0?'':'background:var(--paper)'}">

        <td style="padding:8px 14px;color:var(--ink);font-weight:700">${esc(lot.lotNumber)}</td>
        <td style="padding:8px 10px;text-align:center;color:var(--ink-2)">${esc(lot.lotSize)}</td>
        <td style="padding:8px 10px;text-align:center;color:var(--ink-2)">${esc(lot.sampleSize)}</td>
        <td style="padding:8px 10px;text-align:center"><span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;${stBg}">${esc(lot.status)}</span></td>
        <td style="padding:8px 10px;text-align:center">${lot.result?`<span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;${resBg}">${esc(lot.result)}</span>`:'<span style="color:var(--ink-3)">—</span>'}</td>
        <td style="padding:8px 10px;text-align:center;font-weight:700;color:${lot.fgPassQty>0?'var(--pass)':'var(--ink-3)'}">${lot.fgPassQty>0?esc(lot.fgPassQty):'—'}</td>
      </tr>`;
    });
    html+=`<tr style="background:var(--sunk);font-weight:700">
      <td colspan="6" style="padding:8px 14px;color:var(--ink-2);text-align:right">Batch Total FG Released:</td>
      <td style="padding:8px 10px;text-align:center;color:var(--pass);font-weight:700">${g.fgTotal}</td>
    </tr>`;
    html+=`</tbody></table></div></div>`;
  });

  document.getElementById('summaryContent').innerHTML=html;
  const bpr=document.getElementById('btnPrint'); if(bpr) bpr.onclick=()=>window.print();
  // Copy logo src
  const mainLogo=document.querySelector('.logo img');
  const summLogo=document.getElementById('summLogoImg');
  if(mainLogo && summLogo) summLogo.src=mainLogo.src;

  document.getElementById('app').classList.add('hidden');
  document.getElementById('summaryScreen').classList.remove('hidden');
}

window.addEventListener('beforeunload', ()=>{
  if(activeLot && samples.length) saveDraft();
  if(activeBom) saveBomDraft();
});

// Dropdown menus: click to open, click outside or Escape to close, arrow keys to move
function closeMenus(except){ document.querySelectorAll('.dd.open').forEach(d=>{ if(d!==except){ d.classList.remove('open'); d.querySelector('.ddBtn')?.setAttribute('aria-expanded','false'); } }); }
document.addEventListener('click',e=>{
  const b=e.target.closest('.ddBtn');
  if(!b){ if(!e.target.closest('.dd-menu')||e.target.closest('.dd-item')) closeMenus(); return; }
  const d=b.closest('.dd'); closeMenus(d);
  const o=d.classList.toggle('open'); b.setAttribute('aria-expanded',String(o));
});
document.addEventListener('keydown',e=>{
  const d=document.querySelector('.dd.open'); if(!d) return;
  if(e.key==='Escape'){ closeMenus(); d.querySelector('.ddBtn')?.focus(); return; }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const items=[...d.querySelectorAll('.dd-item')]; if(!items.length) return; e.preventDefault();
    let i=items.indexOf(document.activeElement); i=e.key==='ArrowDown'?(i+1)%items.length:(i<=0?items.length-1:i-1); items[i].focus();
  }
});
if(API && restoreSession()){ routeFromHash(); render(); loadAll().then(()=>render()); } else render();
