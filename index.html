<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IS2500 OBA Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F2F4F1">
<style>
/* ── Tokens: inspection bench ─────────────────────────── */
:root{
  --paper:#F2F4F1;  --panel:#FFFFFF;  --sunk:#EAEDE8;
  --line:#DCE1DA;   --line-strong:#C3CAC0;
  --ink:#151A16;    --ink-2:#4B554D;  --ink-3:#768078;
  --lime:#82D11C;   --lime-deep:#4E8F0A;
  --pass:#2E7A12;   --pass-bg:#E8F5DB;  --pass-line:#B9DE90;
  --minor:#946000;  --minor-bg:#FFF1D2; --minor-line:#EBC984;
  --fail:#C23321;   --fail-bg:#FBE6E2;  --fail-line:#EFB4A9; --fail-row:#FDF5F3;
  --open:#24569E;   --open-bg:#E6EDF8;  --open-line:#BBCCE7;
  --ui:'Barlow',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --num:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --code:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);min-height:100vh;font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid var(--paper)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes slotIn{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
.fade{animation:fadeIn .2s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Layout ───────────────────────────────────────────── */
.page{min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.hdr-left{display:flex;align-items:center;gap:16px;min-width:0}
.logo{display:flex;align-items:center;padding-right:16px;border-right:1px solid var(--line)}
.logo img{height:26px;width:auto;display:block}
.hdr-title{font-family:var(--num);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.005em;line-height:1.1}
.hdr-sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.main{flex:1;max-width:1320px;width:100%;margin:0 auto;padding:24px}

/* ── Panels ───────────────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.card-title{font-family:var(--num);font-size:19px;font-weight:700;color:var(--ink);margin-bottom:16px;letter-spacing:-.005em}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:16px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}

/* ── Form ─────────────────────────────────────────────── */
.fg{margin-bottom:14px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field{width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-size:15px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;min-height:42px}
.field::placeholder{color:#A3ABA4}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(130,209,28,.35)}
.field.err-field{border-color:var(--fail);box-shadow:0 0 0 3px rgba(194,51,33,.12)}
select.field{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

/* ── Buttons ──────────────────────────────────────────── */
.btn{border:1px solid transparent;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;padding:10px 18px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s,color .15s}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#2C352E}
.btn-danger{background:var(--fail);color:#fff}
.btn-danger:hover{background:#A82917}
.btn-ghost{background:var(--panel);color:var(--ink);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn-full{width:100%}
.btn:disabled{background:var(--sunk);color:var(--ink-3);border-color:var(--line);cursor:not-allowed}

/* ── Status chips ─────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-open{background:var(--open-bg);color:var(--open);border-color:var(--open-line)}
.badge-closed{background:var(--sunk);color:var(--ink-2);border-color:var(--line)}
.badge-pass{background:var(--pass-bg);color:var(--pass);border-color:var(--pass-line)}
.badge-fail{background:var(--fail-bg);color:var(--fail);border-color:var(--fail-line)}

/* ── Stats ────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--panel);padding:16px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat-label{font-size:13px;font-weight:600;color:var(--ink-2)}
.stat-val{font-family:var(--num);font-size:34px;font-weight:700;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat-sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}

/* ── Batches ──────────────────────────────────────────── */
.batch-group{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.batch-hdr{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.batch-name{font-family:var(--num);font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.batch-meta{font-size:13px;color:var(--ink-3);margin-top:4px;line-height:1.7}
.batch-meta b{color:var(--ink);font-weight:600}
.lot-strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px;max-width:640px}
.lot-cell{width:14px;height:14px;border-radius:3px;background:var(--sunk);border:1px solid var(--line-strong)}
.lot-cell.c-pass{background:var(--lime);border-color:var(--lime-deep)}
.lot-cell.c-fail{background:var(--fail);border-color:#8E2214}
.lot-cell.c-open{background:var(--panel);border-color:var(--open)}
.lot-row{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.lot-row:last-child{border-bottom:none}
.lot-row:hover{background:#FAFBF9}
.lot-name{font-size:15px;font-weight:600;color:var(--ink)}
.lot-meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.lot-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.progress-bar{background:var(--sunk);border-radius:99px;height:8px;overflow:hidden;min-width:80px}
.progress-fill{background:var(--lime);height:100%;transition:width .4s;border-radius:99px}

/* ── Inspection: sample tray (signature) ──────────────── */
.bench{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:16px}
.bench-title{font-family:var(--num);font-size:24px;font-weight:700;letter-spacing:-.01em}
.bench-sub{font-size:13px;color:#AEB8AF;margin-top:3px;line-height:1.6}
.tray{display:grid;grid-template-columns:repeat(var(--n,13),34px);gap:5px;padding:8px;background:#232A24;border-radius:10px;border:1px solid #39423A}
.slot{height:40px;border-radius:5px;background:#2E362F;border:1px dashed #56605A;color:#8D978F;font-family:var(--num);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.slot:hover{border-color:#fff;color:#fff}
.slot.s-pass{background:var(--lime);border:1px solid var(--lime);color:var(--ink);animation:slotIn .25s ease}
.slot.s-minor{background:#F2B33D;border:1px solid #F2B33D;color:var(--ink);animation:slotIn .25s ease}
.slot.s-major{background:#E2533F;border:1px solid #E2533F;color:#fff;animation:slotIn .25s ease}
.verdict{display:flex;gap:18px;align-items:flex-end;margin-top:10px;font-size:13px;color:#AEB8AF}
.verdict b{font-family:var(--num);font-size:20px;color:#fff;display:block;line-height:1}
.verdict .v-ok{color:var(--lime)}.verdict .v-bad{color:#FF8A78}.verdict .v-warn{color:#F2B33D}

/* ── Inspection rows ─────────────────────────────────── */
.samp-table{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.samp-row{border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;scroll-margin-top:90px}
.samp-row:last-child{border-bottom:none}
.samp-row.is-fail{background:var(--fail-row)}
.samp-row.flash{box-shadow:inset 4px 0 0 var(--lime)}
.samp-num-badge{width:30px;height:30px;border-radius:6px;background:var(--sunk);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:15px;font-weight:700;flex-shrink:0}
.samp-serial-wrap{width:220px;flex-shrink:0}
.samp-serial-inp{width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);outline:none;font-family:var(--code);letter-spacing:.02em;min-height:38px}
.samp-serial-inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(130,209,28,.35)}
.samp-serial-inp.err-field{border-color:var(--fail)}
.samp-toggles{display:flex;gap:5px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.mini-toggle{padding:0 10px;height:36px;border-radius:7px;border:1px solid;font-size:13px;font-weight:600;cursor:pointer;min-width:52px;text-align:center;transition:background .12s,color .12s}
.mini-toggle-pass{background:var(--panel);color:var(--ink-2);border-color:var(--line-strong)}
.mini-toggle-pass:hover{border-color:var(--ink);color:var(--ink)}
.mini-toggle-fail{background:var(--fail);color:#fff;border-color:var(--fail)}
.samp-bd-toggle{padding:0 12px;height:36px;border-radius:7px;border:1px dashed var(--line-strong);background:var(--panel);color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.samp-bd-toggle.bd-active-ok{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass-line)}
.samp-bd-toggle.bd-active-fail{background:var(--fail);color:#fff;border:1px solid var(--fail)}
.samp-spacer{flex:1}
.samp-result-tag{font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:7px;white-space:nowrap;width:104px;text-align:center;flex-shrink:0}
.samp-expand{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:4px}
.samp-remark-inp{width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ink);outline:none;margin-top:10px}
.samp-remark-inp:focus{border-color:var(--ink)}
.bd-box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.bd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:10px}
.bd-result{padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.5}
.bd-ok{background:var(--pass-bg);border:1px solid var(--pass-line);color:var(--pass)}
.bd-fail{background:var(--fail-bg);border:1px solid var(--fail-line);color:var(--fail)}
.res-pass{color:var(--pass)}.res-minor{color:var(--minor)}.res-major{color:var(--fail)}.res-pending{color:var(--ink-3)}
.insp-footer{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;position:sticky;bottom:12px;box-shadow:0 8px 24px rgba(21,26,22,.08)}
.insp-tally{font-size:14px;line-height:1.5;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 22px}
.insp-tally b{color:var(--ink)}
.insp-tally .t-ok{color:var(--pass)}.insp-tally .t-warn{color:var(--minor)}.insp-tally .t-fail{color:var(--fail)}

/* ── Toast ────────────────────────────────────────────── */
.toast{position:fixed;top:16px;right:16px;z-index:9999;padding:12px 18px 12px 16px;border-radius:10px;font-size:14px;font-weight:600;color:#fff;background:var(--ink);border-left:5px solid var(--lime);animation:fadeIn .2s ease;pointer-events:none;box-shadow:0 10px 30px rgba(21,26,22,.2);max-width:380px}
.toast-ok{border-left-color:var(--lime)}.toast-err{border-left-color:#FF6A55}

/* ── Utilities ────────────────────────────────────────── */
.hidden{display:none!important}
.text-muted{color:var(--ink-3);font-size:13px}
.text-pass{color:var(--pass)}.text-fail{color:var(--fail)}.text-warn{color:var(--minor)}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
.err{color:var(--fail);font-size:12.5px;margin-top:4px}
.info-banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--lime);border-radius:10px;padding:14px 18px;font-size:13.5px;color:var(--ink-2);line-height:1.75;margin-bottom:16px}
.info-banner b{color:var(--ink)}
footer.pg-footer{padding:18px;text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:24px}
table th{font-weight:600}

@media (max-width:760px){
  .main{padding:14px}
  .hdr{padding:10px 14px}
  .logo{border-right:none;padding-right:0}
  .bench{grid-template-columns:1fr}
  .tray{grid-template-columns:repeat(7,1fr)}
  .samp-serial-wrap{width:100%}
  .samp-spacer{display:none}
  .stat{border-right:none;border-bottom:1px solid var(--line)}
  .insp-footer{position:static}
  .samp-head{display:none!important}
  .samp-serial-wrap{width:calc(100% - 42px)}
}
@media print{
  .hdr-right,.btn{display:none!important}
  body{background:#fff!important}
  .stat,.batch-group,.summ-table{break-inside:avoid}
  #summaryScreen{display:block!important}
  #app{display:none!important}
}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let API = localStorage.getItem('oba_api')||'';
let user = null;          // {username,role,name}
let batches = [];         // all batch/lot rows from backend
let activeLot = null;     // lot object being inspected
let samples = [];         // array of sample state objects
let expandedSample = null; // index of sample with expanded BD/remark panel open
let toastTimer = null;

let models = [];            // loaded from backend "Models" sheet — managed by admin
let activeSpec = null;      // Black Dot spec of the model being inspected
let editingModel = null;    // name of model being edited in admin panel
let lotRemarksVal = '';     // lot remarks kept across re-renders
const LOT_SIZE   = 90;
const SAMPLE_N   = 13;

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function mmyy(s){ if(!s)return''; const[y,m]=s.split('-'); return m+y.slice(2); }
function mmyyDisp(c){ if(!c||c.length!==4)return'-'; return c.slice(0,2)+'/20'+c.slice(2); }
function mmyyInp(c){ if(!c||c.length!==4)return''; return'20'+c.slice(2)+'-'+c.slice(0,2); }

// ═══════════════════════════════════════════════════════════
// DRAFT AUTO-SAVE (so in-progress inspections survive refresh/close)
// ═══════════════════════════════════════════════════════════
function draftKey(lot){
  return 'oba_draft_'+(user?user.username:'anon')+'_'+lot.batchName+'_'+lot.lotNumber;
}
function saveDraft(){
  if(!activeLot) return;
  // Stamp each sample with its completion time if not already stamped
  samples.forEach(s=>{
    if(!s.inspectedAt && sampleResult(s)!=='PENDING'){
      s.inspectedAt = new Date().toISOString();
    }
  });
  try{
    localStorage.setItem(draftKey(activeLot), JSON.stringify({
      lot:activeLot, samples:samples,
      lotRemarks:lotRemarksVal,
      savedAt:new Date().toISOString()
    }));
  }catch(e){ /* storage full or blocked - ignore */ }
}
function loadDraft(lot){
  try{
    const raw=localStorage.getItem(draftKey(lot));
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearDraft(lot){
  try{ localStorage.removeItem(draftKey(lot)); }catch(e){}
}
function listDraftsForUser(){
  const out=[];
  const prefix='oba_draft_'+(user?user.username:'anon')+'_';
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.startsWith(prefix)){
      try{
        const d=JSON.parse(localStorage.getItem(k));
        out.push({key:k, ...d});
      }catch(e){}
    }
  }
  return out;
}

function toast(msg,type='ok'){
  clearTimeout(toastTimer);
  const el=document.getElementById('toast');
  el.className=`toast toast-${type}`;
  el.textContent=msg;
  el.style.display='block';
  toastTimer=setTimeout(()=>{ el.style.display='none'; },3500);
}

async function api(action,data={}){
  data.action=action;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
    const text=await r.text();
    // If response starts with < it is an HTML error page (script not deployed / URL wrong)
    if(text.trim().startsWith('<')){
      console.error('Apps Script returned HTML instead of JSON. URL may be wrong or script needs redeployment.');
      return {ok:false, error:'Backend error: The Apps Script URL is invalid or the script needs to be redeployed. Please check the URL and redeploy as a New Version.'};
    }
    return JSON.parse(text);
  }catch(err){
    return {ok:false, error:'Network error: '+err.message+'. Check your internet connection and Apps Script URL.'};
  }
}

// ═══════════════════════════════════════════════════════════
// MODELS (all model data comes from backend — nothing hardcoded)
// ═══════════════════════════════════════════════════════════
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getModel(name){ return models.find(m=>m.name===name)||null; }
function normModel(m){
  return {
    name:String(m.name||'').trim(),
    code:String(m.code||'').trim().padStart(4,'0'),
    maxD:Number(m.maxD), smallD:Number(m.smallD),
    maxN:Number(m.maxN), minDS:Number(m.minDS),
    nA:Number(m.nA), nB:Number(m.nB), nAB:Number(m.nAB)
  };
}
function specText(m){
  if(!m) return 'No spec';
  return `Not visible @2m → OK | D>${m.maxD}mm → FAIL | N>${m.maxN} → FAIL | DS<${m.minDS}mm (when N>1) → FAIL | D≤${m.smallD}mm → OK | ${m.smallD}<D≤${m.maxD}mm → Area A N≤${m.nA} / Area B N≤${m.nB} / A+B N≤${m.nAB}`;
}
function modelOptions(selected){
  return models.map(m=>`<option value="${esc(m.name)}" ${m.name===selected?'selected':''}>${esc(m.name)}  (Code: ${esc(m.code)})</option>`).join('');
}
async function loadModels(){
  const r=await api('getModels');
  if(r.ok) models=(r.models||[]).map(normModel).filter(m=>m.name);
  else console.warn('getModels failed:',r.error);
}
async function loadAll(){ await Promise.all([loadBatches(),loadModels()]); }

async function loadBatches(){
  let r=await api('getBatches');
  if(!r.ok && (r.error||'').toLowerCase().includes('unknown')){
    r=await api('getKits');
    if(r.ok && r.kits){
      // normalize kits to batch format
      r.batches=r.kits.map(k=>({
        batchName:k.kitName||k.batchName||'',
        lotNumber:k.lotNumber||'',
        lotSize:Number(k.lotSize)||90,
        sampleSize:Number(k.sampleSize)||13,
        bdMax:Number(k.bdMax)||0,
        status:k.status||'Open',
        createdBy:k.createdBy||'',
        createdAt:k.createdAt||'',
        result:k.result||'',
        batchQty:Number(k.kitTotalQty)||Number(k.batchQty)||0,
        totalLots:Number(k.totalLots)||0,
        model:k.model||'',
        prodMonthCode:k.prodMonthCode||'',
      prodMonthCode2:k.prodMonthCode2||'',
        fgPassQty:Number(k.fgPassQty)||0
      }));
    }
  }
  if(r.ok) batches=r.batches||[];
}

// ═══════════════════════════════════════════════════════════
// GROUPING
// ═══════════════════════════════════════════════════════════
function groupBatches(){
  const map={},order=[];
  batches.forEach(b=>{
    if(!map[b.batchName]){map[b.batchName]=[];order.push(b.batchName);}
    map[b.batchName].push(b);
  });
  return order.map(name=>{
    const lots=map[name];
    lots.sort((a,b)=>{
      const na=parseInt(String(a.lotNumber).replace(/\D+/g,''))||0;
      const nb=parseInt(String(b.lotNumber).replace(/\D+/g,''))||0;
      return na-nb;
    });
    const batchQty   = Number(lots[0].batchQty)||0;
    const totalLots  = Number(lots[0].totalLots)||lots.length;
    const completed  = lots.filter(l=>l.status==='Closed').length;
    const pending    = lots.filter(l=>l.status==='Open').length;
    const passLots   = lots.filter(l=>l.result==='PASS').length;
    const failLots   = lots.filter(l=>l.result==='FAIL').length;
    const fgTotal    = lots.reduce((s,l)=>s+Number(l.fgPassQty||0),0);
    return{name,lots,batchQty,totalLots,completed,pending,passLots,failLots,fgTotal,
           model:lots[0].model||'',prodMonthCode:lots[0].prodMonthCode||'',prodMonthCode2:lots[0].prodMonthCode2||''};
  });
}

// ═══════════════════════════════════════════════════════════
// SERIAL VALIDATION
// ═══════════════════════════════════════════════════════════
function validateSerial(serial,model,prodMonthCode,batchUsed,prodMonthCode2){
  const s=(serial||'').trim().toUpperCase();
  if(!/^\d{15}$/.test(s)) return 'Must be exactly 15 digits';
  // Model code: first 4 digits
  const md=getModel(model);
  if(!md) return `Model "${model}" not found in model list — ask admin to add it`;
  if(s.substring(0,4)!==md.code){
    return `Model code must be ${md.code} for ${model} — got ${s.substring(0,4)}`;
  }
  // Month codes: digits 5-8 (MMYY)
  let pmc=String(prodMonthCode||'').trim(); if(pmc.length===3) pmc='0'+pmc;
  let pmc2=String(prodMonthCode2||'').trim(); if(pmc2.length===3) pmc2='0'+pmc2;
  const serialMonth=s.substring(4,8);
  const validMonths=[pmc,pmc2].filter(Boolean);
  if(validMonths.length>0 && !validMonths.includes(serialMonth)){
    const labels=validMonths.map(m=>m+' ('+mmyyDisp(m)+')').join(' or ');
    return `Month code must be ${labels} — got ${serialMonth}`;
  }
  const mm=parseInt(s.substring(4,6));
  if(isNaN(mm)||mm<1||mm>12) return 'Month digits invalid (01-12)';
  // Last 7 digits: numeric serial
  if(!/^\d{7}$/.test(s.substring(8))) return 'Last 7 chars must be numeric';
  if((batchUsed||[]).includes(s)) return 'Duplicate serial in this batch';
  return '';
}

// ═══════════════════════════════════════════════════════════
// BLACK DOT LOGIC — limits come from the model's spec (admin-defined)
// ═══════════════════════════════════════════════════════════
function evalBD(s,spec){
  spec=spec||activeSpec;
  if(s.bdNoDot) return {ok:true,reason:'No Black Dot — Acceptable'};
  if(!s.bdVisible) return {ok:true,reason:'Not visible at 2m — Acceptable (any quantity)'};
  if(!spec) return {ok:false,reason:'No Black Dot spec for this model — ask admin'};
  const D=parseFloat(s.bdD), N=parseInt(s.bdN), DS=parseFloat(s.bdDS);
  // Incomplete entry → sample stays PENDING (not a false FAIL)
  if(!(D>0))  return {ok:false,incomplete:true,reason:'Enter D (mm)'};
  if(!(N>=1)) return {ok:false,incomplete:true,reason:'Enter N (spots)'};
  if(N>1 && !(DS>=0) ) return {ok:false,incomplete:true,reason:'Enter DS (mm) — needed when N>1'};
  if(D>spec.maxD) return {ok:false,reason:`D=${D}mm > ${spec.maxD}mm — FAIL`};
  if(N>spec.maxN) return {ok:false,reason:`N=${N} > ${spec.maxN} — FAIL`};
  if(N>1 && DS<spec.minDS) return {ok:false,reason:`DS=${DS}mm < ${spec.minDS}mm — FAIL`};
  const dsTxt=N>1?`, DS=${DS}mm`:'';
  if(D<=spec.smallD) return {ok:true,reason:`D=${D}mm ≤ ${spec.smallD}mm, N=${N}${dsTxt} — OK`};
  // smallD < D <= maxD : area rules
  const area=s.bdArea||'A';
  const lim=area==='A'?spec.nA:area==='B'?spec.nB:spec.nAB;
  if(N<=lim) return {ok:true,reason:`D=${D}mm in Area ${area}, N=${N}≤${lim}${dsTxt} — OK`};
  return {ok:false,reason:`Area ${area}: N=${N}>${lim} — FAIL`};
}

// ═══════════════════════════════════════════════════════════
// SAMPLE RESULT
// ═══════════════════════════════════════════════════════════
function sampleResult(s){
  if(!s.serial||s.serialError) return 'PENDING';
  const bd=evalBD(s);
  if(bd.incomplete) return 'PENDING';
  const major=!s.generalPass||!s.funcPass||!s.screenPass||!bd.ok;
  const minor=!s.aestheticPass;
  if(major) return 'FAIL-MAJOR';
  if(minor) return 'FAIL-MINOR';
  return 'PASS';
}

function freshSamples(n){
  return Array.from({length:n},(_,i)=>({
    num:i+1,serial:'',serialError:'',
    aestheticPass:true,generalPass:true,funcPass:true,screenPass:true,
    bdNoDot:true,bdVisible:false,bdD:'',bdN:'',bdDS:'',bdArea:'A',
    remark:''
  }));
}

function tallyLot(){
  let minor=0,major=0;
  samples.forEach(s=>{
    const r=sampleResult(s);
    if(r==='FAIL-MINOR') minor++;
    if(r==='FAIL-MAJOR') major++;
  });
  return{minor,major,passed:minor<=1&&major===0,filled:samples.filter(s=>sampleResult(s)!=='PENDING').length};
}

    <div class="hdr-right">
      <span class="text-muted mono" style="font-size:13px">${esc(user.name)}, ${user.role}</span>

  </header>
  <div class="main">

  <!-- STATS -->
  <div class="stat-grid fade">
    <div class="stat"><div class="stat-label">Total Lots</div><div class="stat-val">${totalLots}</div></div>
    <div class="stat"><div class="stat-label">Progress</div><div class="stat-val" style="font-size:18px">${done}/${totalLots}</div>
      <div style="margin-top:6px"><div class="progress-bar" style="height:6px"><div class="progress-fill" style="width:${pct}%"></div></div></div>
      <div class="stat-sub">${pct}% done</div></div>
    <div class="stat"><div class="stat-label">Pass Lots</div><div class="stat-val text-pass">${passL}</div><div class="stat-sub text-fail">${failL} fail</div></div>
    <div class="stat"><div class="stat-label">FG Released</div><div class="stat-val text-pass">${fgAll}</div><div class="stat-sub">Certified units</div></div>
  </div>

  <!-- INFO BANNER -->
  <div class="info-banner">
    <b>Acceptance:</b> each lot of 90 units is judged on 13 samples. One aesthetic (minor) defect is allowed. Any general, functional, screen or black dot (major) defect fails the lot.<br>
    ${models.length?models.map(m=>`<b>Black dot, ${esc(m.name)}:</b> ${esc(specText(m))}`).join('<br>'):'<b>Black dot:</b> no models yet. '+(isAdmin?'Add one in Models and black dot spec below.':'Ask an admin to add one.')}
  </div>`;

  // ADMIN PANELS
  if(isAdmin){
    html+=`<div class="grid-3">
    <!-- CREATE BATCH -->
    <div class="card">
      <div class="card-title">Create a batch</div>
      <div class="fg"><label class="lbl">Batch Name</label><input id="bName" class="field" type="text" placeholder="e.g. MODEL-JUN-2026"></div>
      <div class="fg"><label class="lbl">Batch Quantity (total units)</label><input id="bQty" class="field" type="number" placeholder="e.g. 2000" min="1"></div>
      <div class="fg"><label class="lbl">Model</label>
        ${models.length?`<select id="bModel" class="field">${modelOptions('')}</select>`:`<div class="err">No models yet. Add one in Models and black dot spec first.</div><input type="hidden" id="bModel" value="">`}</div>
      <div class="fg"><label class="lbl">Production Month 1</label><input id="bMonth" class="field" type="month"></div>
      <div class="fg"><label class="lbl">Production Month 2 <span style="color:var(--ink-3);font-weight:400">(optional)</span></label><input id="bMonth2" class="field" type="month"></div>
      <button id="btnCreateBatch" class="btn btn-primary btn-full">Create Batch</button>
      <div id="createMsg" class="text-muted hidden" style="margin-top:8px;font-size:13px;line-height:1.6"></div>
      <div class="text-muted" style="margin-top:8px;font-size:12.5px">Lots = Batch Qty ÷ 90. Remainder = extra smaller lot (same 13-sample inspection).</div>
    </div>

      <div class="card-title">Add a user</div>
      <div class="fg"><label class="lbl">Username</label><input id="uUser" class="field" type="text"></div>

      <div class="fg"><label class="lbl">Full Name</label><input id="uName" class="field" type="text"></div>
      <div class="fg"><label class="lbl">Role</label>

      <button id="btnAddUser" class="btn btn-ghost btn-full">Add User</button>
      <div id="addUserMsg" class="text-muted hidden" style="margin-top:8px;font-size:13px"></div>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="card">
      <div class="card-title">Reports</div>
      <button id="btnRefresh" class="btn btn-ghost btn-full" style="margin-bottom:8px">↻ Refresh Data</button>
      <button id="btnCSV" class="btn btn-primary btn-full">⬇ Download CSV Report</button>
      <button id="btnSummary" class="btn btn-ghost btn-full" style="margin-top:8px">📊 View Summary</button>
    </div>
    </div>`;
    html+=buildModelsPanel();
  }

  // BATCH LIST
  html+=`<div id="batchList">`;
  if(groups.length===0){
    html+=`<div class="card" style="text-align:center;padding:40px;color:var(--ink-3)">No batches yet. ${isAdmin?'Create one above.':'Ask admin to create a batch.'}</div>`;
  } else {
    groups.forEach(g=>{
      const pct2=g.totalLots?Math.round(g.completed/g.totalLots*100):0;
      html+=`<div class="batch-group fade">
      <div class="batch-hdr">
        <div>
          <div class="batch-name">${g.name}</div>
          <div class="batch-meta">
            Model <b>${esc(g.model||'-')}</b>, production <b>${mmyyDisp(g.prodMonthCode)}${g.prodMonthCode2?' / '+mmyyDisp(g.prodMonthCode2):''}</b>, <b>${g.batchQty||'?'}</b> units in <b>${g.totalLots}</b> lots<br>
            <b>${g.completed}</b> inspected, <b>${g.pending}</b> open,
            <span class="text-pass"><b class="text-pass">${g.passLots}</b> passed</span>,
            <span class="text-fail"><b class="text-fail">${g.failLots}</b> failed</span>,
            <b class="text-pass">${g.fgTotal}</b> units released
          </div>
          <div class="lot-strip" aria-label="Lot status">${g.lots.map(l=>`<span class="lot-cell ${l.result==='PASS'?'c-pass':l.result==='FAIL'?'c-fail':l.status==='Open'?'c-open':''}" title="${esc(l.lotNumber)}: ${l.result||l.status}"></span>`).join('')}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div>
            <div class="progress-bar" style="width:120px"><div class="progress-fill" style="width:${pct2}%"></div></div>
            <div class="text-muted" style="text-align:right;margin-top:3px">${pct2}%</div>
          </div>
          ${isAdmin?`<button class="btn btn-danger btn-sm delBatchBtn" data-name="${g.name}">🗑 Delete Batch</button>`:''}
        </div>
      </div>`;

      g.lots.forEach(lot=>{
        const ri=batches.indexOf(lot);
        const draft=(!isAdmin && lot.status==='Open') ? loadDraft(lot) : null;
        const draftFilled=draft ? draft.samples.filter(s=>s.serial).length : 0;
        html+=`<div class="lot-row">
          <div>
            <div class="lot-name">${lot.lotNumber}</div>
            <div class="lot-meta">${lot.lotSize} units, ${lot.sampleSize} samples, model ${esc(lot.model||'-')}${getModel(lot.model)?'':' <span class="text-fail">(not in model list)</span>'}</div>
          </div>
          <div class="lot-actions">
            <span class="badge ${lot.status==='Open'?'badge-open':'badge-closed'}">${lot.status}</span>
            ${lot.result?`<span class="badge ${lot.result==='PASS'?'badge-pass':'badge-fail'}">${lot.result}</span>`:''}
            ${draft?`<span class="badge" style="background:var(--open-bg);color:var(--open);border:1px solid var(--open-line)">📝 Draft ${draftFilled}/${draft.samples.length}</span>`:''}
            ${lot.fgPassQty!==0&&lot.fgPassQty!==''?`<span class="text-muted">${lot.fgPassQty} released</span>`:''}
            ${!isAdmin&&lot.status==='Open'?`<button class="btn btn-primary btn-sm startBtn" data-ri="${ri}">${draft?'Resume Inspection':'Start Inspection'}</button>`:''}
            ${isAdmin?`<button class="btn btn-ghost btn-sm editBtn" data-ri="${ri}">Edit</button>`:''}
            ${isAdmin?`<button class="btn btn-danger btn-sm delLotBtn" data-ri="${ri}" style="font-size:12px;padding:4px 8px">🗑</button>`:''}
          </div>
        </div>
        <div id="editArea${ri}" class="hidden" style="padding:12px 18px;background:var(--paper);border-top:1px solid var(--line)"></div>`;
      });
      html+=`</div>`;
    });
  }
  html+=`</div></div>
  <footer class="pg-footer">IS2500 OBA Inspection | Lot Size: 90 | Sample: 13 | Minor Ac≤1 | Major Ac=0 | © 2026</footer>
  </div>`;
  return html;
}

// ─── MODELS PANEL (admin) ─────────────────────────────────
function buildModelsPanel(){
  const em=editingModel?getModel(editingModel):null;
  const v=k=>em?esc(em[k]):'';
  const nf=(id,label,ph,step,hint)=>`<div><label class="lbl">${label}</label><input id="${id}" class="field mono" type="number" step="${step}" min="0" value="${v(id.slice(2))}" placeholder="${ph}"><div class="text-muted" style="font-size:12px;margin-top:3px">${hint}</div></div>`;
  let rows=models.map(m=>`<tr style="border-bottom:1px solid var(--line)">
      <td style="padding:7px 10px;color:var(--ink);font-weight:700">${esc(m.name)}</td>
      <td style="padding:7px 10px">${esc(m.code)}</td>
      <td style="padding:7px 10px;text-align:center">${m.maxD}</td>
      <td style="padding:7px 10px;text-align:center">${m.smallD}</td>
      <td style="padding:7px 10px;text-align:center">${m.maxN}</td>
      <td style="padding:7px 10px;text-align:center">${m.minDS}</td>
      <td style="padding:7px 10px;text-align:center">${m.nA} / ${m.nB} / ${m.nAB}</td>
      <td style="padding:7px 10px;text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm editModelBtn" data-name="${esc(m.name)}">Edit</button>
        <button class="btn btn-danger btn-sm delModelBtn" data-name="${esc(m.name)}" style="padding:4px 8px">🗑</button>
      </td></tr>`).join('');
  if(!rows) rows=`<tr><td colspan="8" style="padding:14px;text-align:center;color:var(--ink-3)">No models yet. Add your first model below.</td></tr>`;
  return `<div class="card">
    <div class="card-title">Models and black dot spec</div>
    <div style="overflow-x:auto;margin-bottom:16px">
      <table style="width:100%;border-collapse:collapse;font-size:13px;font-family:var(--num);color:var(--ink-2)">
        <thead><tr style="background:var(--sunk);font-size:12px;color:var(--ink-3)">
          <th style="padding:7px 10px;text-align:left">Model</th><th style="padding:7px 10px;text-align:left">Serial Code</th>
          <th style="padding:7px 10px">Fail if D &gt; (mm)</th><th style="padding:7px 10px">OK if D ≤ (mm)</th>
          <th style="padding:7px 10px">Max N</th><th style="padding:7px 10px">Min DS (mm)</th>
          <th style="padding:7px 10px">N limit A / B / A+B</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="font-size:13px;font-weight:700;color:var(--open);margin-bottom:10px">${em?'Editing: '+esc(em.name):'Add New Model'}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px">
      <div><label class="lbl">Model Name</label><input id="m_name" class="field" type="text" value="${v('name')}" placeholder="e.g. LH1G"><div class="text-muted" style="font-size:12px;margin-top:3px">Shown everywhere</div></div>
      <div><label class="lbl">Serial Code (4 digits)</label><input id="m_code" class="field mono" type="text" maxlength="4" value="${v('code')}" placeholder="e.g. 1217"><div class="text-muted" style="font-size:12px;margin-top:3px">First 4 digits of serial</div></div>
      ${nf('m_maxD','Fail if D &gt; (mm)','e.g. 2.4','0.01','Any dot bigger = FAIL')}
      ${nf('m_smallD','OK if D ≤ (mm)','e.g. 1.28','0.01','Small dot, no area check')}
      ${nf('m_maxN','Max N (spots)','e.g. 3','1','More spots = FAIL')}
      ${nf('m_minDS','Min DS (mm)','e.g. 15','0.1','Spot spacing, when N&gt;1')}
      ${nf('m_nA','Area A — max N','e.g. 1','1','For mid-size dots')}
      ${nf('m_nB','Area B — max N','e.g. 3','1','For mid-size dots')}
      ${nf('m_nAB','Area A+B — max N','e.g. 3','1','For mid-size dots')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="btnSaveModel" class="btn btn-primary">${em?'Save Changes':'Add Model'}</button>
      ${em?'<button id="btnCancelModel" class="btn btn-ghost">Cancel</button>':''}
    </div>
    <div class="text-muted" style="margin-top:10px;font-size:12.5px;line-height:1.6">Black Dot rule order: not visible @2m → OK · D &gt; Fail limit → FAIL · N &gt; Max N → FAIL · DS &lt; Min DS (only when N&gt;1) → FAIL · D ≤ OK limit → OK · otherwise the Area limit decides. Changes apply to inspections immediately.</div>
  </div>`;
}

          <div><label class="lbl">N (spots)</label><input class="field mono sBDF" data-i="${i}" data-f="bdN" type="number" value="${s.bdN}" placeholder="e.g. 2"></div>

// EVENT BINDING
// ═══════════════════════════════════════════════════════════
function bindEvents(){
  // Setup
  const bs=document.getElementById('btnSetup');
  if(bs) bs.onclick=()=>{ const v=document.getElementById('apiInput').value.trim(); if(!v){toast('Enter URL','err');return;} API=v; localStorage.setItem('oba_api',v); render(); };

  // Login
  const bl=document.getElementById('btnLogin');
  if(bl) bl.onclick=async()=>{
    const u=document.getElementById('lUser').value.trim();
    const p=document.getElementById('lPass').value.trim();
    const err=document.getElementById('lErr');
    err.classList.add('hidden');
    try{
      const r=await api('login',{username:u,password:p});
      if(r.ok){
        user={username:r.username,role:r.role,name:r.name};
        render(); // show dashboard immediately
        loadAll().then(()=>render()); // load batches + models in background
      }
      else{
        err.textContent=r.error||'Login failed';
        err.classList.remove('hidden');
        if((r.error||'').includes('Apps Script')||(r.error||'').includes('redeployed')){
          err.innerHTML=r.error+'<br><br><b>Fix:</b> In Apps Script → Deploy → Manage deployments → pencil icon → New version → Deploy. Then copy the new URL here.';
        }
      }
    }catch(e){ err.textContent='Network error: '+e.message; err.classList.remove('hidden'); }
  };
  const lp=document.getElementById('lPass');
  if(lp) lp.onkeydown=e=>{ if(e.key==='Enter') document.getElementById('btnLogin')?.click(); };

  const bcu=document.getElementById('btnChgUrl');
  if(bcu) bcu.onclick=()=>{ API=''; localStorage.removeItem('oba_api'); render(); };

  // Logout
  const blo=document.getElementById('btnLogout');
  if(blo) blo.onclick=()=>{ user=null; batches=[]; activeLot=null; samples=[]; expandedSample=null; render(); };

  // Refresh
  const br=document.getElementById('btnRefresh');
  if(br) br.onclick=async()=>{ await loadAll(); render(); toast('Refreshed'); };

  // Create Batch
  const bcb=document.getElementById('btnCreateBatch');
  if(bcb) bcb.onclick=async()=>{
    const batchName=document.getElementById('bName').value.trim();
    const batchQty=parseInt(document.getElementById('bQty').value)||0;
    const model=document.getElementById('bModel').value;
    const month=document.getElementById('bMonth').value;
    const month2=document.getElementById('bMonth2')?document.getElementById('bMonth2').value:'';
    const msgEl=document.getElementById('createMsg');
    if(!batchName){ toast('Enter Batch Name','err'); return; }
    if(batchQty<1){ toast('Enter Batch Quantity > 0','err'); return; }
    if(!getModel(model)){ toast('Add a model first','err'); return; }
    const prodMonthCode=month?mmyy(month):'';
    const prodMonthCode2=month2?mmyy(month2):'';
    msgEl.textContent='Creating lots…'; msgEl.classList.remove('hidden');
    try{
      // Try new API first, fall back to old if script not yet updated
      let r=await api('createBatch',{batchName,batchQty,model,prodMonthCode,prodMonthCode2,createdBy:user.username});
      if(!r.ok && (r.error||'').toLowerCase().includes('unknown')){
        // Old script fallback: createKit
        r=await api('createKit',{kitName:batchName,kitSize:batchQty,lotSize:90,sampleSize:13,bdMax:getModel(model).maxD,model,prodMonthCode,prodMonthCode2,createdBy:user.username});
        if(r.ok) r.batchQty=batchQty;
      }
      if(r.ok){
        const lots=r.lotsCreated;
        const rem=batchQty%90;
        msgEl.innerHTML=`✓ <b>${batchName}</b>: <b>${lots} lots</b> created.<br>
          Batch Qty: <b>${batchQty}</b> | Each lot: 90 units | Sample: 13${rem>0?`<br>Last lot: ${rem} units (still 13 samples)`:''}`;
        msgEl.classList.remove('hidden');
        document.getElementById('bName').value='';
        document.getElementById('bQty').value='';
        await loadBatches(); render();
        toast(`✓ ${lots} lots created for ${batchName}`);
      } else {
        msgEl.textContent='Error: '+(r.error||'unknown');
        toast(r.error||'Error','err');
      }
    }catch(e){ msgEl.textContent='Network error: '+e.message; toast('Network error','err'); }
  };

  // Add User
  const bau=document.getElementById('btnAddUser');
  if(bau) bau.onclick=async()=>{
    const username=document.getElementById('uUser').value.trim();
    const password=document.getElementById('uPass').value.trim();
    const name=document.getElementById('uName').value.trim();
    const role=document.getElementById('uRole').value;
    if(!username||!password||!name){ toast('Fill all user fields','err'); return; }
    const r=await api('addUser',{username,password,name,role});
    if(r.ok){ toast(`User ${username} added`); document.getElementById('addUserMsg').textContent=`✓ ${username} added as ${role}`; document.getElementById('addUserMsg').classList.remove('hidden'); document.getElementById('uUser').value=''; document.getElementById('uPass').value=''; document.getElementById('uName').value=''; }
    else toast(r.error||'Error','err');
  };

  // Models: save / edit / cancel / delete
  const bsm=document.getElementById('btnSaveModel');
  if(bsm) bsm.onclick=async()=>{
    const g=id=>document.getElementById(id).value.trim();
    const m={name:g('m_name'),code:g('m_code'),maxD:g('m_maxD'),smallD:g('m_smallD'),maxN:g('m_maxN'),minDS:g('m_minDS'),nA:g('m_nA'),nB:g('m_nB'),nAB:g('m_nAB')};
    if(!m.name) return toast('Enter model name','err');
    if(!/^\d{4}$/.test(m.code)) return toast('Serial code must be exactly 4 digits','err');
    for(const k of ['maxD','smallD','maxN','minDS','nA','nB','nAB']){
      if(m[k]===''||isNaN(Number(m[k]))||Number(m[k])<0) return toast('Fill all Black Dot fields with numbers ≥ 0','err');
      m[k]=Number(m[k]);
    }
    if(!(m.maxD>0)) return toast('Fail D limit must be > 0','err');
    if(m.smallD>m.maxD) return toast('"OK if D ≤" cannot be bigger than "Fail if D >"','err');
    for(const k of ['maxN','nA','nB','nAB']) if(!Number.isInteger(m[k])) return toast('N values must be whole numbers','err');
    if(m.nA>m.maxN||m.nB>m.maxN||m.nAB>m.maxN) return toast('Area N limits cannot exceed Max N','err');
    const dupName=models.find(x=>x.name.toLowerCase()===m.name.toLowerCase()&&x.name!==editingModel);
    if(dupName) return toast('A model with this name already exists','err');
    const dupCode=models.find(x=>x.code===m.code&&x.name!==editingModel);
    if(dupCode) return toast(`Serial code ${m.code} is already used by ${dupCode.name}`,'err');
    bsm.disabled=true;
    const r=await api('saveModel',{model:m,originalName:editingModel||'',updatedBy:user.username});
    bsm.disabled=false;
    if(r.ok){ toast(`Model ${m.name} saved`); editingModel=null; await loadModels(); render(); }
    else toast(r.error||'Save failed','err');
  };
  const bcm=document.getElementById('btnCancelModel');
  if(bcm) bcm.onclick=()=>{ editingModel=null; render(); };
  document.querySelectorAll('.editModelBtn').forEach(btn=>{
    btn.onclick=()=>{ editingModel=btn.getAttribute('data-name'); render(); document.getElementById('m_name')?.scrollIntoView({behavior:'smooth',block:'center'}); };
  });
  document.querySelectorAll('.delModelBtn').forEach(btn=>{
    btn.onclick=async()=>{
      const name=btn.getAttribute('data-name');
      const inUse=batches.filter(b=>b.model===name&&b.status==='Open').length;
      if(!confirm(`Delete model "${name}"?${inUse?`\n\nWARNING: ${inUse} open lot(s) use this model and cannot be inspected until it is added back.`:''}`)) return;
      const r=await api('deleteModel',{name});
      if(r.ok){ toast(`Model ${name} deleted`); if(editingModel===name) editingModel=null; await loadModels(); render(); }
      else toast(r.error||'Delete failed','err');
    };
  });

  // Delete Batch
  document.querySelectorAll('.delBatchBtn').forEach(btn=>{
    btn.onclick=async()=>{
      const name=btn.getAttribute('data-name');
      if(!confirm(`Delete ALL lots in batch "${name}"? Cannot be undone.`)) return;
      const r=await api('deleteBatch',{batchName:name});
      if(r.ok){ await loadBatches(); render(); toast(`Batch "${name}" deleted`); }
      else toast(r.error||'Error','err');
    };
  });

  // Delete Lot
  document.querySelectorAll('.delLotBtn').forEach(btn=>{
    btn.onclick=async()=>{
      const ri=parseInt(btn.getAttribute('data-ri'));
      const lot=batches[ri];
      if(!confirm(`Delete lot "${lot.lotNumber}"?`)) return;
      const r=await api('deleteLot',{batchName:lot.batchName,lotNumber:lot.lotNumber});
      if(r.ok){ await loadBatches(); render(); toast('Lot deleted'); }
      else toast(r.error||'Error','err');
    };
  });

  // Edit Lot
  document.querySelectorAll('.editBtn').forEach(btn=>{
    btn.onclick=()=>{
      const ri=parseInt(btn.getAttribute('data-ri'));
      const lot=batches[ri];
      const area=document.getElementById('editArea'+ri);
      if(!area.classList.contains('hidden')){ area.classList.add('hidden'); area.innerHTML=''; return; }
      area.classList.remove('hidden');
      area.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px">
        <div><label class="lbl">Status</label><select id="eS${ri}" class="field"><option value="Open" ${lot.status==='Open'?'selected':''}>Open</option><option value="Closed" ${lot.status==='Closed'?'selected':''}>Closed</option></select></div>
        <div><label class="lbl">Model</label><select id="eMD${ri}" class="field">${modelOptions(lot.model)}${getModel(lot.model)?'':`<option value="${esc(lot.model)}" selected>${esc(lot.model)} (not in list)</option>`}</select></div>
        <div><label class="lbl">Prod Month 1</label><input id="ePM${ri}" class="field" type="month" value="${mmyyInp(lot.prodMonthCode)}"></div>
        <div><label class="lbl">Prod Month 2</label><input id="ePM2${ri}" class="field" type="month" value="${mmyyInp(lot.prodMonthCode2||'')}"></div>
      </div>
      <button class="btn btn-primary btn-sm saveLotEdit" data-ri="${ri}">Save Changes</button>`;
      area.querySelector('.saveLotEdit').onclick=async()=>{
        const status=document.getElementById('eS'+ri).value;
        const model=document.getElementById('eMD'+ri).value;
        const bdMax=getModel(model)?getModel(model).maxD:lot.bdMax;
        const pm=document.getElementById('ePM'+ri).value;
        const prodMonthCode=pm?mmyy(pm):lot.prodMonthCode;
        const pm2=document.getElementById('ePM2'+ri).value;
        const prodMonthCode2=pm2?mmyy(pm2):(lot.prodMonthCode2||'');
        const r=await api('updateLot',{batchName:lot.batchName,lotNumber:lot.lotNumber,status,bdMax,model,prodMonthCode,prodMonthCode2});
        if(r.ok){ await loadBatches(); render(); toast('Lot updated'); }
        else toast(r.error||'Error','err');
      };
    };
  });

  // Start Inspection
  document.querySelectorAll('.startBtn').forEach(btn=>{
    btn.onclick=()=>{
      const ri=parseInt(btn.getAttribute('data-ri'));
      const lot=batches[ri];
      const spec=getModel(lot.model);
      if(!spec){ toast(`Model "${lot.model}" has no spec — ask admin to add it`,'err'); return; }
      activeSpec=spec; lotRemarksVal='';
      const draft=loadDraft(lot);
      if(draft && draft.samples && draft.samples.length){
        const filled=draft.samples.filter(s=>s.serial).length;
        if(confirm(`A saved draft exists for ${lot.lotNumber} (${filled}/${draft.samples.length} samples filled, saved ${new Date(draft.savedAt).toLocaleString()}).\n\nResume this draft? (Cancel = start fresh)`)){
          activeLot=lot; expandedSample=null;
          samples=draft.samples;
          lotRemarksVal=draft.lotRemarks||'';
          render();
          return;
        } else {
          clearDraft(lot);
        }
      }
      activeLot=lot; expandedSample=null;
      samples=freshSamples(activeLot.sampleSize||SAMPLE_N);
      render();
    };
  });

  // CSV
  const bcsv=document.getElementById('btnCSV');
  if(bcsv) bcsv.onclick=downloadCSV;
  const bsum=document.getElementById('btnSummary');
  if(bsum) bsum.onclick=async()=>{ await loadBatches(); showSummary(); };
  const bclose=document.getElementById('btnCloseSummary');
  if(bclose) bclose.onclick=()=>{
    document.getElementById('summaryScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  };

  // Back from inspection - auto-saves draft, does not lose data
  const back=document.getElementById('btnBackInsp');
  if(back) back.onclick=()=>{
    saveDraft();
    toast('Draft saved — resume anytime from this lot');
    activeLot=null; activeSpec=null; samples=[]; expandedSample=null; render();
  };

  // Sample serial input
  document.querySelectorAll('.sSerial').forEach(el=>{
    el.onchange=async()=>{
      const i=parseInt(el.getAttribute('data-i'));
      samples[i].serial=el.value.trim().toUpperCase();
      const used=samples.filter((_,j)=>j!==i&&samples[j].serial).map(s=>s.serial.toUpperCase());
      let err=validateSerial(samples[i].serial,activeLot.model,activeLot.prodMonthCode,used,activeLot.prodMonthCode2||'');
      if(!err && samples[i].serial){
        try{
          const dup=await api('checkSerial',{serial:samples[i].serial});
          if(dup.ok && dup.exists) err='Duplicate — already exists in master data ('+(dup.batch||'')+' '+(dup.lot||'')+')';
        }catch(e){ /* ignore network errors on dup check */ }
      }
      samples[i].serialError=err;
      saveDraft();
      render();
    };
  });

  // Sample toggles (pass/fail buttons)
  document.querySelectorAll('.sToggle').forEach(btn=>{
    btn.onclick=()=>{
      const i=parseInt(btn.getAttribute('data-i'));
      const f=btn.getAttribute('data-f');
      samples[i][f]=!samples[i][f];
      saveDraft();
      render();
    };
  });

  // Sample tray: jump to a sample
  document.querySelectorAll('.slot').forEach(btn=>{
    btn.onclick=()=>{
      const row=document.getElementById('samp-row-'+btn.getAttribute('data-i'));
      if(!row) return;
      row.scrollIntoView({behavior:'smooth',block:'center'});
      row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'),1200);
      row.querySelector('.sSerial')?.focus({preventScroll:true});
    };
  });

  // Black Dot expand/collapse toggle
  document.querySelectorAll('.bdExpandBtn').forEach(btn=>{
    btn.onclick=()=>{
      const i=parseInt(btn.getAttribute('data-i'));
      expandedSample = (expandedSample===i) ? null : i;
      render();
    };
  });

  // BD no dot checkbox
  document.querySelectorAll('.sBDNoDot').forEach(el=>{
    el.onchange=()=>{ const i=parseInt(el.getAttribute('data-i')); samples[i].bdNoDot=el.checked; saveDraft(); render(); };
  });

  // BD visible checkbox
  document.querySelectorAll('.sBDVis').forEach(el=>{
    el.onchange=()=>{ const i=parseInt(el.getAttribute('data-i')); samples[i].bdVisible=el.checked; saveDraft(); render(); };
  });

  // BD fields
  document.querySelectorAll('.sBDF').forEach(el=>{
    el.onchange=()=>{ const i=parseInt(el.getAttribute('data-i')); const f=el.getAttribute('data-f'); samples[i][f]=el.value; saveDraft(); render(); };
  });

  // Remark
  document.querySelectorAll('.sRemark').forEach(el=>{
    el.onchange=()=>{ const i=parseInt(el.getAttribute('data-i')); samples[i].remark=el.value; saveDraft(); };
  });

  // Lot-level remarks field also triggers save
  const lotRemarksEl=document.getElementById('lotRemarks');
  if(lotRemarksEl) lotRemarksEl.oninput=()=>{ lotRemarksVal=lotRemarksEl.value; saveDraft(); };

  // Submit Lot
  const bsub=document.getElementById('btnSubmitLot');
  if(bsub) bsub.onclick=async()=>{
    const {minor,major,passed}=tallyLot();
    const lotResult=passed?'PASS':'FAIL';
    const fgPassQty=passed?Number(activeLot.lotSize):0;
    const lotRemarks=lotRemarksVal;

    const units=samples.map(s=>{
      const bd=evalBD(s);
      const r=sampleResult(s);
      const fails=[];
      if(!s.aestheticPass) fails.push('Aesthetic Fail (Minor)');
      if(!s.generalPass)   fails.push('General Fail (Major)');
      if(!s.funcPass)      fails.push('Functional Fail (Major)');
      if(!s.screenPass)    fails.push('Screen Fail (Major)');
      if(!bd.ok)           fails.push('Black Dot Fail (Major): '+bd.reason);
      return{
        serial:s.serial,
        aes:s.aestheticPass?'Pass':'Fail',
        general:s.generalPass?'Pass':'Fail',
        func:s.funcPass?'Pass':'Fail',
        screen:s.screenPass?'Pass':'Fail',
        bd:s.bdNoDot?'No BD':(s.bdVisible?bd.reason:'Not visible @2m'),
        remark:fails.length?fails.join(' | '):(s.remark||lotRemarks||'OK'),
        sampleResult:r==='PASS'?'Pass':'Fail',
        inspectedAt: s.inspectedAt || new Date().toISOString()
      };
    });

    const r=await api('submitLot',{
      inspector:user.name,
      batchName:activeLot.batchName,
      lotNumber:activeLot.lotNumber,
      lotResult,fgPassQty,
      bdSpec:specText(activeSpec),
      batchQty:activeLot.batchQty,
      totalLots:activeLot.totalLots,
      model:activeLot.model,
      prodMonthCode:activeLot.prodMonthCode,
      units
    });

    if(r.ok){
      clearDraft(activeLot);
      toast(`${activeLot.lotNumber}: ${lotResult} | FG Pass: ${fgPassQty}`);
      activeLot=null; activeSpec=null; samples=[]; expandedSample=null;
      await loadBatches(); render();
    } else { saveDraft(); toast(r.error||'Save failed — draft kept locally','err'); }
  };
}

// ═══════════════════════════════════════════════════════════
// CSV
// ═══════════════════════════════════════════════════════════
function downloadCSV(){
  const groups=groupBatches();
  let csv='IS2500 OBA Batch Inspection Report\n';
  csv+=`Generated: ${new Date().toLocaleString()}\n\n`;
  csv+='BatchName,LotNumber,Model,ProdMonth,BatchQty,LotSize,SampleSize,Status,Result,FGPassQty\n';
  groups.forEach(g=>{
    g.lots.forEach(l=>{
      csv+=`"${l.batchName}","${l.lotNumber}","${l.model||'-'}","${mmyyDisp(l.prodMonthCode)}",${l.batchQty},${l.lotSize},${l.sampleSize},"${l.status}","${l.result||'Pending'}",${l.fgPassQty||0}\n`;
    });
  });
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`OBA_Report_${Date.now()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ═══════════════════════════════════════════════════════════
// SUMMARY VIEW
// ═══════════════════════════════════════════════════════════
function showSummary(){
  const groups=groupBatches();
  const totalLots=batches.length;
  const doneLots=batches.filter(b=>b.status==='Closed').length;
  const passLots=batches.filter(b=>b.result==='PASS').length;
  const failLots=batches.filter(b=>b.result==='FAIL').length;
  const pendLots=batches.filter(b=>b.status==='Open').length;
  const fgAll=batches.reduce((s,b)=>s+Number(b.fgPassQty||0),0);
  const totalBatchQty=groups.reduce((s,g)=>s+(g.batchQty||0),0);

  let html=`
  <!-- TOTAL SUMMARY -->
  <div style="margin-bottom:24px">
    <div style="font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:14px">Total Summary</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px">
      <div class="stat"><div class="stat-label">Total Batches</div><div class="stat-val">${groups.length}</div></div>
      <div class="stat"><div class="stat-label">Total Lots</div><div class="stat-val">${totalLots}</div></div>
      <div class="stat"><div class="stat-label">Lots Completed</div><div class="stat-val">${doneLots}<span style="font-size:12px;color:var(--ink-3)"> / ${totalLots}</span></div></div>
      <div class="stat"><div class="stat-label">Lots Passed</div><div class="stat-val text-pass">${passLots}</div></div>
      <div class="stat"><div class="stat-label">Lots Failed</div><div class="stat-val" style="color:${failLots>0?'var(--fail)':'var(--ink-3)'}">${failLots}</div></div>
      <div class="stat"><div class="stat-label">Pending Lots</div><div class="stat-val" style="color:var(--minor)">${pendLots}</div></div>
      <div class="stat"><div class="stat-label">FG Released</div><div class="stat-val text-pass">${fgAll}</div><div class="stat-sub">of ${totalBatchQty} units</div></div>
      <div class="stat"><div class="stat-label">Yield Rate</div><div class="stat-val" style="color:var(--open)">${doneLots>0?((passLots/doneLots)*100).toFixed(1):0}%</div></div>
    </div>
  </div>`;

  // PER BATCH SUMMARY
  groups.forEach(g=>{
    const pct=g.totalLots>0?Math.round(g.completed/g.totalLots*100):0;
    const fgPct=g.batchQty>0?Math.round(g.fgTotal/g.batchQty*100):0;
    html+=`
    <div class="batch-group" style="margin-bottom:20px">
      <div style="padding:14px 18px;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-size:14px;font-weight:700;color:var(--ink);font-family:var(--num)">${g.name}</div>
            <div style="font-size:12.5px;color:var(--ink-3);font-family:var(--num);margin-top:3px">
              Model: <b style="color:var(--ink-2)">${g.model||'-'}</b> &nbsp;|&nbsp;
              Prod Month: <b style="color:var(--ink-2)">${mmyyDisp(g.prodMonthCode)}${g.prodMonthCode2?' / '+mmyyDisp(g.prodMonthCode2):''}</b> &nbsp;|&nbsp;
              Batch Qty: <b style="color:var(--ink-2)">${g.batchQty}</b> &nbsp;|&nbsp;
              Total Lots: <b style="color:var(--ink-2)">${g.totalLots}</b>
            </div>
          </div>
          <div style="display:flex;gap:16px;flex-wrap:wrap">
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Completed</div><div style="font-size:18px;font-weight:700;color:var(--ink)">${g.completed}/${g.totalLots}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Pass</div><div style="font-size:18px;font-weight:700;color:var(--pass)">${g.passLots}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Fail</div><div style="font-size:18px;font-weight:700;color:${g.failLots>0?'var(--fail)':'var(--ink-3)'}">${g.failLots}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">FG Released</div><div style="font-size:18px;font-weight:700;color:var(--pass)">${g.fgTotal}</div></div>
            <div style="text-align:center"><div style="font-size:12px;color:var(--ink-3)">Pending</div><div style="font-size:18px;font-weight:700;color:var(--minor)">${g.pending}</div></div>
          </div>
        </div>
        <div style="margin-top:10px;display:flex;gap:16px;flex-wrap:wrap">
          <div style="flex:1;min-width:160px">
            <div style="font-size:12px;color:var(--ink-3);margin-bottom:3px">Lot Progress (${pct}%)</div>
            <div style="background:var(--line);border-radius:4px;height:6px;overflow:hidden"><div style="background:var(--lime);height:100%;width:${pct}%"></div></div>
          </div>
          <div style="flex:1;min-width:160px">
            <div style="font-size:12px;color:var(--ink-3);margin-bottom:3px">FG Release (${fgPct}%)</div>
            <div style="background:var(--line);border-radius:4px;height:6px;overflow:hidden"><div style="background:var(--pass);height:100%;width:${fgPct}%"></div></div>
          </div>
        </div>
      </div>

      <!-- LOT WISE TABLE -->
      <div style="overflow-x:auto">
        <table class="summ-table" style="width:100%;border-collapse:collapse;font-size:13px;font-family:var(--num)">
          <thead>
            <tr style="background:var(--sunk);color:var(--ink-3);font-size:12px">
              <th style="padding:8px 14px;text-align:left;border-bottom:1px solid var(--line)">#</th>
              <th style="padding:8px 14px;text-align:left;border-bottom:1px solid var(--line)">Lot Number</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Lot Size</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Sample</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Status</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">Result</th>
              <th style="padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)">FG Qty</th>
            </tr>
          </thead>
          <tbody>
    `;
    g.lots.forEach((lot,idx)=>{
      const resBg=lot.result==='PASS'?'background:var(--pass-bg);color:var(--pass)':lot.result==='FAIL'?'background:var(--fail-bg);color:var(--fail)':'background:var(--line);color:var(--ink-3)';
      const stBg=lot.status==='Open'?'background:var(--open-bg);color:var(--open)':'background:var(--line);color:var(--ink-3)';
      html+=`<tr style="border-bottom:1px solid var(--paper);${idx%2===0?'':'background:var(--paper)'}">
        <td style="padding:8px 14px;color:var(--ink-3)">${idx+1}</td>
        <td style="padding:8px 14px;color:var(--ink);font-weight:700">${lot.lotNumber}</td>
        <td style="padding:8px 10px;text-align:center;color:var(--ink-2)">${lot.lotSize}</td>
        <td style="padding:8px 10px;text-align:center;color:var(--ink-2)">${lot.sampleSize}</td>
        <td style="padding:8px 10px;text-align:center"><span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;${stBg}">${lot.status}</span></td>
        <td style="padding:8px 10px;text-align:center">${lot.result?`<span style="font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;${resBg}">${lot.result}</span>`:'<span style="color:var(--ink-3)">—</span>'}</td>
        <td style="padding:8px 10px;text-align:center;font-weight:700;color:${lot.fgPassQty>0?'var(--pass)':'var(--ink-3)'}">${lot.fgPassQty>0?lot.fgPassQty:'—'}</td>
      </tr>`;
    });
    html+=`<tr style="background:var(--sunk);font-weight:700">
      <td colspan="6" style="padding:8px 14px;color:var(--ink-2);text-align:right">Batch Total FG Released:</td>
      <td style="padding:8px 10px;text-align:center;color:var(--pass);font-weight:700">${g.fgTotal}</td>
    </tr>`;
    html+=`</tbody></table></div></div>`;
  });

  document.getElementById('summaryContent').innerHTML=html;
  // Copy logo src
  const mainLogo=document.querySelector('.logo img');
  const summLogo=document.getElementById('summLogoImg');
  if(mainLogo && summLogo) summLogo.src=mainLogo.src;

  document.getElementById('app').classList.add('hidden');
  document.getElementById('summaryScreen').classList.remove('hidden');
}

window.addEventListener('beforeunload', ()=>{
  if(activeLot && samples.length) saveDraft();
});

render();
</script>

<!-- SUMMARY SCREEN -->
<div id="summaryScreen" class="hidden" style="min-height:100vh;background:var(--paper)">
  <header class="hdr">
    <div class="hdr-left">
      <div class="logo"><img src="" alt="Lumio" id="summLogoImg"></div>
      <div><div class="hdr-title">Inspection summary</div>
        <div class="hdr-sub">IS 2500 level G2, lots of 90, 13 samples each</div>
      </div>
    </div>
    <div class="hdr-right">
      <button id="btnCloseSummary" class="btn btn-ghost btn-sm">← Back</button>
      <button id="btnPrint" class="btn btn-primary btn-sm" onclick="window.print()">🖨 Print</button>
    </div>
  </header>
  <div style="max-width:1200px;margin:0 auto;padding:24px" id="summaryContent"></div>
</div>
</body>
</html>
